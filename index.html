  const [msg, setMsg] = useState("");
  const [cfgOk, setCfgOk] = useState(CLOUD.configured());
  const [fbText, setFbText] = useState("");
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [cloudMsg, setCloudMsg] = useState("");
  const [cloudBusy, setCloudBusy] = useState(false);
  const fileRef = useRef(null);

  const frAuthError = (e) => {
    const c = (e && e.code) || "";
    if (c.includes("invalid-credential") || c.includes("wrong-password")) return "E-mail ou mot de passe incorrect.";
    if (c.includes("user-not-found")) return "Aucun compte avec cet e-mail — utilisez « Créer le compte » la première fois.";
    if (c.includes("email-already-in-use")) return "Un compte existe déjà avec cet e-mail — utilisez « Se connecter ».";
    if (c.includes("weak-password")) return "Mot de passe trop court (6 caractères minimum).";
    if (c.includes("invalid-email")) return "Adresse e-mail invalide.";
    if (c.includes("network-request-failed")) return "Pas de connexion internet.";
    if (c.includes("operation-not-allowed")) return "Activez la connexion « E-mail/Mot de passe » dans Firebase (Authentication → Sign-in method).";
    return (e && e.message) || "Erreur inconnue.";
  };

  const activerCloud = () => {
    try {
      const cfg = parseFbConfig(fbText);
      CLOUD.setCfg(cfg);
      if (!CLOUD.init()) throw new Error("Initialisation impossible — vérifiez la configuration collée.");
      onCloudInit && onCloudInit();
      setCfgOk(true);
      setCloudMsg("Projet relié. Connectez-vous maintenant avec un e-mail et un mot de passe — le même compte sur tous vos appareils.");
    } catch (e) { setCloudMsg(e.message); }
  };

  const login = async (creation) => {
    setCloudBusy(true); setCloudMsg("");
    try {
      if (creation) await CLOUD.auth.createUserWithEmailAndPassword(email.trim(), pwd);
      else await CLOUD.auth.signInWithEmailAndPassword(email.trim(), pwd);
      setCloudMsg("Connecté — synchronisation lancée.");
      setPwd("");
    } catch (e) { setCloudMsg(frAuthError(e)); }
    setCloudBusy(false);
  };

  const retirerCloud = () => {
    if (!window.confirm("Retirer la configuration Firebase de cet appareil ? (les dossiers locaux et la base en ligne sont conservés)")) return;
    CLOUD.clearCfg();
    window.location.reload();
  };

  const save = () => {
    CFG.set("provider", provider);
    CFG.set("apikey", key.trim());
    CFG.set("gkey", gkey.trim());
    CFG.set("model", model);
    CFG.set("search", search ? "1" : "0");
    onClose();
  };

  const exporter = () => {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if ((k.startsWith("acccom:") || k.startsWith("acdcom:")) && k !== "acccom:apikey" && k !== "acccom:gkey") data[k] = localStorage.getItem(k);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "acccom-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    setMsg("Sauvegarde téléchargée (dossiers + réglages, hors clés API). Conservez ce fichier ou importez-le sur un autre poste.");
  };

  const importer = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        let n = 0;
        for (const [k, v] of Object.entries(data)) {
          if ((k.startsWith("acccom:") || k.startsWith("acdcom:")) && k !== "acccom:apikey" && k !== "acccom:gkey") { localStorage.setItem(k, v); n++; }
        }
        setMsg(n + " éléments restaurés. Vos dossiers sont à jour sur ce poste.");
        onDataChanged && onDataChanged();
      } catch (err) { setMsg("Fichier illisible : " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>Réglages</h3>
        <Field label="Fournisseur d'IA">
          <div className="duree" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <button type="button" className={provider === "anthropic" ? "sel" : ""}
              onClick={() => setProvider("anthropic")}>
              <div className="d-num">Claude</div>
              <div className="d-lab">Payant à l'usage (~2-5 ct/diagnostic) — meilleure qualité, données non utilisées pour l'entraînement</div>
            </button>
            <button type="button" className={provider === "gemini" ? "sel" : ""}
              onClick={() => setProvider("gemini")}>
              <div className="d-num">Gemini</div>
              <div className="d-lab">Gratuit (quotas journaliers) — Google peut utiliser les données envoyées pour améliorer ses services</div>
            </button>
          </div>
        </Field>
        {provider === "anthropic" && (
          <Field label="Clé API Anthropic" hint="créée sur console.anthropic.com — elle reste dans votre navigateur, jamais transmise ailleurs qu'à l'API">
            <input type="password" value={key} onChange={(e) => setKey(e.target.value)} placeholder="sk-ant-…" />
          </Field>
        )}
        {provider === "gemini" && (
          <>
            <Field label="Clé API Google Gemini" hint="créée gratuitement sur aistudio.google.com (bouton « Get API key ») — elle reste dans votre navigateur">
              <input type="password" value={gkey} onChange={(e) => setGkey(e.target.value)} placeholder="AIza…" />
            </Field>
            <div className="export-note" style={{ marginBottom: 16 }}>
              Confidentialité : sur le palier gratuit, Google peut exploiter le contenu envoyé (vos données d'audit) pour améliorer ses services. Évitez d'y saisir des informations sensibles ou nominatives, ou anonymisez le formulaire — pour les dossiers confidentiels, préférez Claude.
            </div>
          </>
        )}
        {provider === "anthropic" && (
        <Field label="Vitesse de génération">
          <div className="duree" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <button type="button" className={model === "claude-haiku-4-5" ? "sel" : ""}
              onClick={() => setModel("claude-haiku-4-5")}>
              <div className="d-num">Rapide</div>
              <div className="d-lab">Idéal en rendez-vous (modèle Haiku)</div>
            </button>
            <button type="button" className={model === "claude-sonnet-4-6" ? "sel" : ""}
              onClick={() => setModel("claude-sonnet-4-6")}>
              <div className="d-num">Approfondi</div>
              <div className="d-lab">Analyse plus fouillée (modèle Sonnet)</div>
            </button>
          </div>
        </Field>
        )}
        {provider === "anthropic" && (
        <Field label="Recherche web pour l'analyse externe" hint="plus précis mais nettement plus lent — à désactiver en rendez-vous">
          <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, fontWeight: 400, cursor: "pointer" }}>
            <input type="checkbox" checked={search} onChange={(e) => setSearch(e.target.checked)}
              style={{ width: 18, height: 18, accentColor: "var(--pine)" }} />
            Activer la recherche web (sinon l'IA s'appuie sur ses connaissances du secteur)
          </label>
        </Field>
        )}
        <Field label="Synchronisation multi-appareils" hint="via votre projet Firebase — retrouvez les mêmes dossiers sur PC, portable et téléphone">
          {!cfgOk && (
            <>
              <textarea rows={5} value={fbText} onChange={(e) => setFbText(e.target.value)}
                placeholder={'Collez ici la configuration de votre projet Firebase :\n{\n  apiKey: "AIza…",\n  authDomain: "…", projectId: "…", …\n}'} />
              <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
                <button className="btn btn-soft" onClick={activerCloud}>Relier mon projet Firebase</button>
              </div>
            </>
          )}
          {cfgOk && !cloudUser && (
            <>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                placeholder="Adresse e-mail" autoComplete="email" style={{ marginBottom: 8 }} />
              <input type="password" value={pwd} onChange={(e) => setPwd(e.target.value)}
                placeholder="Mot de passe (6 caractères min.)" autoComplete="current-password" />
              <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
                <button className="btn btn-primary" disabled={cloudBusy || !email || !pwd} onClick={() => login(false)}>Se connecter</button>
                <button className="btn btn-soft" disabled={cloudBusy || !email || !pwd} onClick={() => login(true)}>Créer le compte</button>
                <button className="btn btn-ghost" onClick={retirerCloud}>Retirer la configuration</button>
              </div>
            </>
          )}
          {cfgOk && cloudUser && (
            <>
              <div className="export-note" style={{ marginBottom: 10 }}>
                Connecté : <strong>{cloudUser}</strong> — {syncState === "sync" ? "synchronisation en cours…"
                  : syncState === "ok" ? "dossiers synchronisés." : syncState === "err" ? "dernière synchronisation en erreur (voir le guide ci-dessous : règles Firestore)." : "en attente."}
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <button className="btn btn-soft" disabled={syncState === "sync"} onClick={onSync}>Synchroniser maintenant</button>
                <button className="btn btn-ghost" onClick={() => CLOUD.auth.signOut()}>Se déconnecter</button>
                <button className="btn btn-ghost" onClick={retirerCloud}>Retirer la configuration</button>
              </div>
            </>
          )}
          {cloudMsg && <div className="export-note" style={{ marginTop: 10 }}>{cloudMsg}</div>}
          <details style={{ marginTop: 10 }}>
            <summary style={{ cursor: "pointer", fontSize: 13, color: "var(--muted)" }}>Guide de mise en place (console Firebase)</summary>
            <div className="export-note" style={{ marginTop: 8 }}>
              <p style={{ margin: "0 0 8px" }}>Dans <strong>console.firebase.google.com</strong>, sur votre projet :</p>
              <p style={{ margin: "0 0 6px" }}>1 — <strong>Authentication → Sign-in method</strong> : activez « E-mail/Mot de passe ».</p>
              <p style={{ margin: "0 0 6px" }}>2 — <strong>Firestore Database</strong> : créez la base (mode production), puis dans l'onglet <strong>Règles</strong>, remplacez tout par :</p>
              <pre style={{ background: "var(--input-bg)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, fontSize: 11.5, overflowX: "auto", margin: "0 0 6px" }}>{
`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid}/{document=**} {
      allow read, write: if request.auth != null
                          && request.auth.uid == uid;
    }
  }
}`}</pre>
              <p style={{ margin: "0 0 6px" }}>3 — <strong>Paramètres du projet → Général → Vos applications</strong> : créez une application Web si besoin, puis copiez le bloc <code>firebaseConfig</code> et collez-le ci-dessus.</p>
              <p style={{ margin: 0 }}>4 — Répétez « Relier mon projet » + connexion (même e-mail) sur chaque appareil. Cette configuration n'est pas secrète : ce sont les règles ci-dessus et votre mot de passe qui protègent vos données.</p>
            </div>
          </details>
        </Field>
        <Field label="Vos données" hint="dossiers et documents de ce navigateur">
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="btn btn-soft" onClick={exporter}>Exporter une sauvegarde</button>
            <button className="btn btn-soft" onClick={() => fileRef.current && fileRef.current.click()}>Importer une sauvegarde</button>
            <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importer} />
          </div>
        </Field>
        {msg && <div className="export-note">{msg}</div>}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
          <button className="btn btn-ghost" onClick={onClose}>Fermer</button>
          <button className="btn btn-primary" onClick={save}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [view, setView] = useState("home"); // home | form | clients | client
  const [index, setIndex] = useState([]);
  const [current, setCurrent] = useState(null); // client data
  const [editMode, setEditMode] = useState(false);
  const [busy, setBusy] = useState(false);
  const [generating, setGenerating] = useState(false);
  const [genStage, setGenStage] = useState("");
  const [genError, setGenError] = useState(null);
  const [suiviBusy, setSuiviBusy] = useState(false);
  const [suiviStage, setSuiviStage] = useState("");
  const [suiviError, setSuiviError] = useState(null);
  const [showDocModal, setShowDocModal] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [ready, setReady] = useState(false);
  const [dark, setDark] = useState(false);
  const [cloudUser, setCloudUser] = useState(null);   // e-mail du compte connecté
  const [syncState, setSyncState] = useState("off");  // off | sync | ok | err

  const doSync = async () => {
    if (!CLOUD.ready()) return;
    setSyncState("sync");
    try {
      const nextIdx = await fullSync();
      if (nextIdx) setIndex(nextIdx);
      setSyncState("ok");
    } catch (e) { console.error("Sync:", e); setSyncState("err"); }
  };

  const cloudAttached = useRef(false);
  const attachCloud = () => {
    if (cloudAttached.current || !CLOUD.init()) return;
    cloudAttached.current = true;
    CLOUD.auth.onAuthStateChanged((u) => {
      setCloudUser(u ? u.email : null);
      if (u) doSync(); else setSyncState("off");
    });
  };

  useEffect(() => {
    (async () => {
      setIndex(await loadIndex());
      try {
        const t = await appStorage.get("acdcom:theme");
        if (t && t.value === "dark") setDark(true);
      } catch (_) { /* pas de préférence enregistrée */ }
      setReady(true);
      attachCloud();
    })();
  }, []);

  const toggleTheme = async () => {
    const next = !dark;
    setDark(next);
    try { await appStorage.set("acdcom:theme", next ? "dark" : "light"); } catch (e) { console.error(e); }
  };

  const refreshIndex = async (updated) => { setIndex(updated); await saveIndex(updated); };

  const openClient = async (id) => {
    const c = await loadClient(id);
    if (c) { setCurrent({ id, ...c }); setGenError(null); setView("client"); }
  };

  const persistCurrent = async (data) => {
    const { id, ...rest } = data;
    rest.updatedAt = new Date().toISOString();
    await saveClient(id, rest);
    const next = [...index.filter((c) => c.id !== id), indexEntry(id, rest)];
    await refreshIndex(next);
    setCurrent({ id, ...rest });
    if (CLOUD.ready()) CLOUD.push(id, rest).catch((e) => { console.error(e); setSyncState("err"); });
  };

  const runGeneration = async (data) => {
    if (!CFG.activeKey()) {
      setShowSettings(true);
      setGenError(CFG.provider() === "gemini"
        ? "Renseignez d'abord votre clé Gemini gratuite dans les réglages (bouton ⚙ en haut à droite)."
        : "Renseignez d'abord votre clé API Anthropic dans les réglages (bouton ⚙ en haut à droite).");
      return;
    }
    setGenerating(true); setGenError(null); setGenStage("");
    try {
      const result = await generateAnalysis(data.form, setGenStage);
      const updated = { ...data, result, resultAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      await persistCurrent(updated);
    } catch (e) {
      console.error(e);
      if (e.message === "NO_KEY") {
        setShowSettings(true);
        setGenError("Clé API absente ou invalide — vérifiez-la dans les réglages (bouton ⚙).");
      } else {
        setGenError(e.message || "erreur inconnue");
      }
    } finally { setGenerating(false); }
  };

  const handleSubmitForm = async (form) => {
    setBusy(true);
    try {
      const now = new Date().toISOString();
      let data;
      if (editMode && current) {
        data = { ...current, form, updatedAt: now };
      } else {
        data = { id: uid(), form, documents: [], result: null, periodes: [], createdAt: now, updatedAt: now };
      }
      await persistCurrent(data);
      setView("client");
      // Un dossier dont le suivi est engagé (bilans déjà générés) n'est pas
      // régénéré automatiquement après une simple modification de l'audit :
      // cela écraserait le plan initial dont dépendent les périodes suivantes.
      const suiviEngage = (data.periodes || []).length > 0 || data.cloture;
      if (!data.result || !suiviEngage) runGeneration(data);
    } finally { setBusy(false); setEditMode(false); }
  };

  /* Bilan de fin de période : évalue la période écoulée puis génère le plan
     de la période suivante (ou le bilan de clôture en fin d'accompagnement). */
  const handleBilanSubmit = async (bilan) => {
    if (!current || !current.result) return false;
    if (!CFG.activeKey()) {
      setShowSettings(true);
      setSuiviError("Renseignez d'abord votre clé API dans les réglages (bouton ⚙ en haut à droite).");
      return false;
    }
    const f = current.form;
    const meta = suiviMeta(f);
    const periodes = current.periodes || [];
    const numPeriode = nbPlanifiees(current);          // période dont on dresse le bilan
    const prevPlan = numPeriode === 1 ? current.result.plan : periodes[periodes.length - 1].plan;
    const cloture = numPeriode >= meta.total;
    setSuiviBusy(true); setSuiviError(null); setSuiviStage("");
    try {
      const out = await generateSuivi(f, prevPlan, bilan, numPeriode, cloture, setSuiviStage);
      const now = new Date().toISOString();
      const updated = cloture
        ? { ...current, cloture: { bilan, synth: out.synth, at: now }, updatedAt: now }
        : { ...current, periodes: [...periodes, { id: uid(), num: numPeriode + 1, bilan, synth: out.synth, plan: out.plan, at: now }], updatedAt: now };
      await persistCurrent(updated);
      return true;
    } catch (e) {
      console.error(e);
      if (e.message === "NO_KEY") {
        setShowSettings(true);
        setSuiviError("Clé API absente ou invalide — vérifiez-la dans les réglages (bouton ⚙).");
      } else {
        setSuiviError(e.message || "erreur inconnue");
      }
      return false;
    } finally { setSuiviBusy(false); }
  };

  const handleAddDoc = async (titre, contenu) => {
    const doc = { id: uid(), titre, contenu, date: new Date().toISOString() };
    const updated = { ...current, documents: [doc, ...(current.documents || [])], updatedAt: new Date().toISOString() };
    await persistCurrent(updated);
    setShowDocModal(false);
  };

  const handleDeleteDoc = async (docId) => {
    const updated = { ...current, documents: (current.documents || []).filter((d) => d.id !== docId), updatedAt: new Date().toISOString() };
    await persistCurrent(updated);
  };

  const handleDeleteClient = async () => {
    if (!window.confirm("Supprimer définitivement ce dossier client ?")) return;
    await deleteClient(current.id);
    if (CLOUD.ready()) CLOUD.remove(current.id).catch(console.error);
    await refreshIndex(index.filter((c) => c.id !== current.id));
    setCurrent(null); setView("clients");
  };

  return (
    <div className={"acd" + (dark ? " dark" : "")}>
      <style>{CSS}</style>
      <div className="topbar">
        <div className="wrap topbar-in">
          <Wordmark onClick={() => { setView("home"); setCurrent(null); }} />
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div className="crumb">
              {view !== "home" && <button onClick={() => setView("home")}>Accueil</button>}
              {(view === "clients" || view === "client") && <><span>/</span><button onClick={() => { setView("clients"); setCurrent(null); }}>Dossiers</button></>}
              {view === "client" && current && <><span>/</span><span>{current.form.entreprise}</span></>}
              {view === "form" && <><span>/</span><span>{editMode ? "Modification" : "Nouvel audit"}</span></>}
            </div>
            {CLOUD.configured() && (
              <button className="cloud-pill" onClick={() => setShowSettings(true)}
                title={cloudUser ? "Compte : " + cloudUser : "Synchronisation non connectée"}>
                {syncState === "sync" ? "⟳ Synchro…"
                  : syncState === "ok" ? "☁ Synchronisé"
                  : syncState === "err" ? "☁ Erreur de synchro"
                  : "☁ Hors connexion"}
              </button>
            )}
            <button className="theme-btn" onClick={() => setShowSettings(true)}
              title="Réglages" aria-label="Réglages">⚙</button>
            <button className="theme-btn" onClick={toggleTheme}
              title={dark ? "Passer en mode clair" : "Passer en mode sombre"}
              aria-label={dark ? "Passer en mode clair" : "Passer en mode sombre"}>
              {dark ? "☀" : "☾"}
            </button>
          </div>
        </div>
      </div>

      {!ready && <div className="gen-overlay"><div className="spin" /><p>Chargement…</p></div>}

      {ready && view === "home" && (
        <Home count={index.length}
          onNew={() => { setEditMode(false); setCurrent(null); setView("form"); }}
          onClients={() => setView("clients")} />
      )}

      {ready && view === "form" && (
        <AuditForm
          initial={editMode && current ? current.form : null}
          busy={busy}
          onCancel={() => setView(editMode ? "client" : "home")}
          onSubmit={handleSubmitForm} />
      )}

      {ready && view === "clients" && (
        <ClientList index={index} onOpen={openClient}
          onNew={() => { setEditMode(false); setCurrent(null); setView("form"); }} />
      )}

      {ready && view === "client" && current && (
        <ClientDetail
          client={current}
          generating={generating}
          genStage={genStage}
          genError={genError}
          onBilanSubmit={handleBilanSubmit}
          suiviBusy={suiviBusy}
          suiviStage={suiviStage}
          suiviError={suiviError}
          onBack={() => { setView("clients"); setCurrent(null); setSuiviError(null); }}
          onEditAudit={() => { setEditMode(true); setView("form"); }}
          onRegenerate={() => runGeneration(current)}
          onAddDoc={() => setShowDocModal(true)}
          onDeleteDoc={handleDeleteDoc}
          onDelete={handleDeleteClient} />
      )}

      {showDocModal && <DocModal onClose={() => setShowDocModal(false)} onSave={handleAddDoc} />}
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)}
        onDataChanged={async () => setIndex(await loadIndex())}
        cloudUser={cloudUser} syncState={syncState}
        onCloudInit={attachCloud} onSync={doSync} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
