        <P>Sont en outre exclus : la réalisation d'actes de prospection ou de vente au nom et pour le compte du Client,

        <P>Certaines prestations, notamment la création de site web, sont réalisées par un partenaire du Prestataire.

/* ---------------- signature electronique ----------------
   Signature manuscrite trace a la souris ou au doigt, horodatee, accompagnee
   d'une empreinte SHA-256 du contenu exact du contrat. L'empreinte permet de
   demontrer apres coup que le document n'a pas ete modifie depuis la signature :
   le moindre caractere change produit une empreinte totalement differente.
   Il s'agit d'une signature electronique SIMPLE au sens du reglement eIDAS :
   recevable en justice, mais sans presomption de fiabilite. */

/* empreinte stable du contrat : on normalise les espaces pour qu'une difference
   de mise en page n'invalide pas une signature pourtant legitime */
async function empreinteContrat(texte) {
  const norm = String(texte).replace(/\s+/g, " ").trim();
  const buf = new TextEncoder().encode(norm);
  if (!(crypto && crypto.subtle)) return null;      // contexte non securise
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
const empreinteCourte = (e) => (e ? e.slice(0, 8) + " " + e.slice(8, 16) + " " + e.slice(16, 24) + " " + e.slice(24, 32) : "");

/* Zone de trace : souris, stylet et doigt. */
function SignaturePad({ onChange, disabled }) {
  const ref = useRef(null);
  const dessine = useRef(false);
  const vide = useRef(true);

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#241820";
  }, []);

  const pos = (e) => {
    const r = ref.current.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const debut = (e) => {
    if (disabled) return;
    e.preventDefault();
    dessine.current = true; vide.current = false;
    const ctx = ref.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.beginPath(); ctx.moveTo(x, y);
  };
  const trace = (e) => {
    if (!dessine.current || disabled) return;
    e.preventDefault();
    const ctx = ref.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.lineTo(x, y); ctx.stroke();
  };
  const fin = () => {
    if (!dessine.current) return;
    dessine.current = false;
    onChange(vide.current ? null : ref.current.toDataURL("image/png"));
  };
  const effacer = () => {
    const cv = ref.current, ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    vide.current = true; onChange(null);
  };

  return (
    <div className="sig-pad">
      <canvas ref={ref}
        onMouseDown={debut} onMouseMove={trace} onMouseUp={fin} onMouseLeave={fin}
        onTouchStart={debut} onTouchMove={trace} onTouchEnd={fin} />
      <div className="sig-foot">
        <span>Signez dans le cadre, au doigt ou à la souris</span>
        <button type="button" className="btn btn-ghost" onClick={effacer} disabled={disabled}>Effacer</button>
      </div>
    </div>
  );
}

/* Rendu des phases d'un plan (partagé entre le document initial et les suivis) */
function PhaseList({ plan }) {
  return (plan || []).map((ph, i) => (
    <div key={i} className={`phase ph-${i}`}>
      <div className="phase-head">
        <span className="p-num">{["J30", "J60", "J90"][i] || ph.periode}</span>
        <span className="p-per">{ph.periode}</span>
        <span className="p-obj">{ph.objectif}</span>
      </div>
      {(ph.actions || []).map((a, j) => {
        // découpe la description en sous-étapes si elle contient "(1) … (2) …"
        let intro = a.description, steps = [];
        if (/\(\d+\)/.test(a.description || "")) {
          const m = String(a.description).split(/\((\d+)\)/);
          intro = m[0].trim().replace(/[:\-–—]\s*$/, "").trim();
          for (let k = 1; k < m.length; k += 2) {
            const txt = (m[k + 1] || "").trim().replace(/^[,:]\s*/, "");
            if (txt) steps.push(txt);
          }
        }
        return (
          <div key={j} className="action">
            <span className="a-n">{j + 1}</span>
            <div className="a-body">
              <b className="a-titre">{a.titre}</b>
              {steps.length > 0 ? (
                <>
                  {intro && <p className="a-desc">{intro} :</p>}
                  <ul className="a-steps">
                    {steps.map((st, s) => <li key={s}>{st}</li>)}
                  </ul>
                </>
              ) : (
                <p className="a-desc">{a.description}</p>
              )}
              {a.responsable && (
                <span className="a-pilote"><em>Pilote</em>{a.responsable}</span>
              )}
            </div>
            <div className="a-kpi"><small>Indicateur</small>{a.kpi}</div>
          </div>
        );
      })}
      {ph.livrables && ph.livrables.length > 0 && (
        <div className="livrables"><b>Livrables de phase</b> — {ph.livrables.join(" · ")}</div>
      )}
    </div>
  ));
}

const cadenceLab = (plan) => {
  const n = (plan || []).length;
  return n <= 1 ? "Cadence 30 jours" : n === 2 ? "Cadence 30 · 60" : "Cadence 30 · 60 · 90";
};

        <h1>{f.entreprise} — <em>bilan période {numBilan} &amp; plan période {periode.num}</em></h1>

      <div className="synth">{s.synthese}</div>

      <div className="sec-title"><h2>Bilan de la période {numBilan}</h2><span className="rule" /><span className="lab">Résultats constatés</span></div>
      <BilanQuad synth={s} />

      {s.axes && s.axes.length > 0 && (
        <>
          <div className="sec-title"><h2>Axes de la période {periode.num}</h2><span className="rule" /><span className="lab">Continuité</span></div>

/* ---------------- affinage d'un plan déjà généré ---------------- */

/* Réécrit UNE phase selon la demande du consultant. Le traitement reste phase
   par phase : les réponses restent courtes, donc fiables, et chacune repasse
   par le contrôle de complétude. */
async function affinerPhase(form, phase, consigne, idx, total) {
  const prompt = `${ROLE}

Tu affines UNE phase d'un plan d'action commercial déjà rédigé et validé, selon une demande précise du consultant qui connaît son client.

PHASE ACTUELLE (phase ${idx + 1} sur ${total}) :
${JSON.stringify(phase)}

CONTEXTE DU CLIENT :
${dataBlock(form)}${perimetreBlock(form)}

DEMANDE DU CONSULTANT :
"${consigne}"

RÈGLES :
- Applique la demande à cette phase si elle la concerne. Si elle ne la concerne pas, renvoie la phase STRICTEMENT INCHANGÉE.
- Conserve la période "${phase.periode}" à l'identique.
- Garde 4 à 5 actions, chacune avec titre, description opérationnelle (70 mots maximum, phrase complète), responsable et KPI chiffré.
- Ne supprime pas une action pertinente sans raison : privilégie la reformulation, l'ajustement de cible ou le remplacement ciblé.

Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{
  "periode": "${phase.periode}",
  "objectif": "string",
  "actions": [{"titre":"string","description":"string","responsable":"string","kpi":"string"}],
  "livrables": ["string"]
}`;
  return callAndParse(prompt, { search: false, maxTokens: 8000 }, 3, checkPhase);
}

/* Applique la demande à toutes les phases du plan, en parallèle. */
async function affinerPlan(form, plan, consigne, onStage) {
  const total = plan.length;
  onStage && onStage(total > 1 ? `Application de votre demande aux ${total} phases…` : "Application de votre demande…");
  return Promise.all(plan.map((ph, i) => affinerPhase(form, ph, consigne, i, total)));
}

/* ---------------- export du document (impression PDF) ---------------- */
function exportDocument(client, label) {
  const zone = document.querySelector(".print-zone");
  if (!zone) return false;
  const name = (client.form.entreprise || "client").replace(/[^\p{L}\p{N}]+/gu, "-");
  const suffix = label || `plan_${client.form.duree}j`;
  const html = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACCCOM — ${client.form.entreprise} — ${suffix.replace(/_/g, " ")}</title>
<style>
${CSS}
body{ margin:0; background:#EDEFEC; font-family:'Onest',sans-serif;}
.export-wrap{ max-width:900px; margin:0 auto; padding:30px 16px;}
.docsheet{ background:#fff;}
.printbar{ position:sticky; top:0; z-index:50; display:flex; justify-content:center; gap:10px;
  padding:14px; background:rgba(240,233,229,.92); backdrop-filter:blur(6px); border-bottom:1px solid #E8DAD5;}
.printbar button{ font-family:'Onest',sans-serif; font-weight:600; font-size:15px; color:#fff;
  background:#7D4E66; border:none; border-radius:12px; padding:12px 26px; cursor:pointer;}
.printbar button:hover{ background:#5A3348;}
.printbar span{ align-self:center; font-size:13px; color:#6B5A5E;}
@media print{
  /* Le CSS de l'application masque tout sauf .print-zone, un conteneur qui
     n'existe pas dans ce fichier exporté : sans cette ligne, l'impression sort
     entièrement blanche. On rétablit la visibilité pour tout le document. */
  body *{ visibility:visible !important;}
  body{ background:#fff;}
  .printbar{ display:none;}
  .export-wrap{ max-width:none; padding:0;}
  .docsheet{ border:none; box-shadow:none; border-radius:0; padding:0; margin:0;}
}
</style>
</head>
<body class="acd">
<div class="printbar">
  <button onclick="window.print()">Imprimer / Enregistrer en PDF</button>
  <span>Choisissez « Enregistrer au format PDF » comme imprimante.</span>
</div>
<div class="export-wrap">${zone.innerHTML}</div>
</body>
</html>`;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ACCCOM_${name}_${suffix}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

/* Panneau d'affinage : une consigne libre pour retoucher le plan affiché. */
function AffinerBox({ busy, stage, error, onSubmit, onClose }) {
  const [consigne, setConsigne] = useState("");
  const envoyer = async () => {
    const c = consigne.trim();
    if (c.length < 5 || busy) return;
    const ok = await onSubmit(c);
    if (ok) setConsigne("");
  };
  return (
    <div className="affiner">
      <div className="aff-head">
        <b>Affiner ce plan</b>
        <span>Décrivez en une phrase ce que vous voulez changer. Le reste du plan est conservé.</span>
      </div>
      <textarea
        value={consigne}
        onChange={(e) => setConsigne(e.target.value)}
        disabled={busy}
        rows={3}
        placeholder="Ex. : remplacer la prospection téléphonique par du LinkedIn, le client n'a pas d'équipe pour appeler. Ou : rendre les objectifs de la phase 1 plus prudents." />

        <div style={{ paddingBottom: 60 }}>
          <div className="doc-actions">
            <button className="btn btn-primary" onClick={onAddDoc}>+ Ajouter un document</button>
            {f.packTier && onContrat && (
              <button className="btn btn-soft" onClick={onContrat}>
                {(client.contrat && client.contrat.signature) ? "Ouvrir le contrat signé" : "Éditer le contrat"}
              </button>
            )}
          </div>

          {/* pièces produites par l'outil : devis et contrat */}
          {generes.length > 0 && (
            <div className="gen-docs">
              <div className="gd-head">Pièces contractuelles</div>
              {generes.map((d) => (
                <div key={d.id} className="gd-row">
                  <div className="gd-ico">{d.type === "contrat" ? "§" : "€"}</div>
                  <div className="gd-txt">
                    <b>{d.titre}</b>
                    <span>
                      {fmtDate(d.date)}
                      {d.type === "contrat" && (d.signee
                        ? ` · signé par ${d.ct.signature.nomSignataire}`
                        : " · non signé")}
                    </span>
                  </div>
                  {d.type === "contrat" && (
                    <span className={"pill " + (d.signee ? "ok" : "wait")}>{d.signee ? "Signé" : "À signer"}</span>
                  )}
                  <div className="gd-act">
                    <button className="btn btn-ghost" onClick={() => (d.type === "contrat" ? onContrat() : onOuvrirDevis(d))}>Ouvrir</button>
                    <button className="btn btn-soft" onClick={() => onTelecharger(d)}>Télécharger</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {manuels.length === 0 && generes.length === 0 && (
            <div className="empty">
              <div className="big">Aucun document</div>
              <p>Le devis et le contrat s'archivent ici automatiquement. Vous pouvez aussi y ajouter vos comptes rendus, notes de suivi ou avenants.</p>
            </div>
          )}
          {manuels.map((d) => (
            <div key={d.id} className="doc-row">
              <div className="d-head" onClick={() => setOpenDoc(openDoc === d.id ? null : d.id)}>
                <b>{d.titre}</b>
                <span>{fmtDate(d.date)} {openDoc === d.id ? "▴" : "▾"}</span>
              </div>
              {openDoc === d.id && (
                <div className="d-body">
                  {d.contenu}
                  <div style={{ marginTop: 12 }}>
                    <button className="btn btn-danger" onClick={() => onDeleteDoc(d.id)}>Supprimer ce document</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Réglages (clé API, vitesse, données) ---------------- */
function SettingsModal({ onClose, onDataChanged, cloudUser, syncState, onCloudInit, onSync }) {
  const [provider, setProvider] = useState(CFG.provider());
  const [key, setKey] = useState(CFG.key());
  const [gkey, setGkey] = useState(CFG.gkey());
  const [model, setModel] = useState(CFG.model());
  const [search, setSearch] = useState(CFG.search());
  const [msg, setMsg] = useState("");
  const [cfgOk, setCfgOk] = useState(CLOUD.configured());
  const [fbText, setFbText] = useState("");
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [cloudMsg, setCloudMsg] = useState("");
  const [cloudBusy, setCloudBusy] = useState(false);
  const fileRef = useRef(null);

  const frAuthError = (e) => {
    const c = (e && e.code) || "";
    if (c.includes("invalid-credential") || c.includes("wrong-password")) return "E-mail ou mot de passe incorrect.";
    if (c.includes("user-not-found")) return "Aucun compte avec cet e-mail — utilisez « Créer le compte » la première fois.";
    if (c.includes("email-already-in-use")) return "Un compte existe déjà avec cet e-mail — utilisez « Se connecter ».";
    if (c.includes("weak-password")) return "Mot de passe trop court (6 caractères minimum).";
    if (c.includes("invalid-email")) return "Adresse e-mail invalide.";
    if (c.includes("network-request-failed")) return "Pas de connexion internet.";
    if (c.includes("operation-not-allowed")) return "Activez la connexion « E-mail/Mot de passe » dans Firebase (Authentication → Sign-in method).";
    return (e && e.message) || "Erreur inconnue.";
  };

  const activerCloud = () => {
    try {
      const cfg = parseFbConfig(fbText);
      CLOUD.setCfg(cfg);
      if (!CLOUD.init()) throw new Error("Initialisation impossible — vérifiez la configuration collée.");
      onCloudInit && onCloudInit();
      setCfgOk(true);
      setCloudMsg("Projet relié. Connectez-vous maintenant avec un e-mail et un mot de passe — le même compte sur tous vos appareils.");
    } catch (e) { setCloudMsg(e.message); }
  };

  const login = async (creation) => {
    setCloudBusy(true); setCloudMsg("");
    try {
      if (creation) await CLOUD.auth.createUserWithEmailAndPassword(email.trim(), pwd);
      else await CLOUD.auth.signInWithEmailAndPassword(email.trim(), pwd);
      setCloudMsg("Connecté — synchronisation lancée.");
      setPwd("");
    } catch (e) { setCloudMsg(frAuthError(e)); }
    setCloudBusy(false);
  };

  const retirerCloud = () => {
    if (!window.confirm("Retirer la configuration Firebase de cet appareil ? (les dossiers locaux et la base en ligne sont conservés)")) return;
    CLOUD.clearCfg();
    window.location.reload();
  };

  const save = () => {
    CFG.set("provider", provider);
    CFG.set("apikey", key.trim());
    CFG.set("gkey", gkey.trim());
    CFG.set("model", model);
    CFG.set("search", search ? "1" : "0");
    onClose();
  };

  const exporter = () => {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if ((k.startsWith("acccom:") || k.startsWith("acdcom:")) && k !== "acccom:apikey" && k !== "acccom:gkey") data[k] = localStorage.getItem(k);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "acccom-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    setMsg("Sauvegarde téléchargée (dossiers + réglages, hors clés API). Conservez ce fichier ou importez-le sur un autre poste.");
  };

  const importer = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        let n = 0;
        for (const [k, v] of Object.entries(data)) {
          if ((k.startsWith("acccom:") || k.startsWith("acdcom:")) && k !== "acccom:apikey" && k !== "acccom:gkey") { localStorage.setItem(k, v); n++; }
        }
        setMsg(n + " éléments restaurés. Vos dossiers sont à jour sur ce poste.");
        onDataChanged && onDataChanged();
      } catch (err) { setMsg("Fichier illisible : " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>Réglages</h3>
        <Field label="Fournisseur d'IA">
          <div className="duree" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <button type="button" className={provider === "anthropic" ? "sel" : ""}
              onClick={() => setProvider("anthropic")}>
              <div className="d-num">Claude</div>
              <div className="d-lab">Payant à l'usage (~2-5 ct/diagnostic) — meilleure qualité, données non utilisées pour l'entraînement</div>
            </button>
            <button type="button" className={provider === "gemini" ? "sel" : ""}
              onClick={() => setProvider("gemini")}>
              <div className="d-num">Gemini</div>
              <div className="d-lab">Gratuit (quotas journaliers) — Google peut utiliser les données envoyées pour améliorer ses services</div>
            </button>
          </div>
        </Field>
        {provider === "anthropic" && (
          <Field label="Clé API Anthropic" hint="créée sur console.anthropic.com — elle reste dans votre navigateur, jamais transmise ailleurs qu'à l'API">
            <input type="password" value={key} onChange={(e) => setKey(e.target.value)} placeholder="sk-ant-…" />
          </Field>
        )}
        {provider === "gemini" && (
          <>
            <Field label="Clé API Google Gemini" hint="créée gratuitement sur aistudio.google.com (bouton « Get API key ») — elle reste dans votre navigateur">
              <input type="password" value={gkey} onChange={(e) => setGkey(e.target.value)} placeholder="AIza…" />
            </Field>
            <div className="export-note" style={{ marginBottom: 16 }}>
              Confidentialité : sur le palier gratuit, Google peut exploiter le contenu envoyé (vos données d'audit) pour améliorer ses services. Évitez d'y saisir des informations sensibles ou nominatives, ou anonymisez le formulaire — pour les dossiers confidentiels, préférez Claude.
            </div>
          </>
        )}
        {provider === "anthropic" && (
        <Field label="Vitesse de génération">
          <div className="duree" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <button type="button" className={model === "claude-haiku-4-5" ? "sel" : ""}
              onClick={() => setModel("claude-haiku-4-5")}>
              <div className="d-num">Rapide</div>
              <div className="d-lab">Idéal en rendez-vous (modèle Haiku)</div>
            </button>
            <button type="button" className={model === "claude-sonnet-4-6" ? "sel" : ""}
              onClick={() => setModel("claude-sonnet-4-6")}>
              <div className="d-num">Approfondi</div>
              <div className="d-lab">Analyse plus fouillée (modèle Sonnet)</div>
            </button>
          </div>
        </Field>
        )}
        {provider === "anthropic" && (
        <Field label="Recherche web pour l'analyse externe" hint="plus précis mais nettement plus lent — à désactiver en rendez-vous">
          <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, fontWeight: 400, cursor: "pointer" }}>
            <input type="checkbox" checked={search} onChange={(e) => setSearch(e.target.checked)}
              style={{ width: 18, height: 18, accentColor: "var(--pine)" }} />
            Activer la recherche web (sinon l'IA s'appuie sur ses connaissances du secteur)
          </label>
        </Field>
        )}
        <Field label="Synchronisation multi-appareils" hint="via votre projet Firebase — retrouvez les mêmes dossiers sur PC, portable et téléphone">
          {!cfgOk && (
            <>
              <textarea rows={5} value={fbText} onChange={(e) => setFbText(e.target.value)}
                placeholder={'Collez ici la configuration de votre projet Firebase :\n{\n  apiKey: "AIza…",\n  authDomain: "…", projectId: "…", …\n}'} />
              <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
                <button className="btn btn-soft" onClick={activerCloud}>Relier mon projet Firebase</button>
              </div>
            </>
          )}
          {cfgOk && !cloudUser && (
            <>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                placeholder="Adresse e-mail" autoComplete="email" style={{ marginBottom: 8 }} />
              <input type="password" value={pwd} onChange={(e) => setPwd(e.target.value)}
                placeholder="Mot de passe (6 caractères min.)" autoComplete="current-password" />
              <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
                <button className="btn btn-primary" disabled={cloudBusy || !email || !pwd} onClick={() => login(false)}>Se connecter</button>
                <button className="btn btn-soft" disabled={cloudBusy || !email || !pwd} onClick={() => login(true)}>Créer le compte</button>
                <button className="btn btn-ghost" onClick={retirerCloud}>Retirer la configuration</button>
              </div>
            </>
          )}
          {cfgOk && cloudUser && (
            <>
              <div className="export-note" style={{ marginBottom: 10 }}>
                Connecté : <strong>{cloudUser}</strong> — {syncState === "sync" ? "synchronisation en cours…"
                  : syncState === "ok" ? "dossiers synchronisés." : syncState === "err" ? "dernière synchronisation en erreur (voir le guide ci-dessous : règles Firestore)." : "en attente."}
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <button className="btn btn-soft" disabled={syncState === "sync"} onClick={onSync}>Synchroniser maintenant</button>
                <button className="btn btn-ghost" onClick={() => CLOUD.auth.signOut()}>Se déconnecter</button>
                <button className="btn btn-ghost" onClick={retirerCloud}>Retirer la configuration</button>
              </div>
            </>
          )}
          {cloudMsg && <div className="export-note" style={{ marginTop: 10 }}>{cloudMsg}</div>}
          <details style={{ marginTop: 10 }}>
            <summary style={{ cursor: "pointer", fontSize: 13, color: "var(--muted)" }}>Guide de mise en place (console Firebase)</summary>
            <div className="export-note" style={{ marginTop: 8 }}>
              <p style={{ margin: "0 0 8px" }}>Dans <strong>console.firebase.google.com</strong>, sur votre projet :</p>
              <p style={{ margin: "0 0 6px" }}>1 — <strong>Authentication → Sign-in method</strong> : activez « E-mail/Mot de passe ».</p>
              <p style={{ margin: "0 0 6px" }}>2 — <strong>Firestore Database</strong> : créez la base (mode production), puis dans l'onglet <strong>Règles</strong>, remplacez tout par :</p>
              <pre style={{ background: "var(--input-bg)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, fontSize: 11.5, overflowX: "auto", margin: "0 0 6px" }}>{
`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid}/{document=**} {
      allow read, write: if request.auth != null
                          && request.auth.uid == uid;
    }
  }
}`}</pre>
              <p style={{ margin: "0 0 6px" }}>3 — <strong>Paramètres du projet → Général → Vos applications</strong> : créez une application Web si besoin, puis copiez le bloc <code>firebaseConfig</code> et collez-le ci-dessus.</p>
              <p style={{ margin: 0 }}>4 — Répétez « Relier mon projet » + connexion (même e-mail) sur chaque appareil. Cette configuration n'est pas secrète : ce sont les règles ci-dessus et votre mot de passe qui protègent vos données.</p>
            </div>
          </details>
        </Field>
        <Field label="Vos données" hint="dossiers et documents de ce navigateur">
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="btn btn-soft" onClick={exporter}>Exporter une sauvegarde</button>
            <button className="btn btn-soft" onClick={() => fileRef.current && fileRef.current.click()}>Importer une sauvegarde</button>
            <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importer} />
          </div>
        </Field>
        {msg && <div className="export-note">{msg}</div>}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
          <button className="btn btn-ghost" onClick={onClose}>Fermer</button>
          <button className="btn btn-primary" onClick={save}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [view, setView] = useState("home"); // home | form | clients | client
  const [index, setIndex] = useState([]);
  const [current, setCurrent] = useState(null); // client data
  const [editMode, setEditMode] = useState(false);
  const [busy, setBusy] = useState(false);
  const [generating, setGenerating] = useState(false);
  const [genStage, setGenStage] = useState("");
  const [genError, setGenError] = useState(null);
  const [suiviBusy, setSuiviBusy] = useState(false);
  const [suiviStage, setSuiviStage] = useState("");
  const [suiviError, setSuiviError] = useState(null);
  const [affBusy, setAffBusy] = useState(false);
  const [affStage, setAffStage] = useState("");
  const [affError, setAffError] = useState(null);
  const [packCible, setPackCible] = useState(null);   // fiche à laquelle appliquer le pack
  const [devis, setDevis] = useState(null);           // { pack, nom } en cours de présentation
  const [etapeContrat, setEtapeContrat] = useState("infos");   // "infos" | "doc"
  const [docExport, setDocExport] = useState(null);            // pièce rendue hors écran pour l'export
  const [showDocModal, setShowDocModal] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [ready, setReady] = useState(false);
  const [dark, setDark] = useState(false);
  const [cloudUser, setCloudUser] = useState(null);   // e-mail du compte connecté
  const [syncState, setSyncState] = useState("off");  // off | sync | ok | err

  const doSync = async () => {
    if (!CLOUD.ready()) return;
    setSyncState("sync");
    try {
      const nextIdx = await fullSync();
      if (nextIdx) setIndex(nextIdx);
      setSyncState("ok");
    } catch (e) { console.error("Sync:", e); setSyncState("err"); }
  };

  const cloudAttached = useRef(false);
  const attachCloud = () => {
    if (cloudAttached.current || !CLOUD.init()) return;
    cloudAttached.current = true;
    CLOUD.auth.onAuthStateChanged((u) => {
      setCloudUser(u ? u.email : null);
      if (u) doSync(); else setSyncState("off");
    });
  };

  useEffect(() => {
    (async () => {
      setIndex(await loadIndex());
      try {
        const t = await appStorage.get("acdcom:theme");
        if (t && t.value === "dark") setDark(true);
      } catch (_) { /* pas de préférence enregistrée */ }
      setReady(true);
      attachCloud();
    })();
  }, []);

  const toggleTheme = async () => {
    const next = !dark;
    setDark(next);
    try { await appStorage.set("acdcom:theme", next ? "dark" : "light"); } catch (e) { console.error(e); }
  };

  const refreshIndex = async (updated) => { setIndex(updated); await saveIndex(updated); };

  const openClient = async (id) => {
    const c = await loadClient(id);
    if (c) { setCurrent({ id, ...c }); setGenError(null); setView("client"); }
  };

  const persistCurrent = async (data) => {
    const { id, ...rest } = data;
    rest.updatedAt = new Date().toISOString();
    await saveClient(id, rest);
    const next = [...index.filter((c) => c.id !== id), indexEntry(id, rest)];
    await refreshIndex(next);
    setCurrent({ id, ...rest });
    if (CLOUD.ready()) CLOUD.push(id, rest).catch((e) => { console.error(e); setSyncState("err"); });
  };

  const runGeneration = async (data) => {
    if (!CFG.activeKey()) {
      setShowSettings(true);
      setGenError(CFG.provider() === "gemini"
        ? "Renseignez d'abord votre clé Gemini gratuite dans les réglages (bouton ⚙ en haut à droite)."
        : "Renseignez d'abord votre clé API Anthropic dans les réglages (bouton ⚙ en haut à droite).");
      return;
    }
    setGenerating(true); setGenError(null); setGenStage("");
    try {
      const result = await generateAnalysis(data.form, setGenStage);
      const updated = { ...data, result, resultAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      await persistCurrent(updated);
    } catch (e) {
      console.error(e);
      if (e.message === "NO_KEY") {
        setShowSettings(true);
        setGenError("Clé API absente ou invalide — vérifiez-la dans les réglages (bouton ⚙).");
      } else {
        setGenError(e.message || "erreur inconnue");
      }
    } finally { setGenerating(false); }
  };

  const handleSubmitForm = async (form) => {
    setBusy(true);
    try {
      const now = new Date().toISOString();
      let data;
      if (editMode && current) {
        data = { ...current, form, updatedAt: now };
      } else {
        data = { id: uid(), form, documents: [], result: null, periodes: [], createdAt: now, updatedAt: now };
      }
      await persistCurrent(data);
      setView("client");
      // Un dossier dont le suivi est engagé (bilans déjà générés) n'est pas
      // régénéré automatiquement après une simple modification de l'audit :
      // cela écraserait le plan initial dont dépendent les périodes suivantes.
      const suiviEngage = (data.periodes || []).length > 0 || data.cloture;
      if (!data.result || !suiviEngage) runGeneration(data);
    } finally { setBusy(false); setEditMode(false); }
  };

  /* Bilan de fin de période : évalue la période écoulée puis génère le plan
     de la période suivante (ou le bilan de clôture en fin d'accompagnement). */
  const handleBilanSubmit = async (bilan) => {
    if (!current || !current.result) return false;
    if (!CFG.activeKey()) {
      setShowSettings(true);
      setSuiviError("Renseignez d'abord votre clé API dans les réglages (bouton ⚙ en haut à droite).");
      return false;
    }
    const f = current.form;
    const meta = suiviMeta(f);
    const periodes = current.periodes || [];
    const numPeriode = nbPlanifiees(current);          // période dont on dresse le bilan
    const prevPlan = numPeriode === 1 ? current.result.plan : periodes[periodes.length - 1].plan;
    const cloture = numPeriode >= meta.total;
    setSuiviBusy(true); setSuiviError(null); setSuiviStage("");
    try {
      const out = await generateSuivi(f, prevPlan, bilan, numPeriode, cloture, setSuiviStage);
      const now = new Date().toISOString();
      const updated = cloture
        ? { ...current, cloture: { bilan, synth: out.synth, at: now }, updatedAt: now }
        : { ...current, periodes: [...periodes, { id: uid(), num: numPeriode + 1, bilan, synth: out.synth, plan: out.plan, at: now }], updatedAt: now };
      await persistCurrent(updated);
      return true;
    } catch (e) {
      console.error(e);
      if (e.message === "NO_KEY") {
        setShowSettings(true);
        setSuiviError("Clé API absente ou invalide — vérifiez-la dans les réglages (bouton ⚙).");
      } else {
        setSuiviError(e.message || "erreur inconnue");
      }
      return false;
    } finally { setSuiviBusy(false); }
  };

  /* Affinage : réécrit le plan de la période affichée selon la consigne saisie,
     puis l'enregistre à sa place exacte (plan initial ou plan d'une période de suivi). */
  const handleAffiner = async (consigne, numPeriode) => {
    if (!current || !current.result) return false;
    if (!CFG.activeKey()) {
      setShowSettings(true);
      setAffError("Renseignez d'abord votre clé API dans les réglages (bouton ⚙ en haut à droite).");
      return false;
    }
    const periodes = current.periodes || [];
    const estInitial = !numPeriode || numPeriode === 1;
    const cible = estInitial ? current.result.plan : (periodes[numPeriode - 2] || {}).plan;
    if (!Array.isArray(cible) || !cible.length) {
      setAffError("Aucun plan à affiner sur cette période.");
      return false;
    }
    setAffBusy(true); setAffError(null); setAffStage("");
    try {
      const plan = await affinerPlan(current.form, cible, consigne, setAffStage);
      const now = new Date().toISOString();
      const trace = { consigne, at: now, periode: estInitial ? 1 : numPeriode };
      const updated = estInitial
        ? { ...current, result: { ...current.result, plan }, affinages: [...(current.affinages || []), trace], updatedAt: now }
        : { ...current,
            periodes: periodes.map((pe, i) => (i === numPeriode - 2 ? { ...pe, plan } : pe)),
            affinages: [...(current.affinages || []), trace], updatedAt: now };
      await persistCurrent(updated);
      return true;
    } catch (e) {
      console.error(e);
      if (e.message === "NO_KEY") {
        setShowSettings(true);
        setAffError("Clé API absente ou invalide — vérifiez-la dans les réglages (bouton ⚙).");
      } else {
        setAffError(e.message || "erreur inconnue");
      }
      return false;
    } finally { setAffBusy(false); }
  };

  /* Validation d'une composition de pack : soit on l'applique à une fiche
     existante, soit on crée la fiche et on enchaîne sur le formulaire d'audit. */
  const handlePackValide = async (pack, nom, mode = "contrat") => {
    const now = new Date().toISOString();
    const champs = {
      packTier: pack.tier, packOpts: pack.opts || [], packEngage: pack.engage,
      packPay: pack.pay, packPages: pack.pages,
    };
    if (packCible) {
      const f = { ...packCible.form, ...champs, entreprise: nom || packCible.form.entreprise };
      /* un pack souscrit transforme un audit seul en accompagnement */
      if (f.formule === "audit") { f.formule = "accompagnement"; f.duree = f.cadence || "90"; }
      let updated = { ...packCible, form: f, updatedAt: now };
      await persistCurrent(updated);
      setPackCible(null); setDevis(null); setView("client");
      /* le diagnostic existe deja : on ne genere que le plan, sans repayer le SWOT */
      if (updated.result && !(updated.result.plan || []).length) {
        setGenerating(true); setGenError(null); setGenStage("");
        try {
          const plan = await generatePlanDepuisDiagnostic(f, updated.result, setGenStage);
          updated = { ...updated, result: { ...updated.result, plan }, updatedAt: new Date().toISOString() };
          await persistCurrent(updated);
        } catch (e) {
          console.error(e);
          setGenError(e.message === "NO_KEY" ? "Clé API absente ou invalide — vérifiez-la dans les réglages (bouton ⚙)." : (e.message || "erreur inconnue"));
          if (e.message === "NO_KEY") setShowSettings(true);
        } finally { setGenerating(false); }
      }
      return;
    }
    const data = {
      id: uid(),
      form: { ...EMPTY_FORM, ...champs, entreprise: nom, formule: "accompagnement" },
      /* le devis est archivé dès la création : il reste consultable et
         téléchargeable depuis l'onglet Documents de la fiche */
      documents: [docGenere("devis", pack, null, nom, now)],
      result: null, periodes: [], contrat: { ...EMPTY_CONTRAT, denomination: nom },
      createdAt: now, updatedAt: now,
    };
    await persistCurrent(data);
    setDevis(null);
    if (mode === "contrat") { ouvrirContrat(data); }
    else { setDevis({ pack, nom }); setView("devis"); }
  };

  /* Contrat : les informations du client et la signature vivent dans la fiche. */
  const majContrat = async (patch) => {
    if (!current) return;
    const ct = { ...EMPTY_CONTRAT, ...(current.contrat || {}), ...patch };
    await persistCurrent({ ...current, contrat: ct, updatedAt: new Date().toISOString() });
  };
  const handleSigner = async (signature) => {
    const ct = { ...EMPTY_CONTRAT, ...(current.contrat || {}), signature };
    const now = new Date().toISOString();
    const docs = (current.documents || []).filter((d) => d.type !== "contrat");
    docs.unshift(docGenere("contrat", packDepuisForm(current.form), ct, current.form.entreprise, now));
    await persistCurrent({ ...current, contrat: ct, documents: docs, updatedAt: now });
  };
  const handleAnnulerSignature = async () => {
    if (!window.confirm("Annuler la signature ? Le contrat redeviendra modifiable et devra être resigné.")) return;
    await majContrat({ signature: null });
    setEtapeContrat("doc");
  };
  const ouvrirContrat = (client) => {
    const ct = { ...EMPTY_CONTRAT, ...(client.contrat || {}) };
    if (!ct.denomination) ct.denomination = client.form.entreprise || "";
    setCurrent({ ...client, contrat: ct });
    setEtapeContrat(contratManquants(ct).length ? "infos" : "doc");
    setView("contrat");
  };

  /* Téléchargement depuis l'onglet Documents : la pièce est rendue hors écran
     le temps de l'export, puis retirée. L'utilisateur ne quitte pas son onglet. */
  const handleTelecharger = (d) => {
    setDocExport(d);
    setTimeout(() => {
      try {
        exportDocument({ form: { entreprise: d.nom || (current && current.form.entreprise) } },
          d.type === "contrat" ? (d.signee ? "contrat-signe" : "contrat") : "devis");
      } catch (e) { console.error(e); }
      setDocExport(null);
    }, 220);
  };
  const handleOuvrirDevis = (d) => { setDevis({ pack: d.pack, nom: d.nom }); setView("devis"); };

  const handleAddDoc = async (titre, contenu) => {
    const doc = { id: uid(), titre, contenu, date: new Date().toISOString() };
    const updated = { ...current, documents: [doc, ...(current.documents || [])], updatedAt: new Date().toISOString() };
    await persistCurrent(updated);
    setShowDocModal(false);
  };

  const handleDeleteDoc = async (docId) => {
    const updated = { ...current, documents: (current.documents || []).filter((d) => d.id !== docId), updatedAt: new Date().toISOString() };
    await persistCurrent(updated);
  };

  const handleDeleteClient = async () => {
    if (!window.confirm("Supprimer définitivement ce dossier client ?")) return;
    await deleteClient(current.id);
    if (CLOUD.ready()) CLOUD.remove(current.id).catch(console.error);
    await refreshIndex(index.filter((c) => c.id !== current.id));
    setCurrent(null); setView("clients");
  };

  return (
    <div className={"acd" + (dark ? " dark" : "")}>
      <style>{CSS}</style>
      <div className="topbar">
        <div className="wrap topbar-in">
          <Wordmark onClick={() => { setView("home"); setCurrent(null); }} />
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div className="crumb">
              {view !== "home" && <button onClick={() => setView("home")}>Accueil</button>}
              {(view === "clients" || view === "client") && <><span>/</span><button onClick={() => { setView("clients"); setCurrent(null); }}>Dossiers</button></>}
              {view === "client" && current && <><span>/</span><span>{current.form.entreprise}</span></>}
              {view === "form" && <><span>/</span><span>{editMode ? "Modification" : "Nouvel audit"}</span></>}
              {view === "pack" && <><span>/</span><span>Composer un pack</span></>}
              {view === "devis" && <><span>/</span><button onClick={() => setView("pack")}>Composer un pack</button><span>/</span><span>Devis</span></>}
              {view === "contrat" && <><span>/</span><span>Contrat</span></>}
            </div>
            {CLOUD.configured() && (
              <button className="cloud-pill" onClick={() => setShowSettings(true)}
                title={cloudUser ? "Compte : " + cloudUser : "Synchronisation non connectée"}>
                {syncState === "sync" ? "⟳ Synchro…"
                  : syncState === "ok" ? "☁ Synchronisé"
                  : syncState === "err" ? "☁ Erreur de synchro"
                  : "☁ Hors connexion"}
              </button>
            )}
            <button className="theme-btn" onClick={() => setShowSettings(true)}
              title="Réglages" aria-label="Réglages">⚙</button>
            <button className="theme-btn" onClick={toggleTheme}
              title={dark ? "Passer en mode clair" : "Passer en mode sombre"}
              aria-label={dark ? "Passer en mode clair" : "Passer en mode sombre"}>
              {dark ? "☀" : "☾"}
            </button>
          </div>
        </div>
      </div>

      {!ready && <div className="gen-overlay"><div className="spin" /><p>Chargement…</p></div>}

      {ready && view === "home" && (
        <Home count={index.length}
          onNew={() => { setEditMode(false); setCurrent(null); setView("form"); }}
          onPack={() => { setPackCible(null); setView("pack"); }}
          onClients={() => setView("clients")} />
      )}

      {ready && view === "pack" && (
        <PackComposer
          initial={packCible ? packDepuisForm(packCible.form) : null}
          nomInitial={packCible ? packCible.form.entreprise : ""}
          titreValider={packCible ? "Appliquer à la fiche" : "Valider et éditer le contrat"}
          onCancel={() => setView(packCible ? "client" : "home")}
          onDevis={(pack, nom) => handlePackValide(pack, nom, "devis")}
          onValider={handlePackValide} />
      )}

      {docExport && (
        <div className="print-zone offscreen" aria-hidden="true">
          {docExport.type === "contrat"
            ? <ContratDocument pack={docExport.pack} ct={{ ...EMPTY_CONTRAT, ...(docExport.ct || {}) }}
                nom={docExport.nom} refDevis={(current && current.id || "").slice(0, 6).toUpperCase()}
                dateDevis={current && current.createdAt} />
            : <DevisDocument pack={docExport.pack} nom={docExport.nom} dateStr={fmtDate(docExport.date)} />}
        </div>
      )}

      {ready && view === "contrat" && current && (
        etapeContrat === "infos" ? (
          <ContratForm
            valeur={current.contrat}
            onChange={(ct) => setCurrent({ ...current, contrat: ct })}
            onRetour={() => setView("client")}
            onSuite={async () => { await majContrat(current.contrat || {}); setEtapeContrat("doc"); }} />
        ) : (
          <ContratVue
            pack={packDepuisForm(current.form)}
            ct={{ ...EMPTY_CONTRAT, ...(current.contrat || {}) }}
            nom={current.form.entreprise}
            refDevis={current.id ? current.id.slice(0, 6).toUpperCase() : ""}
            dateDevis={current.createdAt}
            onRetour={() => setEtapeContrat("infos")}
            onSigner={handleSigner}
            onAnnulerSignature={handleAnnulerSignature} />
        )
      )}

      {ready && view === "devis" && devis && (
        <DevisVue devis={devis}
          onRetour={() => setView("pack")}
          onValider={() => handlePackValide(devis.pack, devis.nom)} />
      )}

      {ready && view === "form" && (
        <AuditForm
          initial={editMode && current ? current.form : null}
          busy={busy}
          onCancel={() => setView(editMode ? "client" : "home")}
          onComposerPack={() => { setPackCible(current); setView("pack"); }}
          onSubmit={handleSubmitForm} />
      )}

      {ready && view === "clients" && (
        <ClientList index={index} onOpen={openClient}
          onNew={() => { setEditMode(false); setCurrent(null); setView("form"); }} />
      )}

      {ready && view === "client" && current && (
        <ClientDetail
          client={current}
          generating={generating}
          genStage={genStage}
          genError={genError}
          onBilanSubmit={handleBilanSubmit}
          suiviBusy={suiviBusy}
          suiviStage={suiviStage}
          suiviError={suiviError}
          onBack={() => { setView("clients"); setCurrent(null); setSuiviError(null); }}
          onEditAudit={() => { setEditMode(true); setView("form"); }}
          onRegenerate={() => runGeneration(current)}
          onComposerPack={() => { setPackCible(current); setView("pack"); }}
          onContrat={() => ouvrirContrat(current)}
          onOuvrirDevis={handleOuvrirDevis}
          onTelecharger={handleTelecharger}
          onAffiner={handleAffiner}
          affBusy={affBusy}
          affStage={affStage}
          affError={affError}
          onAddDoc={() => setShowDocModal(true)}
          onDeleteDoc={handleDeleteDoc}
          onDelete={handleDeleteClient} />
      )}

      {showDocModal && <DocModal onClose={() => setShowDocModal(false)} onSave={handleAddDoc} />}
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)}
        onDataChanged={async () => setIndex(await loadIndex())}
        cloudUser={cloudUser} syncState={syncState}
        onCloudInit={attachCloud} onSync={doSync} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
