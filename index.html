<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7D4E66">
<title>ACCCOM Studio — Audit &amp; plan d'action commercial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>html,body{margin:0;padding:0;background:#FAF7F5;}#boot{font-family:sans-serif;color:#7D6D71;text-align:center;padding:80px 20px;}</style>
</head>
<body>
<div id="root"><div id="boot">Chargement d'ACCCOM Studio…</div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useLayoutEffect } = React;

/* ============================================================
   ACCCOM · Studio d'audit & de suivi commercial
   - Accueil : nouvel audit / dossiers clients
   - Formulaire d'audit (analyse interne / externe / objectifs / formule)
   - Formules : accompagnement récurrent (6 mois / 1 an / 2 ans,
     suivi mensuel ou trimestriel : bilan de période -> nouveau plan)
     ou problématique ciblée (plan unique 30 ou 90 jours)
   - Génération IA : SWOT + plan initial, puis bilans de période
     et plans successifs en continuité, jusqu'au bilan de clôture
   - Dossiers clients : arborescence des périodes, documents, audit
   Stockage local (localStorage) + sauvegarde/restauration
   + synchronisation multi-appareils optionnelle (Firebase)
   ============================================================ */

const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@700;800&family=Onest:wght@300;400;500;600;700&display=swap');
`;

const CSS = `
${FONTS}
:root{
  /* Identité chromatique : la palette du tube (plum / coral / ocre) devient
     la palette générale de l'outil. --pine/--pine-soft/--pine-hover/--sage
     sont conservées comme noms internes (repris dans des dizaines de règles)
     mais leurs valeurs sont désormais puisées dans cette palette — le vert
     a disparu des zones de texte, boutons, libellés et bordures. */
  --ink:#241820; --pine:var(--plum); --pine-soft:var(--coral-ink); --pine-hover:var(--plum-deep);
  --sage:#C9A2A8; --mist:#F5EAE7; --mist-2:#FAF3F0;
  --paper:#FAF7F5; --card:#FFFFFF;
  --gold:#C2A06A; --gold-deep:#A9834B; --gold-light:#E7CF9F;
  --plum:#7D4E66; --plum-deep:#5A3348; --coral:#D96A4B; --coral-ink:#A84A32; --ocre:#E0AA52; --ocre-light:#EFD199;
  --logo-ink:var(--ink); --tube-1:var(--plum); --tube-2:var(--coral); --tube-3:var(--ocre); --tube-out:var(--ocre-light);
  --bar-bg:var(--plum-deep);
  --line:#E8DAD5; --danger:#A85B4B; --amber:#B98A4E; --blue:#5E7E9B;
  --muted:#6B5A5E; --muted2:#7D6D71; --faint:#96878A; --deep:#3C2A2F; --deep2:#4B393E;
  --topbar:rgba(250,247,245,.85); --input-bg:#FDF9F8; --input-focus:#FFFFFF;
  --shadow:0 10px 30px rgba(40,20,28,.08), 0 2px 6px rgba(40,20,28,.05);
}
/* ---- mode sombre ---- */
.acd.dark{
  /* même logique en mode sombre : fonds et bordures chauds, --pine/--pine-soft
     puisés dans le plum/corail (déjà assez lumineux sur fond sombre pour
     rester lisibles, pas besoin d'une teinte -ink séparée ici). */
  --ink:#F3E7EB; --pine:var(--plum); --pine-soft:var(--coral); --pine-hover:var(--plum-deep);
  --sage:#6B4E54; --mist:#3A2632; --mist-2:#2E2129;
  /* fond et surfaces repris de l'outil de composition de packs : teintes
     légèrement mauves plutôt que brunes, pour une base plus froide et nette. */
  --paper:#1C1418; --card:#271D23;
  --line:#3B2E35; --muted:#B3A2AA; --muted2:#B39EA2; --faint:#8C787B; --deep:#EEDEE2; --deep2:#E0CDD1;
  --gold:#D2B075; --gold-deep:#BC9558; --gold-light:#EEDBB0;
  --plum:#976382; --plum-deep:#7A4E68; --coral:#E5805F; --coral-ink:#E5805F; --ocre:#ECBD68; --ocre-light:#F5DCA0;
  /* Teintes propres au logo en mode sombre. Les couleurs de l'interface sont
     calibrées pour de petites surfaces sur fond sombre ; sur le grand logo elles
     paraissent ternes face aux lettres claires. On les éclaircit, et on pose une
     encre légèrement moins vive pour que le tube reste le point fort. */
  --logo-ink:#EDE0E4; --tube-1:#B5789B; --tube-2:#EF8A66; --tube-3:#F2C570; --tube-out:#F7DCA2;
  /* la barre de total s'assombrit en mode sombre, comme dans l'outil d'origine */
  --bar-bg:#4A2839;
  --topbar:rgba(28,20,24,.85); --input-bg:#221A1F; --input-focus:#2A1F26;
  --shadow:0 10px 30px rgba(15,5,8,.4), 0 2px 6px rgba(15,5,8,.3);
}
.acd.dark .pill.wait{ background:#332B1D; color:#D8B274;}
.acd.dark .err{ background:#33221E; border-color:#5A3A32; color:#E0947F;}
/* Le document client reste sur fond clair, même en mode sombre :
   il conserve son rendu d'impression et de présentation. */
.docsheet{
  /* le document imprimé reste toujours clair, avec la même palette chaude
     que l'interface — plus de vert nulle part. */
  --ink:#241820; --pine:#7D4E66; --pine-soft:#A84A32; --sage:#C9A2A8;
  --mist:#F5EAE7; --mist-2:#FAF3F0; --line:#E8DAD5;
  --gold:#C2A06A; --gold-deep:#A9834B; --gold-light:#E7CF9F;
  --plum:#7D4E66; --plum-deep:#5A3348; --coral:#D96A4B; --coral-ink:#A84A32; --ocre:#E0AA52; --ocre-light:#EFD199;
  --logo-ink:var(--ink); --tube-1:var(--plum); --tube-2:var(--coral); --tube-3:var(--ocre); --tube-out:var(--ocre-light);
  --bar-bg:var(--plum-deep);
  --muted:#6B5A5E; --muted2:#7D6D71; --faint:#96878A; --deep:#3C2A2F; --deep2:#4B393E;
  color:#241820;
}
*{box-sizing:border-box; margin:0; padding:0;}
.acd{ min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:'Onest',sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;}
.acd h1,.acd h2,.acd h3,.serif{ font-family:'Instrument Serif',serif; font-weight:400; letter-spacing:.2px;}
.wrap{max-width:1060px; margin:0 auto; padding:0 28px;}

/* ---- top bar ---- */
.topbar{ position:sticky; top:0; z-index:40; background:var(--topbar);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.topbar-in{ display:flex; align-items:center; justify-content:space-between; height:64px;}
.wordmark{ display:flex; align-items:center; gap:12px; cursor:pointer;}
.wordmark .tag{ font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--sage);}
.am-letter{ font-family:'Syne',sans-serif; font-weight:800; font-size:62px; letter-spacing:0;}

/* ---- logo ACCCOM : image de marque contemporaine.
   Typo Syne ExtraBold — large, géométrique, dessin singulier : le mot
   devient une signature reconnaissable. Le tube (du 1er C au O) est
   traité en color-blocking : une couleur pleine par section entre les
   arceaux — prune à l'entrée, corail au cœur, ocre vers la sortie —
   progression chaude qui monte vers la lumière (le O en blanc franc,
   baigné d'un halo). Les arceaux en encre enserrent et dépassent le
   tube. Palette élargie : vert sapin + prune / corail / ocre. ---- */
.logo{ color:var(--ink); display:inline-block; vertical-align:middle;}
.logo .lg{ font-family:'Syne',sans-serif; font-weight:800; font-size:46px; fill:currentColor; letter-spacing:0;}
.crumb{ font-size:13px; color:var(--pine-soft); display:flex; gap:8px; align-items:center;
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.crumb > *{ flex-shrink:0;}
/* sur petit écran le fil d'ariane ne doit jamais pousser les boutons hors cadre :
   on n'y garde que la dernière étape, et il se tronque au besoin */
@media (max-width:640px){
  /* le libellé du logo prend 120 px : inutile sur mobile, il poussait
     le fil d'ariane et les boutons hors de l'écran */
  .wordmark .tag{ display:none;}
  .crumb{ font-size:12px; gap:6px;}
  .crumb > *:not(:nth-last-child(-n+1)){ display:none;}
  .crumb > *{ flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis;}
}
.crumb button{ background:none; border:none; color:var(--pine-soft); cursor:pointer; font:inherit;}
.crumb button:hover{ color:var(--ink); text-decoration:underline;}
.cloud-pill{ border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; padding:6px 12px; font:600 12px/1 "Onest",sans-serif; cursor:pointer; white-space:nowrap;}
.cloud-pill:hover{ color:var(--ink);}
@media (max-width:640px){ .cloud-pill{ font-size:11px; padding:5px 9px;} }
.theme-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--card);
  color:var(--pine); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .18s; flex-shrink:0;}
.theme-btn:hover{ border-color:var(--sage); transform:rotate(15deg);}
.theme-btn:focus-visible{ outline:2px solid var(--pine); outline-offset:2px;}

/* ---- buttons ---- */
.btn{ border:none; cursor:pointer; font-family:'Onest',sans-serif; font-weight:500;
  border-radius:12px; transition:all .18s ease; display:inline-flex; align-items:center; gap:8px;}
.btn:focus-visible{ outline:2px solid var(--pine); outline-offset:2px;}
.btn-primary{ background:var(--pine); color:#fff; padding:13px 26px; font-size:15px;}
.btn-primary:hover{ background:var(--pine-hover); transform:translateY(-1px);}
.btn-primary:disabled{ opacity:.45; cursor:default; transform:none;}
.btn-ghost{ background:transparent; color:var(--pine); padding:11px 20px; font-size:14px; border:1px solid var(--line);}
.btn-ghost:hover{ border-color:var(--sage); background:var(--mist-2);}
.btn-soft{ background:var(--mist); color:var(--pine); padding:10px 18px; font-size:14px;}
.btn-soft:hover{ background:var(--sage); color:#fff;}
.btn-danger{ background:transparent; color:var(--danger); padding:8px 14px; font-size:13px; border:1px solid transparent;}
.btn-danger:hover{ border-color:var(--danger);}

/* ---- home ---- */
.hero{ padding:64px 0 40px; text-align:left;}
.hero .logo{ margin-bottom:26px;}
.hero .eyebrow{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--pine-soft); margin-bottom:14px;}
.hero h1{ font-size:52px; line-height:1.08; max-width:640px;}
.hero h1 em{ font-style:italic; color:var(--pine-soft);}
.hero p{ margin-top:16px; color:var(--muted); max-width:520px;}
.home-cards{ display:grid; grid-template-columns:1fr 1fr; gap:22px; padding:34px 0 80px;}
.home-card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:34px 32px;
  cursor:pointer; transition:all .2s ease; box-shadow:var(--shadow); position:relative; overflow:hidden; text-align:left;}
.home-card:hover{ transform:translateY(-3px); border-color:var(--sage);}
.home-card .num{ font-family:'Instrument Serif',serif; font-size:15px; color:var(--sage); letter-spacing:2px;}
.home-card h2{ font-size:30px; margin:10px 0 8px;}
.home-card p{ color:var(--muted); font-size:14px;}
.home-card .go{ margin-top:22px; color:var(--pine); font-weight:600; font-size:14px;}
.home-card .halo{ position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, var(--mist) 0%, transparent 70%);}
/* Les deux cartes d'accueil reprennent la progression prune → ocre du logo */
.home-card:nth-child(1) .num{ color:var(--plum);}
.home-card:nth-child(1) .halo{ background:radial-gradient(circle, color-mix(in srgb, var(--plum) 20%, transparent) 0%, transparent 70%);}
.home-card:nth-child(2) .num{ color:var(--ocre);}
.home-card:nth-child(2) .halo{ background:radial-gradient(circle, color-mix(in srgb, var(--ocre) 24%, transparent) 0%, transparent 70%);}
.cadence{ display:flex; gap:14px; align-items:center; padding:0 0 70px; color:var(--pine-soft); font-size:13px;}
.cadence .dot{ width:9px; height:9px; border-radius:50%; background:var(--sage);}
.cadence .dot.dot-a{ background:var(--plum);}
.cadence .dot.dot-b{ background:var(--ocre);}
.cadence .rail{ flex:1; height:2px; background:linear-gradient(90deg, var(--plum), var(--coral), var(--ocre)); opacity:.4; border-radius:2px;}
.cadence b{ font-family:'Instrument Serif',serif; font-size:17px; font-weight:400; color:var(--ink);}

/* ---- form ---- */
.page-head{ padding:44px 0 10px;}
.page-head h1{ font-size:38px;}
.page-head p{ color:var(--muted); margin-top:8px; max-width:640px;}
.steps{ display:flex; gap:6px; margin:26px 0 8px; flex-wrap:wrap;}
.step{ padding:8px 16px; border-radius:999px; font-size:13px; cursor:pointer; border:1px solid var(--line);
  background:transparent; color:var(--muted); font-family:'Onest',sans-serif;}
.step.active{ background:var(--pine); color:#fff; border-color:var(--pine);}
.step.done{ border-color:var(--sage); color:var(--pine);}
.fcard{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px; margin:18px 0; box-shadow:var(--shadow);}
.fcard h3{ font-size:23px; margin-bottom:4px;}
.fcard .sub{ font-size:13px; color:var(--muted2); margin-bottom:20px;}
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{ font-size:12.5px; font-weight:600; color:var(--pine); letter-spacing:.3px;}
.field .hint{ font-size:11.5px; color:var(--faint); font-weight:400;}
.field input,.field textarea,.field select{ font-family:'Onest',sans-serif; font-size:14px; color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:var(--input-bg); transition:border .15s;}
.field textarea{ min-height:88px; resize:vertical; line-height:1.5;}
.field input:focus,.field textarea:focus,.field select:focus{ outline:none; border-color:var(--sage); background:var(--input-focus);}
.duree{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
/* certains sélecteurs forcent 2 ou 3 colonnes en style inline : sur mobile on
   repasse en une colonne, sinon les libellés débordent hors de l'écran */
@media (max-width:640px){
  .duree{ grid-template-columns:1fr !important; gap:10px;}
  .duree button{ min-width:0;}
  .duree .d-num{ font-size:22px;}
}
.duree button{ color:var(--ink); border:1px solid var(--line); background:var(--input-bg); border-radius:14px; padding:16px; cursor:pointer;
  font-family:'Onest',sans-serif; text-align:left; transition:all .15s;}
.duree button.sel{ border-color:var(--pine); background:var(--mist); box-shadow:inset 0 0 0 1px var(--pine);}
.duree .d-num{ font-family:'Instrument Serif',serif; font-size:26px; color:var(--pine);}
.duree .d-lab{ font-size:12px; color:var(--muted2); margin-top:2px;}
/* Les 3 formules reprennent la progression prune → corail → ocre du tube du logo */
.duree button.sel.d-0{ border-color:var(--plum); background:color-mix(in srgb, var(--plum) 12%, var(--input-bg)); box-shadow:inset 0 0 0 1px var(--plum);}
.duree button.sel.d-0 .d-num{ color:var(--plum);}
.duree button.sel.d-1{ border-color:var(--coral); background:color-mix(in srgb, var(--coral) 12%, var(--input-bg)); box-shadow:inset 0 0 0 1px var(--coral);}
.duree button.sel.d-1 .d-num{ color:var(--coral);}
.duree button.sel.d-2{ border-color:var(--ocre); background:color-mix(in srgb, var(--ocre) 14%, var(--input-bg)); box-shadow:inset 0 0 0 1px var(--ocre);}
.duree button.sel.d-2 .d-num{ color:var(--ocre);}
.form-nav{ display:flex; justify-content:space-between; padding:8px 0 70px;}

/* ---- clients ---- */
.client-row{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 24px;
  display:flex; align-items:center; gap:18px; margin-bottom:12px; cursor:pointer; transition:all .18s; box-shadow:var(--shadow);}
.client-row:hover{ border-color:var(--sage); transform:translateX(3px);}
.avatar{ width:46px; height:46px; border-radius:14px; background:var(--mist); color:var(--pine);
  display:flex; align-items:center; justify-content:center; font-family:'Instrument Serif',serif; font-size:20px; flex-shrink:0;}
.client-row .meta{ flex:1;}
.client-row .meta b{ font-size:16px;}
.client-row .meta span{ display:block; font-size:12.5px; color:var(--muted2); margin-top:2px;}
.pill{ font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:5px 12px; border-radius:999px;}
.pill.ok{ background:var(--mist); color:var(--pine);}
.pill.wait{ background:#F5EFE3; color:var(--amber);}
.pill.fut{ background:var(--mist-2); color:var(--faint); border:1px dashed var(--line);}
.pill.cur{ background:color-mix(in srgb, var(--coral) 14%, var(--card)); color:var(--coral-ink);}

/* ---- suivi de l'accompagnement (arborescence des périodes) ---- */
.suivi-head{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 22px; margin:18px 0 16px; box-shadow:var(--shadow);}
.suivi-head .big{ font-size:17px; font-weight:700;}
.suivi-head .sub2{ color:var(--muted2); font-size:13.5px; margin-top:3px;}
.progressbar{ height:8px; border-radius:99px; background:var(--mist); margin-top:14px; overflow:hidden;}
.progressbar i{ display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--plum),var(--coral),var(--ocre)); transition:width .4s;}
.tl{ border-left:2px solid var(--line); margin:4px 0 20px 8px; padding:4px 0;}
.tl-row{ display:flex; align-items:center; gap:12px; padding:9px 4px 9px 0; flex-wrap:wrap;}
.tl-dot{ width:12px; height:12px; border-radius:50%; background:var(--paper);
  border:2px solid var(--sage); margin-left:-8px; flex:none;}
.tl-row.done .tl-dot{ background:var(--plum); border-color:var(--plum);}
.tl-row.cur .tl-dot{ background:var(--coral); border-color:var(--coral);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--coral) 20%, transparent);}
.tl-meta{ flex:1; min-width:180px;}
.tl-meta b{ font-size:14.5px;}
.tl-meta span{ display:block; font-size:12.5px; color:var(--muted2); margin-top:1px;}
.tl-row .btn{ padding:7px 14px; font-size:13px;}
.tl-row.sel-row{ background:var(--mist-2); border-radius:0 12px 12px 0;}
.tl-more{ font-size:13px; color:var(--faint); padding:8px 0 8px 16px; font-style:italic;}
.bilan-note{ font-size:13px; color:var(--muted2); background:var(--mist-2);
  border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:10px 0 16px;}
.obs-int{ margin:14px 0 40px; border:1px dashed var(--line); border-radius:14px; background:var(--mist-2);}
.obs-int > .d-head{ display:flex; justify-content:space-between; align-items:center;
  padding:12px 16px; cursor:pointer; font-size:13.5px; color:var(--muted);}
.obs-int dl{ padding:0 16px 14px;}
.reco{ display:grid; gap:8px; margin:14px 0 22px;}
.reco .axe{ align-items:flex-start;}
.probleme-block{ background:color-mix(in srgb, var(--coral) 8%, #fff); border:1px solid color-mix(in srgb, var(--coral) 30%, var(--line));
  border-left:4px solid var(--coral); border-radius:10px; padding:14px 18px; margin:0 0 22px;}
.probleme-block h4{ font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--coral-ink); margin-bottom:5px;}
.probleme-block p{ font-size:14px; color:var(--deep2);}
.empty{ text-align:center; padding:70px 20px; color:var(--muted2);}
.empty .big{ font-family:'Instrument Serif',serif; font-size:26px; color:var(--ink); margin-bottom:8px;}

/* ---- client detail ---- */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:24px 0;
  overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{ display:none;}
.tab{ background:none; border:none; padding:12px 18px; font-family:'Onest',sans-serif; font-size:14px;
  color:var(--muted2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  white-space:nowrap; flex:none;}
.tab.active{ color:var(--ink); border-color:var(--pine); font-weight:600;}
.doc-row{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 22px; margin-bottom:10px;}
.doc-row .d-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.doc-row .d-head b{ font-size:15px;}
.doc-row .d-head span{ font-size:12px; color:var(--faint);}
.doc-row .d-body{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:14px; white-space:pre-wrap; color:var(--deep);}
.kv{ display:grid; grid-template-columns:220px 1fr; gap:8px 18px; font-size:14px;}
.kv dt{ color:var(--muted2); font-size:12.5px; font-weight:600; padding-top:2px;}
.kv dd{ white-space:pre-wrap;}

/* ---- generation / document ---- */
.gen-overlay{ text-align:center; padding:90px 20px;}
.gen-overlay .spin{ width:52px; height:52px; border-radius:50%; border:3px solid var(--mist);
  border-top-color:var(--pine); margin:0 auto 24px; animation:spin 1s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg);} }
.gen-overlay h2{ font-size:30px;}
.gen-overlay p{ color:var(--muted2); margin-top:8px;}

.docsheet{ background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
  padding:54px 58px; margin:20px 0 40px;}
.doc-brand{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--ink); padding-bottom:18px;}
.doc-brand .ref{ text-align:right; font-size:11.5px; color:var(--muted2); letter-spacing:1px; text-transform:uppercase; line-height:1.7;}
.doc-title{ padding:34px 0 8px;}
.doc-title .eyebrow{ font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--pine-soft);}
.doc-title h1{ font-size:40px; line-height:1.1; margin-top:8px;}
.doc-title h1 em{ font-style:italic; color:var(--pine-soft);}
.synth{ background:var(--mist-2); border-left:3px solid var(--sage); padding:18px 22px; border-radius:0 12px 12px 0;
  font-size:14.5px; color:var(--deep); margin:18px 0 8px;}
.sec-title{ display:flex; align-items:center; gap:14px; margin:42px 0 18px;}
.sec-title h2{ font-size:26px; white-space:nowrap;}
.sec-title .rule{ flex:1; height:1px; background:var(--line);}
.sec-title .lab{ font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--sage);}

.externe{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.ext-block{ border:1px solid #E8DAD5; border-radius:14px; padding:18px 20px; background:#FDFAF9;}
.ext-block h4{ font-family:'Onest',sans-serif; font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--pine-soft); margin-bottom:8px;}
.ext-block p{ font-size:13px; color:var(--deep); line-height:1.55;}

.swot{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.swot-cell{ border-radius:16px; padding:22px;}
.swot-cell h4{ font-family:'Onest',sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.swot-cell h4 .sq{ width:8px; height:8px; border-radius:2px;}
.swot-cell ul{ list-style:none; display:flex; flex-direction:column; gap:10px;}
.swot-cell li b{ font-size:13.5px; display:block;}
.swot-cell li span{ font-size:12.5px; color:var(--deep2); line-height:1.45;}
.sw-f{ background:#EDF3EC;} .sw-f h4{ color:#3E6B4F;} .sw-f .sq{ background:#3E6B4F;}
.sw-w{ background:#F6EFE7;} .sw-w h4{ color:#A0754A;} .sw-w .sq{ background:#A0754A;}
.sw-o{ background:#EBF1F5;} .sw-o h4{ color:#4A6E8C;} .sw-o .sq{ background:#4A6E8C;}
.sw-m{ background:#F5ECEA;} .sw-m h4{ color:#A05B4B;} .sw-m .sq{ background:#A05B4B;}

.axes{ display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.axe{ display:flex; gap:14px; align-items:baseline; font-size:14.5px;}
.axe .n{ font-family:'Instrument Serif',serif; color:var(--sage); font-size:18px; min-width:26px;}

.phase{ margin-bottom:34px; page-break-inside:avoid;}
.phase-head{ display:flex; align-items:baseline; gap:16px; padding-bottom:10px; border-bottom:2px solid var(--pine); margin-bottom:16px;}
.phase-head .p-num{ font-family:'Instrument Serif',serif; font-size:34px; color:var(--pine);}
.phase-head .p-per{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2);}
.phase-head .p-obj{ margin-left:auto; font-size:13px; color:var(--deep); max-width:46%; text-align:right; font-style:italic; font-family:'Instrument Serif',serif; font-size:16px;}
/* Les 3 phases (J30 · J60 · J90) reprennent la progression prune → corail → ocre du logo */
.phase.ph-0 .phase-head{ border-bottom-color:var(--plum);} .phase.ph-0 .p-num{ color:var(--plum);}
.phase.ph-1 .phase-head{ border-bottom-color:var(--coral);} .phase.ph-1 .p-num{ color:var(--coral);}
.phase.ph-2 .phase-head{ border-bottom-color:var(--ocre);} .phase.ph-2 .p-num{ color:var(--ocre);}
.action{ display:grid; grid-template-columns:30px 1fr 210px; gap:18px; padding:22px 0; border-bottom:1px dashed var(--line);}
.action:last-child{ border-bottom:none;}
.action .a-n{ font-family:'Instrument Serif',serif; color:var(--sage); font-size:22px; line-height:1.1;}
.action .a-body{ min-width:0;}
.action .a-titre{ font-size:15px; display:block; line-height:1.35; margin-bottom:7px;}
.action .a-desc{ font-size:13px; color:var(--deep2); line-height:1.6; margin:0 0 4px;}
.action .a-steps{ list-style:none; margin:8px 0 4px; padding:0; display:flex; flex-direction:column; gap:7px;}
.action .a-steps li{ position:relative; padding-left:24px; font-size:13px; color:var(--deep2); line-height:1.5;}
.action .a-steps li::before{ content:counter(list-item); counter-increment:none; position:absolute; left:0; top:0;
  width:17px; height:17px; border-radius:50%; background:var(--mist); color:var(--pine);
  font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;}
.action .a-steps{ counter-reset:step;}
.action .a-steps li{ counter-increment:step;}
.action .a-steps li::before{ content:counter(step);}
.action .a-pilote{ display:inline-flex; align-items:center; gap:7px; margin-top:10px; font-size:12px;
  color:var(--pine); background:var(--mist-2); border:1px solid var(--line); border-radius:999px; padding:4px 12px;}
.action .a-pilote em{ font-style:normal; letter-spacing:1.2px; text-transform:uppercase; font-size:9.5px; color:var(--faint);}
.action .a-kpi{ font-size:12px; color:var(--pine); background:var(--mist-2); border-radius:12px; padding:12px 14px; align-self:start; line-height:1.5;}
.action .a-kpi small{ display:block; letter-spacing:1.5px; text-transform:uppercase; font-size:9.5px; color:var(--faint); margin-bottom:5px;}
.livrables{ margin-top:14px; font-size:13px; color:var(--deep); background:#FCF8F6; border:1px solid #E8DAD5; border-radius:12px; padding:12px 16px;}
.livrables b{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--pine-soft);}
.doc-foot{ margin-top:46px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:space-between;
  font-size:11px; color:var(--faint); letter-spacing:1px; text-transform:uppercase;}
.doc-actions{ display:flex; gap:10px; margin:6px 0 14px; flex-wrap:wrap;}
/* ---- composeur de pack : reprise du design de l'outil de composition ---- */
.pk-head h1{ font-size:30px; line-height:1.15;}
.pk-head p{ color:var(--muted); margin:6px 0 0; max-width:60ch;}
.pk-client{ margin:22px 0 8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.pk-client input{ flex:1 1 240px; font:inherit; padding:11px 13px; border:1.5px solid var(--line);
  border-radius:10px; background:var(--input-bg); color:var(--ink);}
.pk-client input:focus{ outline:none; border-color:var(--pine); background:var(--input-focus);}
.pk-sec{ margin-top:38px;}
.pk-sec h2{ font-family:'Instrument Serif',serif; font-size:24px; padding-bottom:10px; margin:0 0 6px;
  position:relative; font-weight:400;}
.pk-sec h2::after{ content:""; position:absolute; left:0; bottom:0; width:120px; height:4px; border-radius:2px;
  background:linear-gradient(90deg,var(--plum) 0 25%,var(--coral) 25% 50%,var(--ocre) 50% 75%,var(--ocre-light) 75%);}
.pk-hint{ color:var(--muted); font-size:14.5px; margin:0 0 14px;}
.pk-tiers{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.pk-tier{ text-align:left; cursor:pointer; background:var(--card); border:1.5px solid var(--line);
  border-radius:14px; padding:18px 16px 14px; font:inherit; color:var(--ink);
  display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;}
.pk-tier.on{ border-color:var(--pine); box-shadow:inset 0 0 0 1.5px var(--pine); background:var(--mist-2);}
.pk-tier h3{ font-family:'Instrument Serif',serif; font-size:21px; font-weight:400; margin:0;}
.pk-tier .pk-price{ font-size:28px; font-weight:700; margin:6px 0 2px; color:var(--pine-soft);
  font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
.pk-tier .pk-price small{ font-size:14px; color:var(--muted); font-weight:500;}
.pk-tier .pk-pitch{ font-size:13.5px; color:var(--muted); margin:0 0 10px;}
.pk-tier ul{ margin:0; padding:0; list-style:none; font-size:13.5px;}
.pk-tier li{ padding:5px 0 5px 20px; position:relative; border-top:1px solid var(--line);}
.pk-tier li::before{ content:"✓"; position:absolute; left:0; color:var(--coral-ink); font-weight:700;}
.pk-tier li.pk-inh{ color:var(--muted);} .pk-tier li.pk-inh::before{ content:"+"; color:var(--muted);}
.pk-seg{ display:flex; flex-wrap:wrap; gap:8px;}
.pk-seg button{ cursor:pointer; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:9px 17px; font:inherit; font-weight:500;}
.pk-seg button.on{ border-color:var(--pine); background:var(--pine); color:#fff;}
.pk-tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px;}
.pk-tile{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
  background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:14px;
  padding:14px; font:inherit; cursor:pointer;}
.pk-tile svg{ width:28px; height:28px; color:var(--coral-ink);}
.pk-tile .pk-tn{ font-weight:700; font-size:15px; line-height:1.2;}
.pk-tile .pk-tc{ font-size:12.5px; color:var(--muted);}
.pk-tile.has{ border-color:var(--pine); background:var(--mist-2); box-shadow:inset 0 0 0 1.5px var(--pine);}
.pk-tile.has .pk-tc{ color:var(--pine-soft); font-weight:600;}
.pk-sheet{ position:fixed; inset:0; z-index:60; background:rgba(35,26,31,.55);
  display:flex; align-items:flex-end; justify-content:center;}
.pk-sheet-in{ background:var(--paper); width:100%; max-width:640px; max-height:88vh; border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; overflow:hidden;}
.pk-sheet-in::before{ content:""; display:block; height:5px; flex:none;
  background:linear-gradient(90deg,var(--plum) 0 25%,var(--coral) 25% 50%,var(--ocre) 50% 75%,var(--ocre-light) 75%);}
@media (min-width:720px){ .pk-sheet{ align-items:center;} .pk-sheet-in{ border-radius:20px;} }
.pk-sheet-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex:none;}
.pk-sheet-head h3{ display:flex; align-items:center; gap:8px; font-size:19px; margin:0;
  font-family:'Instrument Serif',serif; font-weight:400;}
.pk-sheet-head h3 svg{ width:26px; height:26px; color:var(--coral-ink);}
.pk-cards{ overflow:auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  grid-auto-rows:max-content; align-content:start; gap:10px; flex:1;}
.pk-sheet-foot{ padding:12px 16px; border-top:1px solid var(--line); flex:none;}
.pk-opt{ position:relative; display:flex; flex-direction:column; gap:4px; padding:14px 14px 12px;
  background:var(--card); border:1.5px solid var(--line); border-radius:14px; cursor:pointer; min-height:150px;}
.pk-opt input[type=checkbox]{ position:absolute; top:12px; right:12px; width:22px; height:22px; margin:0; accent-color:var(--pine);}
.pk-opt b{ font-weight:600; line-height:1.25; padding-right:28px; font-size:14px;}
.pk-opt .pk-d{ display:block; color:var(--muted); font-size:12.5px; line-height:1.4;}
.pk-opt .pk-p{ margin-top:auto; padding-top:10px; font-size:17px; font-weight:700; color:var(--pine-soft);
  font-variant-numeric:tabular-nums;}
.pk-opt .pk-p small{ display:block; font-size:11.5px; color:var(--muted); font-weight:400;}
.pk-opt.on{ border-color:var(--pine); background:var(--mist-2); box-shadow:inset 0 0 0 1.5px var(--pine);}
.pk-bar{ position:fixed; left:0; right:0; bottom:0; background:var(--bar-bg); color:#fff;
  padding:12px 18px; z-index:40;}
.pk-bar::before{ content:""; position:absolute; left:0; right:0; top:0; height:4px;
  background:linear-gradient(90deg,var(--plum) 0 25%,var(--coral) 25% 50%,var(--ocre) 50% 75%,var(--ocre-light) 75%);}
.pk-bar-in{ max-width:900px; margin:0 auto; display:flex; gap:22px; align-items:flex-end; flex-wrap:wrap;}
.pk-fig{ display:flex; flex-direction:column;}
.pk-fig span{ font-size:12px; color:var(--ocre-light);}
.pk-fig strong{ font-size:28px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
.pk-fig.sm strong{ font-size:20px;}
.pk-bar .pk-act{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
.pk-bar button{ font:inherit; font-weight:600; font-size:14.5px; border:0; border-radius:999px; padding:11px 18px;
  cursor:pointer; background:var(--ocre-light); color:var(--plum-deep);}
.pk-bar button.ghost{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.45);}
.pk-bar button:disabled{ opacity:.5; cursor:not-allowed;}
.pk-pages{ width:4.5em; font:inherit; padding:3px 7px; border:1.5px solid var(--line);
  border-radius:6px; background:var(--input-bg); color:var(--ink);}
@media (max-width:720px){
  .pk-tiers{ grid-template-columns:1fr;}
  .pk-head h1{ font-size:24px;}
  .pk-sec{ margin-top:30px;}
  .pk-sec h2{ font-size:21px;}
  /* la barre passe sur deux lignes : chiffres au-dessus, actions en dessous,
     sinon le groupe de boutons dépasse la largeur de l'écran */
  .pk-bar{ padding:10px 14px;}
  .pk-bar-in{ gap:8px 18px;}
  .pk-fig strong{ font-size:23px;}
  .pk-fig.sm strong{ font-size:18px;}
  .pk-bar .pk-act{ margin-left:0; width:100%; min-width:0;}
  .pk-bar .pk-act button{ flex:1 1 auto; padding:10px 12px; font-size:13.5px;}
  .pk-sheet-in{ max-height:88dvh;}
  .pk-cards{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}
.pack-opt .pack-p{ margin-left:auto; font-style:normal; font-size:12px; font-weight:600;
  color:var(--pine); white-space:nowrap; align-self:center;}
.pack-total{ display:flex; gap:18px; flex-wrap:wrap; background:var(--mist-2);
  border:1px solid var(--line); border-radius:18px; padding:20px 24px; margin:0 0 16px;}
.pack-total .pt-fig{ display:flex; flex-direction:column; gap:2px; min-width:180px;}
.pack-total .pt-fig span{ font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted);}
.pack-total .pt-fig strong{ font-family:'Instrument Serif',serif; font-size:32px; line-height:1.1; color:var(--pine);}
.pack-total .pt-fig small{ font-size:12px; color:var(--muted);}
.devis-tab{ display:flex; flex-direction:column; margin:4px 0 18px; border-top:1px solid var(--line);}
.devis-l{ display:flex; gap:16px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line);}
.devis-l div{ display:flex; flex-direction:column; gap:2px; flex-grow:1;}
.devis-l b{ font-size:14px;}
.devis-l span{ font-size:12.5px; color:var(--deep2); line-height:1.45;}
.devis-l em{ font-style:normal; font-weight:600; font-size:15px; color:var(--pine); white-space:nowrap;}
.devis-rem em{ color:var(--pine-soft);}
.devis-tot{ border-bottom:2px solid var(--pine);}
.devis-tot b, .devis-tot em{ font-size:17px;}
.pack-opts{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:4px;}
.pack-grp h5{ font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--pine-soft);
  margin:0 0 7px; font-weight:600;}
.pack-opt{ display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border-radius:10px;
  border:1px solid var(--line); background:#fff; cursor:pointer; margin-bottom:6px;}
.pack-opt.on{ border-color:var(--pine); background:var(--mist-2);}
.pack-opt input{ margin-top:3px; flex-shrink:0; accent-color:var(--pine);}
.pack-opt span{ display:flex; flex-direction:column; gap:1px; min-width:0;}
.pack-opt b{ font-size:13px; line-height:1.3;}
.pack-opt em{ font-style:normal; font-size:11.5px; color:var(--muted); line-height:1.35;}
@media (max-width:720px){ .pack-opts{ grid-template-columns:1fr;} }
.affiner{ background:var(--mist-2); border:1px solid var(--line); border-radius:16px;
  padding:18px 20px; margin:0 0 16px; display:flex; flex-direction:column; gap:12px;}
.affiner .aff-head{ display:flex; flex-direction:column; gap:3px;}
.affiner .aff-head b{ font-size:15px; color:var(--pine);}
.affiner .aff-head span{ font-size:13px; color:var(--muted);}
.affiner textarea{ width:100%; box-sizing:border-box; resize:vertical; font-family:inherit;
  font-size:14px; line-height:1.5; color:var(--deep); background:#fff;
  border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
.affiner textarea:focus{ outline:none; border-color:var(--pine);}
.affiner textarea:disabled{ opacity:.6;}
.affiner .aff-foot{ display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.affiner .aff-stage{ font-size:13px; color:var(--muted);}
.err{ background:#F7ECEA; border:1px solid #E3C6BF; color:var(--danger); border-radius:12px; padding:14px 18px; font-size:14px; margin:14px 0;}
.export-note{ background:var(--mist-2); border:1px solid var(--line); color:var(--pine); border-radius:12px;
  padding:12px 16px; font-size:13.5px; margin:0 0 14px;}

/* ---- modal ---- */
.overlay{ position:fixed; inset:0; background:rgba(30,50,49,.35); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; z-index:100;
  padding:24px 16px; overflow-y:auto;}
@media (min-height:700px){ .overlay{ align-items:center;} }
.modal{ background:var(--card); border-radius:20px; padding:30px; width:100%; max-width:560px;
  box-shadow:0 30px 80px rgba(0,0,0,.2); max-height:min(88vh, 88dvh); overflow-y:auto;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
@media (max-width:520px){ .modal{ padding:22px 18px; border-radius:16px;} }
.modal h3{ font-size:24px; margin-bottom:16px;}

@media (max-width:760px){
  .home-cards,.grid2,.grid3,.swot,.externe{ grid-template-columns:1fr;}
  .hero h1{ font-size:36px;}
  .docsheet{ padding:30px 22px;}
  .action{ grid-template-columns:24px 1fr; gap:12px;}
  .action .a-kpi{ grid-column:2;}
  .kv{ grid-template-columns:1fr;}
  .phase-head .p-obj{ display:none;}
}
@media print{
  @page{ size:A4; margin:14mm;}
  html,body{ background:#fff !important;}
  body *{ visibility:hidden;}
  .print-zone, .print-zone *{ visibility:visible;}
  .print-zone{ position:absolute; left:0; top:0; width:100%;}
  .docsheet{ border:none; box-shadow:none; border-radius:0; padding:0; margin:0;}
  .doc-actions,.topbar,.suivi-head,.tl,.tl-more,.obs-int,.bilan-note,.err,.export-note,.tabs,.affiner{ display:none !important;}
  /* sans cela les aplats (SWOT, encadrés KPI, pastilles) sortent en blanc */
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
  /* une phase entière dépasse une page : lui interdire de se couper poussait
     tout le bloc à la page suivante et laissait une page blanche derrière lui */
  .phase{ page-break-inside:auto !important; break-inside:auto !important;}
  /* en revanche aucun bloc de contenu ne doit être coupé en deux */
  .action,.kv,.swot-cell,.axe,.livrables,.a-kpi,.phase-head,.sec-title,.doc-title{
    page-break-inside:avoid; break-inside:avoid;}
  /* un titre ne reste jamais seul en bas de page */
  .phase-head,.sec-title,h1,h2,h3,h4{ page-break-after:avoid; break-after:avoid;}
  p,li{ orphans:3; widows:3;}
}
@media (prefers-reduced-motion:reduce){
  .btn,.home-card,.client-row{ transition:none;}
  .gen-overlay .spin{ animation-duration:2.5s;}
}

/* ---- ergonomie tactile : sur mobile, toute zone cliquable atteint 44 px,
   la taille minimale recommandée pour le doigt, et les libellés les plus
   petits du document remontent au-dessus de 12 px ---- */
@media (max-width:640px){
  .theme-btn{ width:44px; height:44px; font-size:18px;}
  .btn{ min-height:44px; justify-content:center;}
  .btn-primary{ padding:12px 22px;}
  .btn-ghost, .btn-soft{ padding:11px 18px;}
  .btn-danger{ padding:11px 16px; font-size:14px;}
  .tab{ min-height:46px; padding:12px 16px;}
  /* la zone cliquable du fil d'ariane est agrandie sans changer son aspect */

   Sauvegarde/restauration via les réglages pour changer de poste. */
const appStorage = {
  async get(k) { const v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; },
  async set(k, v) { localStorage.setItem(k, v); return { key: k, value: v }; },
  async delete(k) { localStorage.removeItem(k); return { key: k, deleted: true }; },
};

};

/* ---------------- storage helpers ---------------- */
const IDX_KEY = "acdcom:index";

async function loadIndex() {
  try {
    const r = await appStorage.get(IDX_KEY);
    return r ? JSON.parse(r.value) : [];
  } catch { return []; }
}
async function saveIndex(idx) {
  try { await appStorage.set(IDX_KEY, JSON.stringify(idx)); } catch (e) { console.error(e); }
}
async function loadClient(id) {
  try {
    const r = await appStorage.get("acdcom:client:" + id);
    return r ? JSON.parse(r.value) : null;
  } catch { return null; }
}
async function saveClient(id, data) {
  try { await appStorage.set("acdcom:client:" + id, JSON.stringify(data)); return true; }
  catch (e) { console.error(e); return false; }
}
async function deleteClient(id) {
  try { await appStorage.delete("acdcom:client:" + id); } catch (e) { console.error(e); }
}

/* ---------------- synchronisation multi-appareils (Firebase) ----------------
   Optionnelle : l'utilisateur colle la configuration de son projet Firebase
   dans les réglages, se connecte par e-mail/mot de passe, et les dossiers
   sont répliqués dans Firestore (users/{uid}/clients). Le localStorage reste
   la source de travail ; la synchro fusionne (le plus récent gagne) et gère
   les suppressions via des tombstones (users/{uid}/meta/sync). */
const CLOUD = {
  app: null, auth: null, db: null,
  cfg() { try { return JSON.parse(localStorage.getItem("acccom:fb") || "null"); } catch { return null; } },
  setCfg(o) { localStorage.setItem("acccom:fb", JSON.stringify(o)); },
  clearCfg() { localStorage.removeItem("acccom:fb"); },
  configured() { const c = this.cfg(); return !!(c && c.apiKey && c.projectId); },
  init() {
    if (this.app) return true;
    if (!window.firebase || !this.configured()) return false;
    try {
      this.app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(this.cfg());
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      return true;
    } catch (e) { console.error("Firebase init:", e); this.app = null; return false; }
  },
  user() { return this.auth ? this.auth.currentUser : null; },
  ready() { return !!(this.db && this.user()); },
  col() { return this.db.collection("users").doc(this.user().uid).collection("clients"); },
  metaRef() { return this.db.collection("users").doc(this.user().uid).collection("meta").doc("sync"); },
  async push(id, data) {
    if (!this.ready()) return;
    await this.col().doc(id).set({
      data: JSON.stringify(data),
      updatedAt: data.updatedAt || data.createdAt || new Date().toISOString(),
    });
  },
  async remove(id) {
    if (!this.ready()) return;
    await this.col().doc(id).delete();
    await this.metaRef().set({ deleted: { [id]: new Date().toISOString() } }, { merge: true });
  },
  async pullAll() {
    const snap = await this.col().get();
    const out = new Map();
    snap.forEach((d) => {
      try { out.set(d.id, JSON.parse(d.data().data)); } catch (e) { console.error(e); }
    });
    return out;
  },
  async tombstones() {
    try {
      const d = await this.metaRef().get();
      return (d.exists && d.data().deleted) || {};
    } catch { return {}; }
  },
};

const ts = (c) => (c && (Date.parse(c.updatedAt || c.createdAt || "") || 0)) || 0;

/* Accepte le bloc tel que fourni par la console Firebase (clés non citées). */
function parseFbConfig(text) {
  const m = String(text).match(/\{[\s\S]*\}/);
  if (!m) throw new Error("Configuration introuvable — collez le bloc complet { apiKey: … }");
  const s = m[0]
    .replace(/\/\/[^\n]*/g, "")
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
    .replace(/'/g, '"')
    .replace(/,\s*\}/g, "}");
  let cfg;
  try { cfg = JSON.parse(s); } catch { throw new Error("Configuration illisible — recopiez le bloc depuis la console Firebase"); }
  if (!cfg.apiKey || !cfg.projectId) throw new Error("Configuration incomplète : apiKey ou projectId manquant");
  return cfg;
}

function indexEntry(id, rest) {
  return {
    id, nom: rest.form.entreprise, secteur: rest.form.secteur, duree: rest.form.duree,
    formule: rest.form.formule || null, dureeAccomp: rest.form.dureeAccomp, cadence: rest.form.cadence,
    nbPeriodes: nbPlanifiees(rest), totalPeriodes: rest.form.formule === "accompagnement" ? suiviMeta(rest.form).total : null,
    cloture: !!rest.cloture,
    createdAt: rest.createdAt, updatedAt: rest.updatedAt, hasResult: !!rest.result,
  };
}

/* Fusion complète local <-> Firestore. Le document le plus récent gagne ;
   une suppression plus récente que la dernière modification locale s'applique. */
async function fullSync() {
  if (!CLOUD.ready()) return null;
  const [remote, tomb] = await Promise.all([CLOUD.pullAll(), CLOUD.tombstones()]);
  const idx = await loadIndex();
  const localIds = new Set(idx.map((e) => e.id));

  // suppressions distantes -> local
  for (const [id, when] of Object.entries(tomb)) {
    if (!localIds.has(id) || remote.has(id)) continue;
    const local = await loadClient(id);
    if (local && (Date.parse(when) || 0) >= ts(local)) {
      await deleteClient(id); localIds.delete(id);
    }
  }
  // distant -> local (nouveau ou plus récent)
  for (const [id, rdata] of remote) {
    const local = await loadClient(id);
    if (!local || ts(rdata) > ts(local)) await saveClient(id, rdata);
    localIds.add(id);
  }
  // local -> distant (absent ou plus récent, hors suppression plus fraîche)
  for (const id of [...localIds]) {
    const local = await loadClient(id);
    if (!local) { localIds.delete(id); continue; }
    const delT = Date.parse(tomb[id] || "") || 0;
    if (delT >= ts(local) && !remote.has(id)) continue;
    if (!remote.has(id) || ts(local) > ts(remote.get(id))) {
      try { await CLOUD.push(id, local); } catch (e) { console.error(e); }
    }
  }
  // reconstruire l'index depuis les dossiers présents en local
  const nextIdx = [];
  for (const id of localIds) {
    const c = await loadClient(id);
    if (c && c.form) nextIdx.push(indexEntry(id, c));
  }
  await saveIndex(nextIdx);
  return nextIdx;
}

/* ---------------- formules & suivi ----------------
   - "accompagnement" : abonnement dans la durée (6 mois / 1 an / 2 ans),
     rythmé par des périodes de 30 j (suivi mensuel) ou 90 j (suivi trimestriel).
     Chaque période : bilan des résultats -> nouveau plan pour la période suivante.
   - "cible" : intervention ponctuelle sur une problématique précise,
   - "audit"  : diagnostic seul (analyse externe, SWOT, axes), sans plan d'action,
     plan unique de 30 ou 90 jours selon la complexité.
   - anciens dossiers sans formule : plan unique 30/60/90 (comportement historique). */
const cadLabel = (cad) => (String(cad) === "30" ? "mensuel" : "trimestriel");
const accompLabel = (m) => (String(m) === "6" ? "6 mois" : String(m) === "12" ? "1 an" : "2 ans");

function suiviMeta(form) {
  const cad = parseInt(form.cadence || form.duree || "90", 10) === 30 ? 30 : 90;
  const months = [6, 12, 24].includes(parseInt(form.dureeAccomp, 10)) ? parseInt(form.dureeAccomp, 10) : 12;
  const total = cad === 30 ? months : Math.max(1, Math.round(months / 3));
  return { cad, months, total };
}

});
/* Calcul des montants — reprise fidèle de l'outil de composition. */
function packCompute(pack) {
  const t = packTier(pack.tier) || PACK_TIERS[1];
  const eng = PACK_ENGAGE.find((e) => e.id === pack.engage) || PACK_ENGAGE[0];
  const n = eng.mois;
  const pages = pack.pages || 5;
  const opts = pack.opts || [];
  const total = (o) => o.p * (o.qty ? pages : 1);
  const perMonth = (o) => Math.ceil(total(o) / n);
  const unique = pack.pay === "unique";
  const isOne = (o) => unique || !!o.nomens;
  const mSel = PACK_MONTH_FLAT.filter((o) => opts.includes(o.id));
  const oSel = PACK_ONE_FLAT.filter((o) => opts.includes(o.id));
  const mGross = t.prix + mSel.reduce((a, o) => a + o.p, 0);
  const disc = mGross * eng.remise;
  const oMens = oSel.filter((o) => !isOne(o));
  const oOne = oSel.filter(isOne);
  const spread = oMens.reduce((a, o) => a + perMonth(o), 0);
  const one = oOne.reduce((a, o) => a + total(o), 0);
  const month = mGross - disc + spread;
  return { tier: t, eng, n, pages, mSel, oSel, oMens, oOne, disc, one, month, total, perMonth, isOne,
           engagementTotal: month * n + one };
}

/* Répare un JSON tronqué : ferme les chaînes et les crochets restés ouverts. */
function parseJsonLoose(text) {
  let s = text.replace(/```json|```/g, "").trim();
  const start = s.indexOf("{");
  if (start === -1) throw new Error("Aucun JSON dans la réponse");
  s = s.slice(start);
  const end = s.lastIndexOf("}");
  // 1er essai : parse direct sur la portion la plus large
  if (end !== -1) {
    try { return JSON.parse(s.slice(0, end + 1)); } catch (_) { /* on répare */ }
  }
  // Réparation : équilibrage des chaînes et des crochets
  const stack = [];
  let inStr = false, esc = false, lastSafe = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === "\\") esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === "{" ) stack.push("}");
    else if (c === "[") stack.push("]");
    else if (c === "}" || c === "]") { stack.pop(); lastSafe = i; }
    else if (c === ",") lastSafe = i;
  }
  let repaired = s;
  if (inStr) repaired += '"';
  // retire une éventuelle virgule/valeur pendante puis referme tout
  repaired = repaired.replace(/,\s*("[^"]*)?$/s, (m) => (inStr ? m : ""));
  for (let i = stack.length - 1; i >= 0; i--) repaired += stack[i];
  try { return JSON.parse(repaired); } catch (_) {
    // dernier recours : couper au dernier point sûr et refermer
    let cut = s.slice(0, lastSafe + 1).replace(/,\s*$/, "");
    const st2 = [];
    let str2 = false, esc2 = false;
    for (const c of cut) {
      if (str2) { if (esc2) esc2 = false; else if (c === "\\") esc2 = true; else if (c === '"') str2 = false; continue; }
      if (c === '"') str2 = true;
      else if (c === "{") st2.push("}");
      else if (c === "[") st2.push("]");
      else if (c === "}" || c === "]") st2.pop();
    }
    for (let i = st2.length - 1; i >= 0; i--) cut += st2[i];
    return JSON.parse(cut);
  }
}

async function callAnthropic(prompt, { search = false, maxTokens = 4000 } = {}) {
  const body = {
    model: CFG.model(),
    max_tokens: maxTokens,
    messages: [{ role: "user", content: prompt }],
  };
  if (search) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": CFG.key(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (data.error) {
    if (data.error.type === "authentication_error") throw new Error("NO_KEY");
    throw new Error(data.error.message || "Erreur API");
  }
  /* L'API signale explicitement qu'elle a été coupée par la limite de longueur.
     On le traite comme une erreur : mieux vaut relancer que livrer un plan amputé. */
  if (data.stop_reason === "max_tokens") {
    const err = new Error("Réponse coupée par la limite de longueur");
    err.code = "TRUNCATED";
    throw err;
  }
  return (data.content || []).map((i) => (i.type === "text" ? i.text : "")).filter(Boolean).join("\n");
}

async function callGemini(prompt, { maxTokens = 4000 } = {}) {
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
    + encodeURIComponent(CFG.gkey());
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: maxTokens, temperature: 0.6 },
    }),
  });
  const data = await response.json();
  if (data.error) {
    if (data.error.code === 400 || data.error.code === 401 || data.error.code === 403) throw new Error("NO_KEY");
    if (data.error.code === 429) throw new Error("Quota gratuit Gemini atteint pour l'instant — patientez une minute puis réessayez.");
    throw new Error(data.error.message || "Erreur API Gemini");
  }
  const cand = data.candidates && data.candidates[0];
  if (cand && cand.finishReason === "MAX_TOKENS") {
    const err = new Error("Réponse coupée par la limite de longueur");
    err.code = "TRUNCATED";
    throw err;
  }
  return ((cand && cand.content && cand.content.parts) || []).map((p) => p.text || "").join("\n");
}

async function callClaude(prompt, opts = {}) {
  if (!CFG.activeKey()) throw new Error("NO_KEY");
  return CFG.provider() === "gemini" ? callGemini(prompt, opts) : callAnthropic(prompt, opts);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* Vérifie qu'une phase est COMPLÈTE avant de l'accepter. parseJsonLoose sait
   réparer un JSON tronqué, mais une action amputée ou sans KPI resterait alors
   invisible jusque dans le document remis au client : on la refuse ici. */
function checkPhase(p) {
  if (!p || typeof p !== "object") throw new Error("Phase vide");
  const actions = Array.isArray(p.actions) ? p.actions : [];
  if (!actions.length) throw new Error("Phase sans action");
  actions.forEach((a, i) => {
    for (const champ of ["titre", "description", "kpi"]) {
      if (!a || !String(a[champ] || "").trim()) throw new Error(`Action ${i + 1} : ${champ} manquant`);
    }
    const d = String(a.description).trim();
    if (!/[.!?»)\]]$/.test(d)) throw new Error(`Action ${i + 1} : description coupée en cours de phrase`);
  });
  return p;
}

/* Appel + parse, avec tentatives automatiques espacées (les erreurs serveur
   sont souvent passagères : on attend avant de réessayer). Si la réponse a été
   coupée ou revient incomplète, on relance avec une limite de longueur plus haute. */
async function callAndParse(prompt, opts, tries = 3, check = null) {
  let lastErr;
  const o = Object.assign({ maxTokens: 4000 }, opts);
  for (let i = 0; i < tries; i++) {
    try {
      const data = parseJsonLoose(await callClaude(prompt, o));
      return check ? check(data) : data;
    } catch (e) {
      if (e.message === "NO_KEY") throw e;   // inutile d'insister sur une clé invalide
      lastErr = e;
      console.warn(`Tentative ${i + 1}/${tries} échouée :`, e.message);
      if (e.code === "TRUNCATED" || /coupée|manquant|sans action|Phase vide/.test(e.message)) {
        o.maxTokens = Math.min(Math.round(o.maxTokens * 1.6), 16000);
        console.warn(`→ nouvelle tentative avec maxTokens = ${o.maxTokens}`);
      }
      if (i < tries - 1) await wait(1800 * (i + 1));
    }
  }
  throw lastErr;
}

/* Étape 3 — le plan, généré phase par phase (appels courts et fiables) */
const PHASE_DEFS = [
  { periode: "0–30 jours", role: "les FONDATIONS : structurer, outiller, préparer le terrain" },
  { periode: "31–60 jours", role: "le DÉPLOIEMENT : exécuter, prospecter, mesurer les premiers résultats" },

async function generatePhase(form, externe, swot, axes, idx, total, phasesPrecedentes) {
  const def = PHASE_DEFS[idx];
  const autres = PHASE_DEFS.slice(0, total).filter((_, j) => j !== idx)

  const rappel = total > 1
    ? `\nIMPORTANT — CLOISONNEMENT : les autres phases du plan sont rédigées séparément (${autres}). Ne planifie ICI que ce qui relève strictement du rôle de ta phase. Une action de fondation ne doit pas apparaître en phase de déploiement, et inversement.\n`
    : "";
  const prompt = `${ROLE}

Tu rédiges la phase ${idx + 1} sur ${total} du plan d'action commercial : ${def.periode}, dont le rôle est ${def.role}.

${dataBlock(form)}

{
  "periode": "${def.periode}",

  "actions": [{"titre":"string","description":"string","responsable":"string","kpi":"string"}],

/* Orchestration : le SWOT d'abord, puis TOUT le reste en parallèle
   (synthèse, axes et chaque phase du plan partent en même temps). */
async function generateAnalysis(form, onStage) {
  const auditSeul = form.formule === "audit";
  const nb = auditSeul ? 0 : form.duree === "30" ? 1 : form.duree === "60" ? 2 : 3;

  onStage && onStage("Étape 1 / 2 — Analyse externe du marché et construction du SWOT…");
  const step1 = await generateExterneSwot(form);
  if (!step1.swot) throw new Error("SWOT manquant dans la réponse");
  const externe = step1.externe || {};

  /* Audit seul : le client n'a payé que le diagnostic. On s'arrête après la
     synthèse et les axes — aucun plan d'action n'est produit ni facturé. */
  if (auditSeul) {
    onStage && onStage("Étape 2 / 2 — Synthèse exécutive et axes stratégiques…");
    const step2 = await generateSyntheseAxes(form, externe, step1.swot);
    return {
      externe: step1.externe || null,
      swot: step1.swot,
      synthese: step2.synthese || "",
      axes: step2.axes || [],
      plan: [],
    };
  }

  onStage && onStage("Étape 2 / 2 — Synthèse, axes stratégiques et phases du plan (en parallèle)…");
  // La synthèse/axes et chaque phase partent simultanément : le temps total
  // est celui du plus long appel, pas la somme de tous.
  const axesQuick = null; // les phases reçoivent les axes via le SWOT et les objectifs
  const [step2, ...phases] = await Promise.all([
    generateSyntheseAxes(form, externe, step1.swot),
    ...Array.from({ length: nb }, (_, i) =>
      generatePhase(form, externe, step1.swot, axesQuick, i, nb, [])
    ),
  ]);

  return {
    externe: step1.externe || null,
    swot: step1.swot,
    synthese: step2.synthese || "",
    axes: step2.axes || [],
    plan: phases,
  };
}

}

/* Étape B — phases du plan de la période suivante */
const SUIVI_PHASE_DEFS = [
  { periode: "0–30 jours", role: "la RELANCE : ajuster ce qui doit l'être, reprogrammer les actions inabouties, remettre en mouvement dès le début de période" },
  { periode: "31–60 jours", role: "la MONTÉE EN PUISSANCE : déployer et intensifier ce qui produit des résultats" },
  { periode: "61–90 jours", role: "la CONSOLIDATION : ancrer les acquis, mesurer, préparer la période suivante" },
];
const SUIVI_PHASE_MOIS = [
  { periode: "0–30 jours", role: "un mois d'exécution complet : corriger ce qui doit l'être, prolonger ce qui fonctionne et produire des résultats mesurables sous 30 jours" },
];

async function generatePhaseSuivi(form, synth, prevPlan, bilan, idx, total, numSuivant) {
  const defs = total === 1 ? SUIVI_PHASE_MOIS : SUIVI_PHASE_DEFS;
  const def = defs[idx];
  const autres = defs.slice(0, total).filter((_, j) => j !== idx)
    .map((p) => `${p.periode} (${p.role})`).join(" ; ");
  const rappel = total > 1
    ? `\nIMPORTANT — CLOISONNEMENT : les autres phases du plan sont rédigées séparément (${autres}). Ne planifie ICI que ce qui relève strictement du rôle de ta phase.\n`
    : "";
  const prompt = `${ROLE}

${suiviContexte(form, numSuivant - 1)} Tu rédiges maintenant la phase ${idx + 1} sur ${total} du plan d'action de la PÉRIODE ${numSuivant} : ${def.periode}, dont le rôle est ${def.role}.

RÈGLES DE CONTINUITÉ (essentielles) :
- Ne recopie pas à l'identique des actions déjà réalisées ; prolonge-les, intensifie-les ou passe à l'étape suivante.
- Reprogramme explicitement, en l'adaptant aux causes de l'échec, toute action importante non réalisée pendant la période écoulée.
- Appuie-toi sur les réussites et corrige les points de vigilance identifiés dans le bilan.
- Chaque action doit être reliée à un constat du bilan, à un axe retenu ou à une priorité exprimée par le client.

DONNÉES D'AUDIT INITIAL :
${dataBlock(form)}${perimetreBlock(form)}

PLAN DE LA PÉRIODE ÉCOULÉE :
${planResume(prevPlan)}

BILAN OBSERVÉ :
${bilanBlock(bilan)}

ÉVALUATION DE LA PÉRIODE : ${JSON.stringify({ synthese: synth.synthese, reussites: synth.reussites, vigilances: synth.vigilances })}
AXES RETENUS POUR LA PÉRIODE ${numSuivant} : ${JSON.stringify(synth.axes || [])}
${rappel}
Produis : un objectif de phase (une phrase), 4 à 5 actions concrètes (titre, description opérationnelle précise indiquant COMMENT faire, responsable suggéré, KPI mesurable avec une cible chiffrée réaliste), et 2 à 4 livrables de fin de phase.
CHAQUE description fait 70 mots MAXIMUM et se termine par une phrase complète. Chaque action doit impérativement comporter son KPI.

Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{
  "periode": "${def.periode}",
  "objectif": "string",
  "actions": [{"titre":"string","description":"string","responsable":"string","kpi":"string"}],
  "livrables": ["string"]
}`;
  return callAndParse(prompt, { search: false, maxTokens: 8000 }, 3, checkPhase);
}

/* Orchestration du suivi : évaluation d'abord (elle nourrit les phases),
   puis les phases du plan suivant en parallèle. cloture=true en fin
   d'accompagnement : évaluation + bilan global, pas de plan suivant. */
/* Construit le plan d'action à partir d'un diagnostic déjà généré : le SWOT et
   l'analyse externe ne sont pas repayés. Sert quand un client parti sur un
   audit seul souscrit ensuite un pack. */
async function generatePlanDepuisDiagnostic(form, result, onStage) {
  const nb = form.duree === "30" ? 1 : form.duree === "60" ? 2 : 3;
  onStage && onStage("Construction du plan d'action à partir du diagnostic existant…");
  return Promise.all(Array.from({ length: nb }, (_, i) =>
    generatePhase(form, result.externe || {}, result.swot, null, i, nb, [])));
}

async function generateSuivi(form, prevPlan, bilan, numPeriode, cloture, onStage) {
  onStage && onStage(`Étape 1 / ${cloture ? 1 : 2} — Analyse du bilan de la période ${numPeriode}…`);
  const synth = await generateBilanSynthese(form, prevPlan, bilan, numPeriode, cloture);
  if (cloture) return { synth, plan: null };

  const { cad } = suiviMeta(form);
  const nb = cad === 30 ? 1 : 3;
  onStage && onStage(`Étape 2 / 2 — Construction du plan de la période ${numPeriode + 1}…`);
  const phases = await Promise.all(
    Array.from({ length: nb }, (_, i) =>
      generatePhaseSuivi(form, synth, prevPlan, bilan, i, nb, numPeriode + 1))
  );
  return { synth, plan: phases };
}

function Logo({ size = 26 }) {
  const gid = React.useId().replace(/[^a-zA-Z0-9]/g, "");
  const letters = ["A", "C", "C", "C", "O", "M"];
  const refs = useRef([]);
  const [L, setL] = useState(null);

  // Style des lettres écrit EN DUR (pas via classe CSS) : les styles par classe ne
  // traversent pas les clones <use> sur Chrome/Windows ni Safari iOS, ce qui faisait
  // apparaître les C et le O en minuscule sur ces appareils.
  /* fill explicite : sans lui, le A et le M retombent sur le noir par défaut du SVG
     et disparaissent en mode sombre, alors que les arceaux suivent la palette. */
  const LG = { fontFamily: "'Syne',sans-serif", fontWeight: 800, fontSize: "46px", letterSpacing: 0, fill: "var(--logo-ink)" };

  const GAP = -3;      // lettres quasi collées
  const PAD = 8;       // marge (le M ne doit jamais être rogné)
  const ANGLE = 45;
  const SC = Math.cos((ANGLE * Math.PI) / 180);

  useLayoutEffect(() => {
    let dead = false;
    function measure() {
      if (dead) return;
      const b = refs.current.map((el) => el && el.getBBox());
      if (!b.every((x) => x && x.width > 0)) { requestAnimationFrame(measure); return; }

      let cur = PAD;
      const pos = [];
      b.forEach((box) => { pos.push(cur - box.x); cur += box.width + GAP; });
      const W = cur - GAP + PAD;

      const arc = [1, 2, 3, 4].map((i) => {
        const box = b[i];
        const cx = pos[i] + box.x + box.width / 2;
        return { i, cx, visLeft: cx - (box.width / 2) * SC, visRight: cx + (box.width / 2) * SC };
      });

      const gh = b[1].height;
      const tubeH = gh * 0.26;                 // fin, pour ne pas dépasser la courbe intérieure du C
      const midY = b[1].y + b[1].height / 2;
      const tubeY = midY - tubeH / 2;
      const tubeX = arc[0].visLeft;
      const tubeR = arc[3].visRight;   // le tube remplit tout le creux du O ; le O, redessiné
                                        // entier par-dessus, garde ses bords en encre nets.

      // frontières de couleur : au milieu de la partie gauche du 2e C, 3e C, O (cachées)
      const cut = [
        (arc[1].visLeft + arc[1].cx) / 2,
        (arc[2].visLeft + arc[2].cx) / 2,
        (arc[3].visLeft + arc[3].cx) / 2,
      ];

      setL({ pos, W, arc, tubeH, tubeY, tubeX, tubeR, cut, midY });
    }
    // La mise en page dépend de la mesure des lettres (getBBox). Si Syne n'est pas encore
    // réellement appliquée, on mesure la police de secours → lettres superposées (iOS) ou
    // mal dimensionnées (Windows). On vérifie donc que Syne est bien active avant de figer :
    // on compare la largeur du "M" en Syne à celle de la police de secours ; tant qu'elles
    // sont identiques, la police n'est pas encore là et on réessaie.
    function syneApplied() {
      try {
        const el = refs.current[5];
        if (!el) return false;
        const w1 = el.getBBox().width;
        if (!w1) return false;
        const probe = document.createElementNS("http://www.w3.org/2000/svg", "text");
        probe.setAttribute("y", "63");
        probe.setAttribute("style", "font-family:sans-serif;font-weight:800;font-size:46px");
        probe.textContent = "M";
        el.parentNode.appendChild(probe);
        const w2 = probe.getBBox().width;
        probe.remove();
        return Math.abs(w1 - w2) > 0.5;   // largeurs différentes = Syne bien appliquée
      } catch (e) { return true; }        // en cas de doute, on n'empêche pas l'affichage
    }

    let tries = 0, done = false;
    function tryMeasure() {
      if (dead || done) return;           // une fois la mise en page faite, on n'y retouche plus
      if (syneApplied() || tries > 60) { done = true; measure(); return; }
      tries++;
      setTimeout(tryMeasure, 100);        // réessai jusqu'à ~6 s
    }

    if (document.fonts && document.fonts.load) {
      document.fonts.load("800 46px Syne").then(tryMeasure).catch(tryMeasure);
      document.fonts.ready.then(tryMeasure);
      setTimeout(tryMeasure, 300);
    } else if (document.fonts && document.fonts.ready) document.fonts.ready.then(tryMeasure);
    else tryMeasure();
    return () => { dead = true; };
  }, []);

  const vbH = 92;
  const vbW = L ? L.W : 320;
  const h = size * 1.8, w = h * (vbW / vbH);

  const cols = ["var(--tube-1)", "var(--tube-2)", "var(--tube-3)", "var(--tube-out)"];
  const seg = L ? [
    { x: L.tubeX, x2: L.cut[0], fill: cols[0] },
    { x: L.cut[0], x2: L.cut[1], fill: cols[1] },
    { x: L.cut[1], x2: L.cut[2], fill: cols[2] },
    { x: L.cut[2], x2: L.tubeR, fill: cols[3] },
  ] : [];

  const tf = (a) => `translate(${a.cx} 0) scale(${SC} 1) translate(${-a.cx} 0)`;

  return (
    <svg className="logo" width={w} height={h} viewBox={`0 0 ${vbW} ${vbH}`}
      role="img" aria-label="ACCCOM" style={{ maxWidth: "100%", height: "auto", opacity: L ? 1 : 0 }}>
      {L && (
        <defs>
          {L.arc.map((a, j) => (
            <text key={j} id={"g" + j + gid} x={L.pos[a.i]} y="63" style={LG}
              fill="var(--logo-ink)">{letters[a.i]}</text>
          ))}
          <clipPath id={"tube" + gid}>
            <rect x={L.tubeX} y={L.tubeY} width={L.tubeR - L.tubeX} height={L.tubeH} rx={L.tubeH / 2} />
          </clipPath>
          {L.arc.map((a, j) => (
            <clipPath key={j} id={"left" + j + gid}>
              <rect x={a.cx - vbW} y="-20" width={vbW} height={vbH + 40} />
            </clipPath>
          ))}
          {L.arc.map((a, j) => (
            <clipPath key={"r" + j} id={"right" + j + gid}>
              {/* démarre un demi-pixel AVANT le centre : sans ce chevauchement, les deux moitiés
                 du C sont découpées à la coordonnée exacte et Chrome/Windows laisse un fin
                 liseré blanc entre elles. Les deux moitiés étant le même tracé, le recouvrement
                 est invisible. */}
              <rect x={a.cx - 0.75} y="-20" width={vbW} height={vbH + 40} />
            </clipPath>
          ))}
          {/* moitié droite, sous l'axe exact du tube : la partie basse de l'arrière du C,
             reflétée pour fabriquer la partie haute extérieure identique. */}
          {L.arc.map((a, j) => (
            <clipPath key={"rb" + j} id={"rightBot" + j + gid}>
              <rect x={a.cx - 0.75} y={L.tubeY + L.tubeH / 2} width={vbW} height={vbH} />
            </clipPath>
          ))}
          {/* moitié gauche, sous l'AXE EXACT du tube (tubeY + tubeH/2) : la partie basse du C
             avant, celle qui sera reflétée pour fabriquer la partie haute identique. */}
          {L.arc.map((a, j) => (
            <clipPath key={"lb" + j} id={"leftBot" + j + gid}>
              <rect x={a.cx - vbW} y={L.tubeY + L.tubeH / 2} width={vbW} height={vbH} />
            </clipPath>
          ))}
        </defs>
      )}

      {/* refs de mesure (invisibles). ATTENTION : elles restent TOUJOURS à x=0.
         Si on les repositionnait sur le résultat du calcul, une seconde mesure repartirait
         de positions déjà décalées et les lettres s'empileraient (bug iOS). */}
      {letters.map((ch, i) => (
        <text key={"m" + i} ref={(el) => (refs.current[i] = el)} x="0"
          y="63" style={LG} opacity="0">{ch}</text>
      ))}

      {L && (
        <>
          {/* A et M à plat */}
          <text x={L.pos[0]} y="63" style={LG}>{letters[0]}</text>
          <text x={L.pos[5]} y="63" style={LG}>{letters[5]}</text>

          {/* 1) ARRIÈRE : sous le tube.
             - O : moitié droite entière.
             - C : moitié droite BASSE (rightBot), puis son MIROIR vertical autour de l'axe du
               tube pour la haute — comme pour l'avant, la courbe EXTÉRIEURE haute devient le
               reflet exact de la basse : identiques, sans rebord. */}
          {L.arc.map((a, j) =>
            j === 3 ? (
              <g key={"b" + j} transform={tf(a)} clipPath={"url(#right" + j + gid + ")"}>
                <use href={"#g" + j + gid} />
              </g>
            ) : (
              <React.Fragment key={"b" + j}>
                <g transform={tf(a)} clipPath={"url(#rightBot" + j + gid + ")"}>
                  <use href={"#g" + j + gid} />
                </g>
                <g transform={`translate(0 ${2 * (L.tubeY + L.tubeH / 2)}) scale(1 -1)`}>
                  <g transform={tf(a)} clipPath={"url(#rightBot" + j + gid + ")"}>
                    <use href={"#g" + j + gid} />
                  </g>
                </g>
              </React.Fragment>
            )
          )}

          {/* 2) TUBE color-blocking, par-dessus les extrémités arrière */}
          <g clipPath={"url(#tube" + gid + ")"}>
            {seg.map((s, i) => (
              <rect key={i} x={s.x} y={L.tubeY} width={Math.max(0, s.x2 - s.x)} height={L.tubeH} style={{ fill: s.fill }} />
            ))}
          </g>

          {/* 3) AVANT : par-dessus le tube.
             - O (fermé) : lettre entière.
             - C : moitié gauche BASSE (leftBot, sous l'axe exact du tube), puis la moitié HAUTE
               = son MIROIR VERTICAL autour de ce même axe (axeY = tubeY + tubeH/2). Haut et bas
               sont donc rigoureusement identiques, et le reflet est centré pile sur le tube. */}
          {L.arc.map((a, j) =>
            j === 3 ? (
              <g key={"f" + j} transform={tf(a)}><use href={"#g" + j + gid} /></g>
            ) : (
              <React.Fragment key={"f" + j}>
                <g transform={tf(a)} clipPath={"url(#leftBot" + j + gid + ")"}>
                  <use href={"#g" + j + gid} />
                </g>
                <g transform={`translate(0 ${2 * (L.tubeY + L.tubeH / 2)}) scale(1 -1)`}>
                  <g transform={tf(a)} clipPath={"url(#leftBot" + j + gid + ")"}>
                    <use href={"#g" + j + gid} />
                  </g>
                </g>
              </React.Fragment>
            )
          )}
        </>
      )}
    </svg>
  );
}

/* Vue du contrat : apercu, signature electronique et export. */
function ContratVue({ pack, ct, nom, refDevis, dateDevis, onRetour, onSigner, onAnnulerSignature }) {
  const zone = useRef(null);
  const [trace, setTrace] = useState(null);
  const [nomSign, setNomSign] = useState(ct.representant || "");
  const [lu, setLu] = useState(false);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const sig = ct.signature;

  const signer = async () => {
    if (!trace || !nomSign.trim() || !lu || busy) return;
    setBusy(true);
    try {
      const texte = zone.current ? zone.current.innerText : "";
      const empreinte = await empreinteContrat(texte);
      await onSigner({ nomSignataire: nomSign.trim(), dataURL: trace, dateISO: new Date().toISOString(), empreinte });
      setMsg("Contrat signé. Téléchargez-le pour en remettre un exemplaire au client.");
    } catch (e) { console.error(e); setMsg("La signature a échoué : " + (e.message || "erreur inconnue")); }
    finally { setBusy(false); }
  };

  return (
    <div className="wrap">
      <div className="page-head">
        <h1>Contrat — {nom}</h1>
        <p>{sig ? "Contrat signé. Il peut être téléchargé et remis au client." : "Relisez le contrat avec le client, puis faites-le signer ci-dessous."}</p>
      </div>

      <div className="doc-actions">
        <button className="btn btn-primary" onClick={() => {
          const ok = exportDocument({ form: { entreprise: nom } }, sig ? "contrat-signe" : "contrat");
          if (ok) setMsg("Contrat téléchargé — ouvrez-le puis choisissez « Imprimer / Enregistrer en PDF ».");
        }}>Télécharger le contrat (PDF)</button>
        <button className="btn btn-ghost" onClick={() => { try { window.print(); } catch (e) { console.error(e); } }}>Imprimer depuis cette page</button>
        <button className="btn btn-ghost" onClick={onRetour}>Modifier les informations</button>
        {sig && <button className="btn btn-danger" onClick={onAnnulerSignature}>Annuler la signature</button>}
      </div>
      {msg && <div className="export-note">{msg}</div>}

      {!sig && (
        <div className="sig-block">
          <div className="sig-head">
            <b>Signature du client</b>
            <span>Signature électronique simple : le tracé est horodaté et accompagné d'une empreinte numérique du contrat,
            qui rendra détectable toute modification ultérieure du document.</span>
          </div>
          <div className="sig-grid">
            <label className="ct-l">
              <span>Nom du signataire</span>
              <input className="ct-in" value={nomSign} onChange={(e) => setNomSign(e.target.value)} placeholder="Prénom NOM" />
            </label>
            <label className="ct-l">
              <span>Qualité</span>
              <input className="ct-in" value={ct.fonction} disabled />
            </label>
          </div>
          <SignaturePad onChange={setTrace} disabled={busy} />
          <label className={"pack-opt" + (lu ? " on" : "")} style={{ minHeight: 0, marginTop: 12 }}>
            <input type="checkbox" checked={lu} onChange={() => setLu(!lu)} />
            <span><b>Lu et approuvé</b><em>Le signataire déclare avoir pris connaissance du contrat et de ses annexes, et les accepter sans réserve.</em></span>
          </label>
          <div style={{ marginTop: 12 }}>
            <button className="btn btn-primary" disabled={!trace || !nomSign.trim() || !lu || busy} onClick={signer}>
              {busy ? "Signature en cours…" : "Signer le contrat"}
            </button>
          </div>
        </div>
      )}

      <div className="print-zone" ref={zone}>
        <ContratDocument pack={pack} ct={ct} nom={nom} refDevis={refDevis} dateDevis={dateDevis} />
      </div>
    </div>
  );
}

/* ---------------- Audit form ---------------- */
/* Rappel du pack déjà composé. La composition se fait en amont, dans le
   composeur : on se contente ici de rappeler le périmètre retenu. */
function PackRappel({ form, onModifier }) {
  const t = packTier(form.packTier);
  const opts = (form.packOpts || []).map((id) => PACK_OPT_FLAT.find((o) => o.id === id)).filter(Boolean);
  return (
    <Field label="Pack souscrit" hint="il délimite ce qu'ACCCOM réalise : le plan d'action ne proposera rien en dehors de ce périmètre">
      {t ? (
        <div className="bilan-note" style={{ margin: 0 }}>
          Formule <b>{t.nom}</b> ({t.prix} € / mois){form.packEngage ? `, engagement ${form.packEngage} mois` : ""}.
          {opts.length > 0 && <> Options : {opts.map((o) => o.n).join(" · ")}.</>}
          {onModifier && <> <button type="button" className="btn btn-ghost" style={{ marginLeft: 8 }}
            onClick={onModifier}>Modifier le pack</button></>}
        </div>
      ) : (
        <div className="bilan-note" style={{ margin: 0 }}>
          Aucun pack composé pour l'instant : le diagnostic sera généré seul.
          {onModifier && <> <button type="button" className="btn btn-ghost" style={{ marginLeft: 8 }}
            onClick={onModifier}>Composer le pack</button></>}
        </div>
      )}
    </Field>
  );
}

/* Detail chiffre d'une composition de pack, partage par le devis et l'annexe A. */
function DevisDetail({ pack }) {
  const r = packCompute(pack);
  const lignes = [
    { n: `Formule ${r.tier.nom}`, d: r.tier.pitch, p: eurFmt(r.tier.prix) + " / mois" },
    ...r.mSel.map((o) => ({ n: o.n, d: o.d, p: eurFmt(o.p) + " / mois" })),
    ...r.oMens.map((o) => ({ n: o.n + (o.qty ? ` (${r.pages} pages)` : ""),
      d: `${o.d} — étalé sur ${r.n} mois, soit ${eurFmt(r.total(o))} au total`,
      p: eurFmt(r.perMonth(o)) + " / mois" })),
  ];
  return (
    <>
      <div className="devis-tab">
        {lignes.map((l, k) => (
          <div key={k} className="devis-l"><div><b>{l.n}</b><span>{l.d}</span></div><em>{l.p}</em></div>
        ))}
        {r.disc > 0 && (
          <div className="devis-l devis-rem">
            <div><b>Remise engagement {r.n} mois</b><span>appliquée sur l'abonnement et les options mensuelles</span></div>
            <em>−{eurFmt(r.disc)} / mois</em>
          </div>
        )}
        <div className="devis-l devis-tot">
          <div><b>Total mensuel</b><span>pendant {r.n} mois</span></div><em>{eurFmt(r.month)}</em>
        </div>
      </div>
      {r.oOne.length > 0 && (
        <div className="devis-tab">
          {r.oOne.map((o, k) => (
            <div key={k} className="devis-l">
              <div><b>{o.n}{o.qty ? ` (${r.pages} pages)` : ""}</b><span>{o.d}</span></div>
              <em>{eurFmt(r.total(o))}</em>
            </div>
          ))}
          <div className="devis-l devis-tot">
            <div><b>Total des créations</b><span>réglé à la commande</span></div><em>{eurFmt(r.one)}</em>
          </div>
        </div>
      )}
    </>
  );
}
