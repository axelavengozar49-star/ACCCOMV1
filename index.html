<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7D4E66">
<title>ACCCOM Studio — Audit &amp; plan d'action commercial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>html,body{margin:0;padding:0;background:#FAF7F5;}#boot{font-family:sans-serif;color:#7D6D71;text-align:center;padding:80px 20px;}</style>
</head>
<body>
<div id="root"><div id="boot">Chargement d'ACCCOM Studio…</div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useLayoutEffect } = React;

/* ============================================================
   ACCCOM · Studio d'audit & de suivi commercial
   - Accueil : nouvel audit / dossiers clients
   - Formulaire d'audit (analyse interne / externe / objectifs / formule)
   - Formules : accompagnement récurrent (6 mois / 1 an / 2 ans,
     suivi mensuel ou trimestriel : bilan de période -> nouveau plan)
     ou problématique ciblée (plan unique 30 ou 90 jours)
   - Génération IA : SWOT + plan initial, puis bilans de période
     et plans successifs en continuité, jusqu'au bilan de clôture
   - Dossiers clients : arborescence des périodes, documents, audit
   Stockage local (localStorage) + sauvegarde/restauration
   + synchronisation multi-appareils optionnelle (Firebase)
   ============================================================ */

const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@700;800&family=Onest:wght@300;400;500;600;700&display=swap');
`;

const CSS = `
${FONTS}
:root{
  /* Identité chromatique : la palette du tube (plum / coral / ocre) devient
     la palette générale de l'outil. --pine/--pine-soft/--pine-hover/--sage
     sont conservées comme noms internes (repris dans des dizaines de règles)
     mais leurs valeurs sont désormais puisées dans cette palette — le vert
     a disparu des zones de texte, boutons, libellés et bordures. */
  --ink:#241820; --pine:var(--plum); --pine-soft:var(--coral-ink); --pine-hover:var(--plum-deep);
  --sage:#C9A2A8; --mist:#F5EAE7; --mist-2:#FAF3F0;
  --paper:#FAF7F5; --card:#FFFFFF;
  --gold:#C2A06A; --gold-deep:#A9834B; --gold-light:#E7CF9F;
  --plum:#7D4E66; --plum-deep:#5A3348; --coral:#D96A4B; --coral-ink:#A84A32; --ocre:#E0AA52; --ocre-light:#EFD199;
  --line:#E8DAD5; --danger:#A85B4B; --amber:#B98A4E; --blue:#5E7E9B;
  --muted:#6B5A5E; --muted2:#7D6D71; --faint:#96878A; --deep:#3C2A2F; --deep2:#4B393E;
  --topbar:rgba(250,247,245,.85); --input-bg:#FDF9F8; --input-focus:#FFFFFF;
  --shadow:0 10px 30px rgba(40,20,28,.08), 0 2px 6px rgba(40,20,28,.05);
}
/* ---- mode sombre ---- */
.acd.dark{
  /* même logique en mode sombre : fonds et bordures chauds, --pine/--pine-soft
     puisés dans le plum/corail (déjà assez lumineux sur fond sombre pour
     rester lisibles, pas besoin d'une teinte -ink séparée ici). */
  --ink:#F3E7EB; --pine:var(--plum); --pine-soft:var(--coral); --pine-hover:var(--plum-deep);
  --sage:#6B4E54; --mist:#2A1E22; --mist-2:#221A1D;
  --paper:#17110F; --card:#1F1719;
  --line:#3A2A2E; --muted:#C9B3B8; --muted2:#B39EA2; --faint:#8C787B; --deep:#EEDEE2; --deep2:#E0CDD1;
  --gold:#D2B075; --gold-deep:#BC9558; --gold-light:#EEDBB0;
  --plum:#976382; --plum-deep:#7A4E68; --coral:#E5805F; --coral-ink:#E5805F; --ocre:#ECBD68; --ocre-light:#F5DCA0;
  --topbar:rgba(23,17,15,.85); --input-bg:#1C1416; --input-focus:#241A1D;
  --shadow:0 10px 30px rgba(15,5,8,.4), 0 2px 6px rgba(15,5,8,.3);
}
.acd.dark .pill.wait{ background:#332B1D; color:#D8B274;}
.acd.dark .err{ background:#33221E; border-color:#5A3A32; color:#E0947F;}
/* Le document client reste sur fond clair, même en mode sombre :
   il conserve son rendu d'impression et de présentation. */
.docsheet{
  /* le document imprimé reste toujours clair, avec la même palette chaude
     que l'interface — plus de vert nulle part. */
  --ink:#241820; --pine:#7D4E66; --pine-soft:#A84A32; --sage:#C9A2A8;
  --mist:#F5EAE7; --mist-2:#FAF3F0; --line:#E8DAD5;
  --gold:#C2A06A; --gold-deep:#A9834B; --gold-light:#E7CF9F;
  --plum:#7D4E66; --plum-deep:#5A3348; --coral:#D96A4B; --coral-ink:#A84A32; --ocre:#E0AA52; --ocre-light:#EFD199;
  --muted:#6B5A5E; --muted2:#7D6D71; --faint:#96878A; --deep:#3C2A2F; --deep2:#4B393E;
  color:#241820;
}
*{box-sizing:border-box; margin:0; padding:0;}
.acd{ min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:'Onest',sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;}
.acd h1,.acd h2,.acd h3,.serif{ font-family:'Instrument Serif',serif; font-weight:400; letter-spacing:.2px;}
.wrap{max-width:1060px; margin:0 auto; padding:0 28px;}

/* ---- top bar ---- */
.topbar{ position:sticky; top:0; z-index:40; background:var(--topbar);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.topbar-in{ display:flex; align-items:center; justify-content:space-between; height:64px;}
.wordmark{ display:flex; align-items:center; gap:12px; cursor:pointer;}
.wordmark .tag{ font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--sage);}
.am-letter{ font-family:'Syne',sans-serif; font-weight:800; font-size:62px; letter-spacing:0;}

/* ---- logo ACCCOM : image de marque contemporaine.
   Typo Syne ExtraBold — large, géométrique, dessin singulier : le mot
   devient une signature reconnaissable. Le tube (du 1er C au O) est
   traité en color-blocking : une couleur pleine par section entre les
   arceaux — prune à l'entrée, corail au cœur, ocre vers la sortie —
   progression chaude qui monte vers la lumière (le O en blanc franc,
   baigné d'un halo). Les arceaux en encre enserrent et dépassent le
   tube. Palette élargie : vert sapin + prune / corail / ocre. ---- */
.logo{ color:var(--ink); display:inline-block; vertical-align:middle;}
.logo .lg{ font-family:'Syne',sans-serif; font-weight:800; font-size:46px; fill:currentColor; letter-spacing:0;}
.crumb{ font-size:13px; color:var(--pine-soft); display:flex; gap:8px; align-items:center;}
.crumb button{ background:none; border:none; color:var(--pine-soft); cursor:pointer; font:inherit;}
.crumb button:hover{ color:var(--ink); text-decoration:underline;}
.cloud-pill{ border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; padding:6px 12px; font:600 12px/1 "Onest",sans-serif; cursor:pointer; white-space:nowrap;}
.cloud-pill:hover{ color:var(--ink);}
@media (max-width:640px){ .cloud-pill{ font-size:11px; padding:5px 9px;} }
.theme-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--card);
  color:var(--pine); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .18s; flex-shrink:0;}
.theme-btn:hover{ border-color:var(--sage); transform:rotate(15deg);}
.theme-btn:focus-visible{ outline:2px solid var(--pine); outline-offset:2px;}

/* ---- buttons ---- */
.btn{ border:none; cursor:pointer; font-family:'Onest',sans-serif; font-weight:500;
  border-radius:12px; transition:all .18s ease; display:inline-flex; align-items:center; gap:8px;}
.btn:focus-visible{ outline:2px solid var(--pine); outline-offset:2px;}
.btn-primary{ background:var(--pine); color:#fff; padding:13px 26px; font-size:15px;}
.btn-primary:hover{ background:var(--pine-hover); transform:translateY(-1px);}
.btn-primary:disabled{ opacity:.45; cursor:default; transform:none;}
.btn-ghost{ background:transparent; color:var(--pine); padding:11px 20px; font-size:14px; border:1px solid var(--line);}
.btn-ghost:hover{ border-color:var(--sage); background:var(--mist-2);}
.btn-soft{ background:var(--mist); color:var(--pine); padding:10px 18px; font-size:14px;}
.btn-soft:hover{ background:var(--sage); color:#fff;}
.btn-danger{ background:transparent; color:var(--danger); padding:8px 14px; font-size:13px; border:1px solid transparent;}
.btn-danger:hover{ border-color:var(--danger);}

/* ---- home ---- */
.hero{ padding:64px 0 40px; text-align:left;}
.hero .logo{ margin-bottom:26px;}
.hero .eyebrow{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--pine-soft); margin-bottom:14px;}
.hero h1{ font-size:52px; line-height:1.08; max-width:640px;}
.hero h1 em{ font-style:italic; color:var(--pine-soft);}
.hero p{ margin-top:16px; color:var(--muted); max-width:520px;}
.home-cards{ display:grid; grid-template-columns:1fr 1fr; gap:22px; padding:34px 0 80px;}
.home-card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:34px 32px;
  cursor:pointer; transition:all .2s ease; box-shadow:var(--shadow); position:relative; overflow:hidden; text-align:left;}
.home-card:hover{ transform:translateY(-3px); border-color:var(--sage);}
.home-card .num{ font-family:'Instrument Serif',serif; font-size:15px; color:var(--sage); letter-spacing:2px;}
.home-card h2{ font-size:30px; margin:10px 0 8px;}
.home-card p{ color:var(--muted); font-size:14px;}
.home-card .go{ margin-top:22px; color:var(--pine); font-weight:600; font-size:14px;}
.home-card .halo{ position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, var(--mist) 0%, transparent 70%);}
/* Les deux cartes d'accueil reprennent la progression prune → ocre du logo */
.home-card:nth-child(1) .num{ color:var(--plum);}
.home-card:nth-child(1) .halo{ background:radial-gradient(circle, color-mix(in srgb, var(--plum) 20%, transparent) 0%, transparent 70%);}
.home-card:nth-child(2) .num{ color:var(--ocre);}
.home-card:nth-child(2) .halo{ background:radial-gradient(circle, color-mix(in srgb, var(--ocre) 24%, transparent) 0%, transparent 70%);}
.cadence{ display:flex; gap:14px; align-items:center; padding:0 0 70px; color:var(--pine-soft); font-size:13px;}
.cadence .dot{ width:9px; height:9px; border-radius:50%; background:var(--sage);}
.cadence .dot.dot-a{ background:var(--plum);}
.cadence .dot.dot-b{ background:var(--ocre);}
.cadence .rail{ flex:1; height:2px; background:linear-gradient(90deg, var(--plum), var(--coral), var(--ocre)); opacity:.4; border-radius:2px;}
.cadence b{ font-family:'Instrument Serif',serif; font-size:17px; font-weight:400; color:var(--ink);}

/* ---- form ---- */
.page-head{ padding:44px 0 10px;}
.page-head h1{ font-size:38px;}
.page-head p{ color:var(--muted); margin-top:8px; max-width:640px;}
.steps{ display:flex; gap:6px; margin:26px 0 8px; flex-wrap:wrap;}
.step{ padding:8px 16px; border-radius:999px; font-size:13px; cursor:pointer; border:1px solid var(--line);
  background:transparent; color:var(--muted); font-family:'Onest',sans-serif;}
.step.active{ background:var(--pine); color:#fff; border-color:var(--pine);}
.step.done{ border-color:var(--sage); color:var(--pine);}
.fcard{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px; margin:18px 0; box-shadow:var(--shadow);}
.fcard h3{ font-size:23px; margin-bottom:4px;}
.fcard .sub{ font-size:13px; color:var(--muted2); margin-bottom:20px;}
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{ font-size:12.5px; font-weight:600; color:var(--pine); letter-spacing:.3px;}
.field .hint{ font-size:11.5px; color:var(--faint); font-weight:400;}
.field input,.field textarea,.field select{ font-family:'Onest',sans-serif; font-size:14px; color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:var(--input-bg); transition:border .15s;}
.field textarea{ min-height:88px; resize:vertical; line-height:1.5;}
.field input:focus,.field textarea:focus,.field select:focus{ outline:none; border-color:var(--sage); background:var(--input-focus);}
.duree{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
.duree button{ color:var(--ink); border:1px solid var(--line); background:var(--input-bg); border-radius:14px; padding:16px; cursor:pointer;
  font-family:'Onest',sans-serif; text-align:left; transition:all .15s;}
.duree button.sel{ border-color:var(--pine); background:var(--mist); box-shadow:inset 0 0 0 1px var(--pine);}
.duree .d-num{ font-family:'Instrument Serif',serif; font-size:26px; color:var(--pine);}
.duree .d-lab{ font-size:12px; color:var(--muted2); margin-top:2px;}
/* Les 3 formules reprennent la progression prune → corail → ocre du tube du logo */
.duree button.sel.d-0{ border-color:var(--plum); background:color-mix(in srgb, var(--plum) 12%, var(--input-bg)); box-shadow:inset 0 0 0 1px var(--plum);}
.duree button.sel.d-0 .d-num{ color:var(--plum);}
.duree button.sel.d-1{ border-color:var(--coral); background:color-mix(in srgb, var(--coral) 12%, var(--input-bg)); box-shadow:inset 0 0 0 1px var(--coral);}
.duree button.sel.d-1 .d-num{ color:var(--coral);}
.duree button.sel.d-2{ border-color:var(--ocre); background:color-mix(in srgb, var(--ocre) 14%, var(--input-bg)); box-shadow:inset 0 0 0 1px var(--ocre);}
.duree button.sel.d-2 .d-num{ color:var(--ocre);}
.form-nav{ display:flex; justify-content:space-between; padding:8px 0 70px;}

/* ---- clients ---- */
.client-row{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 24px;
  display:flex; align-items:center; gap:18px; margin-bottom:12px; cursor:pointer; transition:all .18s; box-shadow:var(--shadow);}
.client-row:hover{ border-color:var(--sage); transform:translateX(3px);}
.avatar{ width:46px; height:46px; border-radius:14px; background:var(--mist); color:var(--pine);
  display:flex; align-items:center; justify-content:center; font-family:'Instrument Serif',serif; font-size:20px; flex-shrink:0;}
.client-row .meta{ flex:1;}
.client-row .meta b{ font-size:16px;}
.client-row .meta span{ display:block; font-size:12.5px; color:var(--muted2); margin-top:2px;}
.pill{ font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:5px 12px; border-radius:999px;}
.pill.ok{ background:var(--mist); color:var(--pine);}
.pill.wait{ background:#F5EFE3; color:var(--amber);}
.pill.fut{ background:var(--mist-2); color:var(--faint); border:1px dashed var(--line);}
.pill.cur{ background:color-mix(in srgb, var(--coral) 14%, var(--card)); color:var(--coral-ink);}

/* ---- suivi de l'accompagnement (arborescence des périodes) ---- */
.suivi-head{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 22px; margin:18px 0 16px; box-shadow:var(--shadow);}
.suivi-head .big{ font-size:17px; font-weight:700;}
.suivi-head .sub2{ color:var(--muted2); font-size:13.5px; margin-top:3px;}
.progressbar{ height:8px; border-radius:99px; background:var(--mist); margin-top:14px; overflow:hidden;}
.progressbar i{ display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--plum),var(--coral),var(--ocre)); transition:width .4s;}
.tl{ border-left:2px solid var(--line); margin:4px 0 20px 8px; padding:4px 0;}
.tl-row{ display:flex; align-items:center; gap:12px; padding:9px 4px 9px 0; flex-wrap:wrap;}
.tl-dot{ width:12px; height:12px; border-radius:50%; background:var(--paper);
  border:2px solid var(--sage); margin-left:-8px; flex:none;}
.tl-row.done .tl-dot{ background:var(--plum); border-color:var(--plum);}
.tl-row.cur .tl-dot{ background:var(--coral); border-color:var(--coral);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--coral) 20%, transparent);}
.tl-meta{ flex:1; min-width:180px;}
.tl-meta b{ font-size:14.5px;}
.tl-meta span{ display:block; font-size:12.5px; color:var(--muted2); margin-top:1px;}
.tl-row .btn{ padding:7px 14px; font-size:13px;}
.tl-row.sel-row{ background:var(--mist-2); border-radius:0 12px 12px 0;}
.tl-more{ font-size:13px; color:var(--faint); padding:8px 0 8px 16px; font-style:italic;}
.bilan-note{ font-size:13px; color:var(--muted2); background:var(--mist-2);
  border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:10px 0 16px;}
.obs-int{ margin:14px 0 40px; border:1px dashed var(--line); border-radius:14px; background:var(--mist-2);}
.obs-int > .d-head{ display:flex; justify-content:space-between; align-items:center;
  padding:12px 16px; cursor:pointer; font-size:13.5px; color:var(--muted);}
.obs-int dl{ padding:0 16px 14px;}
.reco{ display:grid; gap:8px; margin:14px 0 22px;}
.reco .axe{ align-items:flex-start;}
.probleme-block{ background:color-mix(in srgb, var(--coral) 8%, #fff); border:1px solid color-mix(in srgb, var(--coral) 30%, var(--line));
  border-left:4px solid var(--coral); border-radius:10px; padding:14px 18px; margin:0 0 22px;}
.probleme-block h4{ font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--coral-ink); margin-bottom:5px;}
.probleme-block p{ font-size:14px; color:var(--deep2);}
.empty{ text-align:center; padding:70px 20px; color:var(--muted2);}
.empty .big{ font-family:'Instrument Serif',serif; font-size:26px; color:var(--ink); margin-bottom:8px;}

/* ---- client detail ---- */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:24px 0;}
.tab{ background:none; border:none; padding:12px 18px; font-family:'Onest',sans-serif; font-size:14px;
  color:var(--muted2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab.active{ color:var(--ink); border-color:var(--pine); font-weight:600;}
.doc-row{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 22px; margin-bottom:10px;}
.doc-row .d-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.doc-row .d-head b{ font-size:15px;}
.doc-row .d-head span{ font-size:12px; color:var(--faint);}
.doc-row .d-body{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:14px; white-space:pre-wrap; color:var(--deep);}
.kv{ display:grid; grid-template-columns:220px 1fr; gap:8px 18px; font-size:14px;}
.kv dt{ color:var(--muted2); font-size:12.5px; font-weight:600; padding-top:2px;}
.kv dd{ white-space:pre-wrap;}

/* ---- generation / document ---- */
.gen-overlay{ text-align:center; padding:90px 20px;}
.gen-overlay .spin{ width:52px; height:52px; border-radius:50%; border:3px solid var(--mist);
  border-top-color:var(--pine); margin:0 auto 24px; animation:spin 1s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg);} }
.gen-overlay h2{ font-size:30px;}
.gen-overlay p{ color:var(--muted2); margin-top:8px;}

.docsheet{ background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
  padding:54px 58px; margin:20px 0 40px;}
.doc-brand{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--ink); padding-bottom:18px;}
.doc-brand .ref{ text-align:right; font-size:11.5px; color:var(--muted2); letter-spacing:1px; text-transform:uppercase; line-height:1.7;}
.doc-title{ padding:34px 0 8px;}
.doc-title .eyebrow{ font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--pine-soft);}
.doc-title h1{ font-size:40px; line-height:1.1; margin-top:8px;}
.doc-title h1 em{ font-style:italic; color:var(--pine-soft);}
.synth{ background:var(--mist-2); border-left:3px solid var(--sage); padding:18px 22px; border-radius:0 12px 12px 0;
  font-size:14.5px; color:var(--deep); margin:18px 0 8px;}
.sec-title{ display:flex; align-items:center; gap:14px; margin:42px 0 18px;}
.sec-title h2{ font-size:26px; white-space:nowrap;}
.sec-title .rule{ flex:1; height:1px; background:var(--line);}
.sec-title .lab{ font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--sage);}

.externe{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.ext-block{ border:1px solid #E8DAD5; border-radius:14px; padding:18px 20px; background:#FDFAF9;}

/* ---------------- stockage local (autonome) ----------------
   Les données restent dans le navigateur (localStorage).
   Sauvegarde/restauration via les réglages pour changer de poste. */
const appStorage = {
  async get(k) { const v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; },
  async set(k, v) { localStorage.setItem(k, v); return { key: k, value: v }; },
  async delete(k) { localStorage.removeItem(k); return { key: k, deleted: true }; },
};

/* ---------------- configuration (clé API, modèle, recherche) ---------------- */
const CFG = {
  provider: () => localStorage.getItem("acccom:provider") || "anthropic",
  key: () => localStorage.getItem("acccom:apikey") || "",
  gkey: () => localStorage.getItem("acccom:gkey") || "",
  model: () => localStorage.getItem("acccom:model") || "claude-haiku-4-5",
  search: () => localStorage.getItem("acccom:search") === "1",
  set(k, v) { localStorage.setItem("acccom:" + k, v); },
  activeKey() { return this.provider() === "gemini" ? this.gkey() : this.key(); },
};

/* ---------------- storage helpers ---------------- */
const IDX_KEY = "acdcom:index";

async function loadIndex() {
  try {
    const r = await appStorage.get(IDX_KEY);
    return r ? JSON.parse(r.value) : [];
  } catch { return []; }
}
async function saveIndex(idx) {
  try { await appStorage.set(IDX_KEY, JSON.stringify(idx)); } catch (e) { console.error(e); }
}
async function loadClient(id) {
  try {
    const r = await appStorage.get("acdcom:client:" + id);
    return r ? JSON.parse(r.value) : null;
  } catch { return null; }
}
async function saveClient(id, data) {
  try { await appStorage.set("acdcom:client:" + id, JSON.stringify(data)); return true; }
  catch (e) { console.error(e); return false; }
}
async function deleteClient(id) {
  try { await appStorage.delete("acdcom:client:" + id); } catch (e) { console.error(e); }
}

/* ---------------- synchronisation multi-appareils (Firebase) ----------------
   Optionnelle : l'utilisateur colle la configuration de son projet Firebase
   dans les réglages, se connecte par e-mail/mot de passe, et les dossiers
   sont répliqués dans Firestore (users/{uid}/clients). Le localStorage reste
   la source de travail ; la synchro fusionne (le plus récent gagne) et gère
   les suppressions via des tombstones (users/{uid}/meta/sync). */
const CLOUD = {
  app: null, auth: null, db: null,
  cfg() { try { return JSON.parse(localStorage.getItem("acccom:fb") || "null"); } catch { return null; } },
  setCfg(o) { localStorage.setItem("acccom:fb", JSON.stringify(o)); },
  clearCfg() { localStorage.removeItem("acccom:fb"); },
  configured() { const c = this.cfg(); return !!(c && c.apiKey && c.projectId); },
  init() {
    if (this.app) return true;
    if (!window.firebase || !this.configured()) return false;
    try {
      this.app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(this.cfg());
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      return true;
    } catch (e) { console.error("Firebase init:", e); this.app = null; return false; }
  },
  user() { return this.auth ? this.auth.currentUser : null; },
  ready() { return !!(this.db && this.user()); },
  col() { return this.db.collection("users").doc(this.user().uid).collection("clients"); },
  metaRef() { return this.db.collection("users").doc(this.user().uid).collection("meta").doc("sync"); },
  async push(id, data) {
    if (!this.ready()) return;
    await this.col().doc(id).set({
      data: JSON.stringify(data),
      updatedAt: data.updatedAt || data.createdAt || new Date().toISOString(),
    });
  },
  async remove(id) {
    if (!this.ready()) return;
    await this.col().doc(id).delete();
    await this.metaRef().set({ deleted: { [id]: new Date().toISOString() } }, { merge: true });
  },
  async pullAll() {
    const snap = await this.col().get();
    const out = new Map();
    snap.forEach((d) => {
      try { out.set(d.id, JSON.parse(d.data().data)); } catch (e) { console.error(e); }
    });
    return out;
  },
  async tombstones() {
    try {
      const d = await this.metaRef().get();
      return (d.exists && d.data().deleted) || {};
    } catch { return {}; }
  },
};

const ts = (c) => (c && (Date.parse(c.updatedAt || c.createdAt || "") || 0)) || 0;

/* Accepte le bloc tel que fourni par la console Firebase (clés non citées). */
function parseFbConfig(text) {
  const m = String(text).match(/\{[\s\S]*\}/);
  if (!m) throw new Error("Configuration introuvable — collez le bloc complet { apiKey: … }");
  const s = m[0]
    .replace(/\/\/[^\n]*/g, "")
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
    .replace(/'/g, '"')
    .replace(/,\s*\}/g, "}");
  let cfg;
  try { cfg = JSON.parse(s); } catch { throw new Error("Configuration illisible — recopiez le bloc depuis la console Firebase"); }
  if (!cfg.apiKey || !cfg.projectId) throw new Error("Configuration incomplète : apiKey ou projectId manquant");
  return cfg;
}

function indexEntry(id, rest) {
  return {
    id, nom: rest.form.entreprise, secteur: rest.form.secteur, duree: rest.form.duree,
    formule: rest.form.formule || null, dureeAccomp: rest.form.dureeAccomp, cadence: rest.form.cadence,
    nbPeriodes: nbPlanifiees(rest), totalPeriodes: rest.form.formule === "accompagnement" ? suiviMeta(rest.form).total : null,
    cloture: !!rest.cloture,
    createdAt: rest.createdAt, updatedAt: rest.updatedAt, hasResult: !!rest.result,
  };
}

/* Fusion complète local <-> Firestore. Le document le plus récent gagne ;
   une suppression plus récente que la dernière modification locale s'applique. */
async function fullSync() {
  if (!CLOUD.ready()) return null;
  const [remote, tomb] = await Promise.all([CLOUD.pullAll(), CLOUD.tombstones()]);
  const idx = await loadIndex();
  const localIds = new Set(idx.map((e) => e.id));

  // suppressions distantes -> local
  for (const [id, when] of Object.entries(tomb)) {
    if (!localIds.has(id) || remote.has(id)) continue;
    const local = await loadClient(id);
    if (local && (Date.parse(when) || 0) >= ts(local)) {
      await deleteClient(id); localIds.delete(id);
    }
  }
  // distant -> local (nouveau ou plus récent)
  for (const [id, rdata] of remote) {
    const local = await loadClient(id);
    if (!local || ts(rdata) > ts(local)) await saveClient(id, rdata);
    localIds.add(id);
  }
  // local -> distant (absent ou plus récent, hors suppression plus fraîche)
  for (const id of [...localIds]) {
    const local = await loadClient(id);
    if (!local) { localIds.delete(id); continue; }
    const delT = Date.parse(tomb[id] || "") || 0;
    if (delT >= ts(local) && !remote.has(id)) continue;
    if (!remote.has(id) || ts(local) > ts(remote.get(id))) {
      try { await CLOUD.push(id, local); } catch (e) { console.error(e); }
    }
  }
  // reconstruire l'index depuis les dossiers présents en local
  const nextIdx = [];
  for (const id of localIds) {
    const c = await loadClient(id);
    if (c && c.form) nextIdx.push(indexEntry(id, c));
  }
  await saveIndex(nextIdx);
  return nextIdx;
}

/* ---------------- formules & suivi ----------------
   - "accompagnement" : abonnement dans la durée (6 mois / 1 an / 2 ans),
     rythmé par des périodes de 30 j (suivi mensuel) ou 90 j (suivi trimestriel).
     Chaque période : bilan des résultats -> nouveau plan pour la période suivante.
   - "cible" : intervention ponctuelle sur une problématique précise,
     plan unique de 30 ou 90 jours selon la complexité.
   - anciens dossiers sans formule : plan unique 30/60/90 (comportement historique). */
const cadLabel = (cad) => (String(cad) === "30" ? "mensuel" : "trimestriel");
const accompLabel = (m) => (String(m) === "6" ? "6 mois" : String(m) === "12" ? "1 an" : "2 ans");

function suiviMeta(form) {
  const cad = parseInt(form.cadence || form.duree || "90", 10) === 30 ? 30 : 90;
  const months = [6, 12, 24].includes(parseInt(form.dureeAccomp, 10)) ? parseInt(form.dureeAccomp, 10) : 12;
  const total = cad === 30 ? months : Math.max(1, Math.round(months / 3));
  return { cad, months, total };
}

/* Répare un JSON tronqué : ferme les chaînes et les crochets restés ouverts. */
function parseJsonLoose(text) {
  let s = text.replace(/```json|```/g, "").trim();
  const start = s.indexOf("{");
  if (start === -1) throw new Error("Aucun JSON dans la réponse");
  s = s.slice(start);
  const end = s.lastIndexOf("}");
  // 1er essai : parse direct sur la portion la plus large
  if (end !== -1) {
    try { return JSON.parse(s.slice(0, end + 1)); } catch (_) { /* on répare */ }
  }
  // Réparation : équilibrage des chaînes et des crochets
  const stack = [];
  let inStr = false, esc = false, lastSafe = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === "\\") esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === "{" ) stack.push("}");
    else if (c === "[") stack.push("]");
    else if (c === "}" || c === "]") { stack.pop(); lastSafe = i; }
    else if (c === ",") lastSafe = i;
  }
  let repaired = s;
  if (inStr) repaired += '"';
  // retire une éventuelle virgule/valeur pendante puis referme tout
  repaired = repaired.replace(/,\s*("[^"]*)?$/s, (m) => (inStr ? m : ""));
  for (let i = stack.length - 1; i >= 0; i--) repaired += stack[i];
  try { return JSON.parse(repaired); } catch (_) {
    // dernier recours : couper au dernier point sûr et refermer
    let cut = s.slice(0, lastSafe + 1).replace(/,\s*$/, "");
    const st2 = [];
    let str2 = false, esc2 = false;
    for (const c of cut) {
      if (str2) { if (esc2) esc2 = false; else if (c === "\\") esc2 = true; else if (c === '"') str2 = false; continue; }
      if (c === '"') str2 = true;
      else if (c === "{") st2.push("}");
      else if (c === "[") st2.push("]");
      else if (c === "}" || c === "]") st2.pop();
    }
    for (let i = st2.length - 1; i >= 0; i--) cut += st2[i];
    return JSON.parse(cut);
  }
}

async function callAnthropic(prompt, { search = false, maxTokens = 4000 } = {}) {
  const body = {
    model: CFG.model(),
    max_tokens: maxTokens,
    messages: [{ role: "user", content: prompt }],
  };
  if (search) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": CFG.key(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (data.error) {
    if (data.error.type === "authentication_error") throw new Error("NO_KEY");
    throw new Error(data.error.message || "Erreur API");
  }
  return (data.content || []).map((i) => (i.type === "text" ? i.text : "")).filter(Boolean).join("\n");
}

async function callGemini(prompt, { maxTokens = 4000 } = {}) {
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
    + encodeURIComponent(CFG.gkey());
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: maxTokens, temperature: 0.6 },
    }),
  });
  const data = await response.json();
  if (data.error) {
    if (data.error.code === 400 || data.error.code === 401 || data.error.code === 403) throw new Error("NO_KEY");
    if (data.error.code === 429) throw new Error("Quota gratuit Gemini atteint pour l'instant — patientez une minute puis réessayez.");
    throw new Error(data.error.message || "Erreur API Gemini");
  }
  const cand = data.candidates && data.candidates[0];
  return ((cand && cand.content && cand.content.parts) || []).map((p) => p.text || "").join("\n");
}

async function callClaude(prompt, opts = {}) {
  if (!CFG.activeKey()) throw new Error("NO_KEY");
  return CFG.provider() === "gemini" ? callGemini(prompt, opts) : callAnthropic(prompt, opts);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* Appel + parse, avec tentatives automatiques espacées (les erreurs serveur
   sont souvent passagères : on attend avant de réessayer). */
async function callAndParse(prompt, opts, tries = 3) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      return parseJsonLoose(await callClaude(prompt, opts));
    } catch (e) {
      lastErr = e;
      console.warn(`Tentative ${i + 1}/${tries} échouée :`, e.message);
      if (i < tries - 1) await wait(1800 * (i + 1));
    }
  }
  throw lastErr;
}

— Effectif : ${form.effectif} | CA : ${form.ca} | Ancienneté : ${form.anciennete} | Zone géographique : ${form.zone}
— Offre : ${form.offre}
— Clients cibles : ${form.cibles}
— Canaux de vente actuels : ${form.canaux}
— Forces perçues (interne) : ${form.forcesPercues}

/* Cadre de la mission, injecté dans les prompts selon la formule choisie. */
function missionBlock(form) {
  if (form.formule === "cible" && form.problematique) {
    return `\nCADRE DE LA MISSION : intervention ponctuelle « Problématique ciblée » sur ${form.duree} jours. L'accompagnement porte EXCLUSIVEMENT sur la problématique suivante, exprimée par le client : « ${form.problematique} ». L'intégralité du plan d'action doit converger vers la résolution de cette problématique — n'y ajoute aucune action hors sujet, même pertinente par ailleurs.\n`;
  }
  if (form.formule === "accompagnement") {
    const { cad, months } = suiviMeta(form);
    return `\nCADRE DE LA MISSION : accompagnement de ${accompLabel(months)} avec un suivi ${cadLabel(cad)} — un bilan est réalisé tous les ${cad} jours, puis un nouveau plan est établi pour la période suivante. Tu rédiges ici le plan de la PREMIÈRE période (${cad} jours) : pose des fondations solides et des actions réalistes à l'échelle de la période, sans chercher à tout traiter d'un coup — l'accompagnement se poursuivra période après période.\n`;
  }
  return "";
}

const ROLE = `Tu es consultant senior en développement commercial au sein du cabinet ACCCOM. Tu rédiges des livrables destinés à être présentés directement au client final : ton professionnel, précis, concret, orienté résultats, en français.`;

/* Étape 1 — analyse externe + SWOT. D'abord avec recherche web ;
   si elle est indisponible (erreur serveur), repli sur les connaissances du modèle. */
async function generateExterneSwot(form) {
  const corps = (avecRecherche) => `${ROLE}

ÉTAPE 1 : ANALYSE EXTERNE ET SWOT.
Le client n'a pas fourni d'analyse externe. C'est à toi de la produire. ${avecRecherche
    ? `Utilise la recherche web pour étudier le marché du secteur "${form.secteur}" dans la zone "${form.zone || "France"}"`
    : `À partir de ta connaissance du secteur "${form.secteur}" en France (zone : "${form.zone || "France"}"), analyse`} : dynamique et tendances du marché, environnement concurrentiel type, évolutions réglementaires récentes ou à venir, saisonnalité. Reste factuel. Rédige entièrement avec tes propres mots, sans citer ni recopier de passages de sources.

Puis construis un SWOT précis et argumenté :
- Forces et Faiblesses : à partir des données internes de l'audit ci-dessous.
- Opportunités et Menaces : à partir de ton analyse externe.
Chaque élément doit être SPÉCIFIQUE à cette entreprise (jamais générique), avec un titre court et un détail d'une ou deux phrases. 3 à 5 éléments par quadrant.

DONNÉES D'AUDIT :
${dataBlock(form)}

Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{
  "externe": {
    "marche": "3-4 phrases sur la dynamique et les tendances du marché",
    "concurrence": "3-4 phrases sur l'environnement concurrentiel",
    "reglementation": "2-3 phrases sur le cadre réglementaire et ses évolutions",
    "saisonnalite": "1-2 phrases sur la saisonnalité de l'activité"
  },
  "swot": {
    "forces": [{"titre":"string","detail":"string"}],
    "faiblesses": [{"titre":"string","detail":"string"}],
    "opportunites": [{"titre":"string","detail":"string"}],
    "menaces": [{"titre":"string","detail":"string"}]
  }
}`;
  if (CFG.search() && CFG.provider() === "anthropic") {
    try {
      return await callAndParse(corps(true), { search: true, maxTokens: 4000 }, 2);
    } catch (e) {
      if (e.message === "NO_KEY") throw e;
      console.warn("Recherche web indisponible, repli sur les connaissances du modèle :", e.message);
    }
  }
  return callAndParse(corps(false), { search: false, maxTokens: 4000 }, 3);
}

/* Étape 2 — synthèse exécutive + axes stratégiques (appel court) */
async function generateSyntheseAxes(form, externe, swot) {
  const prompt = `${ROLE}

Le diagnostic est établi (analyse externe et SWOT ci-dessous). Produis :
1. Une synthèse exécutive du diagnostic (4-5 phrases maximum).
2. 3 ou 4 axes stratégiques prioritaires issus du croisement du SWOT et des objectifs du client.

DONNÉES D'AUDIT :
${dataBlock(form)}

ANALYSE EXTERNE : ${JSON.stringify(externe)}
SWOT : ${JSON.stringify(swot)}
${missionBlock(form)}
Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{ "synthese": "string", "axes": ["string"] }`;
  return callAndParse(prompt, { search: false, maxTokens: 1500 }, 3);
}

/* Étape 3 — le plan, généré phase par phase (appels courts et fiables) */
const PHASE_DEFS = [
  { periode: "0–30 jours", role: "les FONDATIONS : structurer, outiller, préparer le terrain" },
  { periode: "31–60 jours", role: "le DÉPLOIEMENT : exécuter, prospecter, mesurer les premiers résultats" },
  { periode: "61–90 jours", role: "l'ACCÉLÉRATION : optimiser ce qui fonctionne, pérenniser, ancrer les routines" },
];

async function generatePhase(form, externe, swot, axes, idx, total, phasesPrecedentes) {
  const def = PHASE_DEFS[idx];
  const autres = PHASE_DEFS.slice(0, total).filter((_, j) => j !== idx)
    .map((p) => `${p.periode} (${p.role})`).join(" ; ");
  const rappel = total > 1
    ? `\nIMPORTANT — CLOISONNEMENT : les autres phases du plan sont rédigées séparément (${autres}). Ne planifie ICI que ce qui relève strictement du rôle de ta phase. Une action de fondation ne doit pas apparaître en phase de déploiement, et inversement.\n`
    : "";
  const prompt = `${ROLE}

Tu rédiges la phase ${idx + 1} sur ${total} du plan d'action commercial : ${def.periode}, dont le rôle est ${def.role}.
Produis : un objectif de phase (une phrase), 4 à 6 actions concrètes (titre, description opérationnelle précise indiquant COMMENT faire, responsable suggéré, KPI mesurable avec une cible chiffrée réaliste), et 2 à 4 livrables de fin de phase. Chaque action doit être reliée à un constat du SWOT, à un axe stratégique ou à un objectif exprimé.

DONNÉES D'AUDIT :
${dataBlock(form)}

ANALYSE EXTERNE : ${JSON.stringify(externe)}
SWOT : ${JSON.stringify(swot)}
${axes && axes.length ? "AXES STRATÉGIQUES : " + JSON.stringify(axes) : ""}
${missionBlock(form)}${rappel}
Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{
  "periode": "${def.periode}",
  "objectif": "string",
  "actions": [{"titre":"string","description":"string","responsable":"string","kpi":"string"}],
  "livrables": ["string"]
}`;
  return callAndParse(prompt, { search: false, maxTokens: 2500 }, 3);
}

/* Orchestration : le SWOT d'abord, puis TOUT le reste en parallèle
   (synthèse, axes et chaque phase du plan partent en même temps). */
async function generateAnalysis(form, onStage) {
  const nb = form.duree === "30" ? 1 : form.duree === "60" ? 2 : 3;

  onStage && onStage("Étape 1 / 2 — Analyse externe du marché et construction du SWOT…");
  const step1 = await generateExterneSwot(form);
  if (!step1.swot) throw new Error("SWOT manquant dans la réponse");
  const externe = step1.externe || {};

  onStage && onStage("Étape 2 / 2 — Synthèse, axes stratégiques et phases du plan (en parallèle)…");
  // La synthèse/axes et chaque phase partent simultanément : le temps total
  // est celui du plus long appel, pas la somme de tous.
  const axesQuick = null; // les phases reçoivent les axes via le SWOT et les objectifs
  const [step2, ...phases] = await Promise.all([
    generateSyntheseAxes(form, externe, step1.swot),
    ...Array.from({ length: nb }, (_, i) =>
      generatePhase(form, externe, step1.swot, axesQuick, i, nb, [])
    ),
  ]);

  return {
    externe: step1.externe || null,
    swot: step1.swot,
    synthese: step2.synthese || "",
    axes: step2.axes || [],
    plan: phases,
  };
}

/* ============================================================
   SUIVI D'ACCOMPAGNEMENT — bilan de période & plan suivant
   Au terme de chaque période (30 ou 90 j), le consultant remplit
   le bilan des résultats observés ; l'IA en tire une évaluation
   puis un plan pour la période suivante, en continuité.
   ============================================================ */

function bilanBlock(bilan) {
  return Object.entries(BILAN_LABELS)
    .map(([k, [lab]]) => `— ${lab} : ${bilan[k] || "(non renseigné)"}`)
    .join("\n");
}

function planResume(plan) {
  return (plan || [])
    .map((ph) => `${ph.periode} — ${ph.objectif}\n` +
      (ph.actions || []).map((a) => `   • ${a.titre} (KPI : ${a.kpi})`).join("\n"))
    .join("\n");
}

function suiviContexte(form, numPeriode) {
  const { cad, months } = suiviMeta(form);
  return `CONTEXTE : ${form.entreprise} est accompagnée par ACCCOM dans le cadre d'un accompagnement de ${accompLabel(months)} avec suivi ${cadLabel(cad)}. La période ${numPeriode} (${cad} jours) vient de s'achever ; le consultant a relevé les résultats ci-dessous lors du bilan.`;
}

/* Étape A — évaluation de la période écoulée (+ axes pour la suite, ou bilan de clôture) */
async function generateBilanSynthese(form, prevPlan, bilan, numPeriode, cloture) {
  const prompt = `${ROLE}

${suiviContexte(form, numPeriode)}${cloture ? " C'était la DERNIÈRE période de l'accompagnement : tu rédiges le bilan de clôture." : ""}

DONNÉES D'AUDIT INITIAL :
${dataBlock(form)}

PLAN D'ACTION DE LA PÉRIODE ÉCOULÉE (période ${numPeriode}) :
${planResume(prevPlan)}

BILAN OBSERVÉ PAR LE CONSULTANT :
${bilanBlock(bilan)}

Produis :
1. Une synthèse d'évaluation de la période (4-5 phrases : résultats face aux objectifs, dynamique, appréciation d'ensemble honnête — ni complaisante ni alarmiste).
2. Les réussites de la période (2 à 4, spécifiques et argumentées, titre + détail).
3. Les points de vigilance (2 à 4, titre + détail).
${cloture
    ? `4. Un bilan global de l'ensemble de l'accompagnement (4-5 phrases, avec le recul de toutes les périodes).
5. 3 à 5 recommandations concrètes pour que l'entreprise pérennise seule les acquis après l'accompagnement.`
    : `4. 3 ou 4 axes de travail prioritaires pour la période suivante, en continuité directe avec le bilan : consolider ce qui produit des résultats, corriger ou reprogrammer ce qui n'a pas abouti, intégrer les évolutions du contexte et les priorités exprimées par le client.`}

Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{
  "synthese": "string",
  "reussites": [{"titre":"string","detail":"string"}],
  "vigilances": [{"titre":"string","detail":"string"}]${cloture
    ? `,
  "bilanGlobal": "string",
  "recommandations": ["string"]`
    : `,
  "axes": ["string"]`}
}`;
  return callAndParse(prompt, { search: false, maxTokens: 2500 }, 3);
}

/* Étape B — phases du plan de la période suivante */
const SUIVI_PHASE_DEFS = [
  { periode: "0–30 jours", role: "la RELANCE : ajuster ce qui doit l'être, reprogrammer les actions inabouties, remettre en mouvement dès le début de période" },
  { periode: "31–60 jours", role: "la MONTÉE EN PUISSANCE : déployer et intensifier ce qui produit des résultats" },
  { periode: "61–90 jours", role: "la CONSOLIDATION : ancrer les acquis, mesurer, préparer la période suivante" },
];
const SUIVI_PHASE_MOIS = [
  { periode: "0–30 jours", role: "un mois d'exécution complet : corriger ce qui doit l'être, prolonger ce qui fonctionne et produire des résultats mesurables sous 30 jours" },
];

async function generatePhaseSuivi(form, synth, prevPlan, bilan, idx, total, numSuivant) {
  const defs = total === 1 ? SUIVI_PHASE_MOIS : SUIVI_PHASE_DEFS;
  const def = defs[idx];
  const autres = defs.slice(0, total).filter((_, j) => j !== idx)
    .map((p) => `${p.periode} (${p.role})`).join(" ; ");
  const rappel = total > 1
    ? `\nIMPORTANT — CLOISONNEMENT : les autres phases du plan sont rédigées séparément (${autres}). Ne planifie ICI que ce qui relève strictement du rôle de ta phase.\n`
    : "";
  const prompt = `${ROLE}

${suiviContexte(form, numSuivant - 1)} Tu rédiges maintenant la phase ${idx + 1} sur ${total} du plan d'action de la PÉRIODE ${numSuivant} : ${def.periode}, dont le rôle est ${def.role}.

RÈGLES DE CONTINUITÉ (essentielles) :
- Ne recopie pas à l'identique des actions déjà réalisées ; prolonge-les, intensifie-les ou passe à l'étape suivante.
- Reprogramme explicitement, en l'adaptant aux causes de l'échec, toute action importante non réalisée pendant la période écoulée.
- Appuie-toi sur les réussites et corrige les points de vigilance identifiés dans le bilan.
- Chaque action doit être reliée à un constat du bilan, à un axe retenu ou à une priorité exprimée par le client.

DONNÉES D'AUDIT INITIAL :
${dataBlock(form)}

PLAN DE LA PÉRIODE ÉCOULÉE :
${planResume(prevPlan)}

BILAN OBSERVÉ :
${bilanBlock(bilan)}

ÉVALUATION DE LA PÉRIODE : ${JSON.stringify({ synthese: synth.synthese, reussites: synth.reussites, vigilances: synth.vigilances })}
AXES RETENUS POUR LA PÉRIODE ${numSuivant} : ${JSON.stringify(synth.axes || [])}
${rappel}
Produis : un objectif de phase (une phrase), 4 à 6 actions concrètes (titre, description opérationnelle précise indiquant COMMENT faire, responsable suggéré, KPI mesurable avec une cible chiffrée réaliste), et 2 à 4 livrables de fin de phase.

Réponds UNIQUEMENT avec un objet JSON valide, sans backticks, sans texte avant ou après, au format exact :
{
  "periode": "${def.periode}",
  "objectif": "string",
  "actions": [{"titre":"string","description":"string","responsable":"string","kpi":"string"}],
  "livrables": ["string"]
}`;
  return callAndParse(prompt, { search: false, maxTokens: 2500 }, 3);
}

/* Orchestration du suivi : évaluation d'abord (elle nourrit les phases),
   puis les phases du plan suivant en parallèle. cloture=true en fin
   d'accompagnement : évaluation + bilan global, pas de plan suivant. */
async function generateSuivi(form, prevPlan, bilan, numPeriode, cloture, onStage) {
  onStage && onStage(`Étape 1 / ${cloture ? 1 : 2} — Analyse du bilan de la période ${numPeriode}…`);
  const synth = await generateBilanSynthese(form, prevPlan, bilan, numPeriode, cloture);
  if (cloture) return { synth, plan: null };

  const { cad } = suiviMeta(form);
  const nb = cad === 30 ? 1 : 3;
  onStage && onStage(`Étape 2 / 2 — Construction du plan de la période ${numPeriode + 1}…`);
  const phases = await Promise.all(
    Array.from({ length: nb }, (_, i) =>
      generatePhaseSuivi(form, synth, prevPlan, bilan, i, nb, numPeriode + 1))
  );
  return { synth, plan: phases };
}

function Logo({ size = 26 }) {
  const gid = React.useId().replace(/[^a-zA-Z0-9]/g, "");
  const letters = ["A", "C", "C", "C", "O", "M"];
  const refs = useRef([]);
  const [L, setL] = useState(null);

  const GAP = -3;      // lettres quasi collées
  const PAD = 8;       // marge (le M ne doit jamais être rogné)
  const ANGLE = 45;
  const SC = Math.cos((ANGLE * Math.PI) / 180);

  useLayoutEffect(() => {
    let dead = false;
    function measure() {
      if (dead) return;
      const b = refs.current.map((el) => el && el.getBBox());
      if (!b.every((x) => x && x.width > 0)) { requestAnimationFrame(measure); return; }

      let cur = PAD;
      const pos = [];
      b.forEach((box) => { pos.push(cur - box.x); cur += box.width + GAP; });
      const W = cur - GAP + PAD;

      const arc = [1, 2, 3, 4].map((i) => {
        const box = b[i];
        const cx = pos[i] + box.x + box.width / 2;
        return { i, cx, visLeft: cx - (box.width / 2) * SC, visRight: cx + (box.width / 2) * SC };
      });

      const gh = b[1].height;
      const tubeH = gh * 0.26;                 // fin, pour ne pas dépasser la courbe intérieure du C
      const midY = b[1].y + b[1].height / 2;
      const tubeY = midY - tubeH / 2;
      const tubeX = arc[0].visLeft;
      const tubeR = arc[3].visRight;   // le tube remplit tout le creux du O ; le O, redessiné
                                        // entier par-dessus, garde ses bords en encre nets.

      // frontières de couleur : au milieu de la partie gauche du 2e C, 3e C, O (cachées)
      const cut = [
        (arc[1].visLeft + arc[1].cx) / 2,
        (arc[2].visLeft + arc[2].cx) / 2,
        (arc[3].visLeft + arc[3].cx) / 2,
      ];

      setL({ pos, W, arc, tubeH, tubeY, tubeX, tubeR, cut, midY });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    else measure();
    return () => { dead = true; };
  }, []);

  const vbH = 92;
  const vbW = L ? L.W : 320;
  const h = size * 1.8, w = h * (vbW / vbH);

  const cols = ["var(--plum)", "var(--coral)", "var(--ocre)", "var(--ocre-light)"];
  const seg = L ? [
    { x: L.tubeX, x2: L.cut[0], fill: cols[0] },
    { x: L.cut[0], x2: L.cut[1], fill: cols[1] },
    { x: L.cut[1], x2: L.cut[2], fill: cols[2] },
    { x: L.cut[2], x2: L.tubeR, fill: cols[3] },
  ] : [];

  const tf = (a) => `translate(${a.cx} 0) scale(${SC} 1) translate(${-a.cx} 0)`;

  return (
    <svg className="logo" width={w} height={h} viewBox={`0 0 ${vbW} ${vbH}`}
      role="img" aria-label="ACCCOM" style={{ maxWidth: "100%", height: "auto", opacity: L ? 1 : 0 }}>
      {L && (
        <defs>
          {L.arc.map((a, j) => (
            <text key={j} id={"g" + j + gid} x={L.pos[a.i]} y="63" className="lg"
              fill="var(--ink)">{letters[a.i]}</text>
          ))}
          <clipPath id={"tube" + gid}>
            <rect x={L.tubeX} y={L.tubeY} width={L.tubeR - L.tubeX} height={L.tubeH} rx={L.tubeH / 2} />
          </clipPath>
          {L.arc.map((a, j) => (
            <clipPath key={j} id={"left" + j + gid}>
              <rect x={a.cx - vbW} y="-20" width={vbW} height={vbH + 40} />
            </clipPath>
          ))}
          {L.arc.map((a, j) => (
            <clipPath key={"r" + j} id={"right" + j + gid}>
              <rect x={a.cx} y="-20" width={vbW} height={vbH + 40} />
            </clipPath>
          ))}
          {/* moitié droite, sous l'axe exact du tube : la partie basse de l'arrière du C,
             reflétée pour fabriquer la partie haute extérieure identique. */}
          {L.arc.map((a, j) => (
            <clipPath key={"rb" + j} id={"rightBot" + j + gid}>
              <rect x={a.cx} y={L.tubeY + L.tubeH / 2} width={vbW} height={vbH} />
            </clipPath>
          ))}
          {/* moitié gauche, sous l'AXE EXACT du tube (tubeY + tubeH/2) : la partie basse du C
             avant, celle qui sera reflétée pour fabriquer la partie haute identique. */}
          {L.arc.map((a, j) => (
            <clipPath key={"lb" + j} id={"leftBot" + j + gid}>
              <rect x={a.cx - vbW} y={L.tubeY + L.tubeH / 2} width={vbW} height={vbH} />
            </clipPath>
          ))}
        </defs>
      )}

      {/* refs de mesure (invisibles) */}
      {letters.map((ch, i) => (
        <text key={"m" + i} ref={(el) => (refs.current[i] = el)} x={L ? L.pos[i] : 0}
          y="63" className="lg" opacity="0">{ch}</text>
      ))}

      {L && (
        <>
          {/* A et M à plat */}
          <text x={L.pos[0]} y="63" className="lg">{letters[0]}</text>
          <text x={L.pos[5]} y="63" className="lg">{letters[5]}</text>

          {/* 1) ARRIÈRE : sous le tube.
             - O : moitié droite entière.
             - C : moitié droite BASSE (rightBot), puis son MIROIR vertical autour de l'axe du
               tube pour la haute — comme pour l'avant, la courbe EXTÉRIEURE haute devient le
               reflet exact de la basse : identiques, sans rebord. */}
          {L.arc.map((a, j) =>
            j === 3 ? (
              <g key={"b" + j} transform={tf(a)} clipPath={"url(#right" + j + gid + ")"}>
                <use href={"#g" + j + gid} />
              </g>
            ) : (
              <React.Fragment key={"b" + j}>
                <g transform={tf(a)} clipPath={"url(#rightBot" + j + gid + ")"}>
                  <use href={"#g" + j + gid} />
                </g>
                <g transform={`translate(0 ${2 * (L.tubeY + L.tubeH / 2)}) scale(1 -1)`}>
                  <g transform={tf(a)} clipPath={"url(#rightBot" + j + gid + ")"}>
                    <use href={"#g" + j + gid} />
                  </g>
                </g>
              </React.Fragment>
            )
          )}

          {/* 2) TUBE color-blocking, par-dessus les extrémités arrière */}
          <g clipPath={"url(#tube" + gid + ")"}>
            {seg.map((s, i) => (
              <rect key={i} x={s.x} y={L.tubeY} width={Math.max(0, s.x2 - s.x)} height={L.tubeH} style={{ fill: s.fill }} />
            ))}
          </g>

          {/* 3) AVANT : par-dessus le tube.
             - O (fermé) : lettre entière.
             - C : moitié gauche BASSE (leftBot, sous l'axe exact du tube), puis la moitié HAUTE
               = son MIROIR VERTICAL autour de ce même axe (axeY = tubeY + tubeH/2). Haut et bas
               sont donc rigoureusement identiques, et le reflet est centré pile sur le tube. */}
          {L.arc.map((a, j) =>
            j === 3 ? (
              <g key={"f" + j} transform={tf(a)}><use href={"#g" + j + gid} /></g>
            ) : (
              <React.Fragment key={"f" + j}>
                <g transform={tf(a)} clipPath={"url(#leftBot" + j + gid + ")"}>
                  <use href={"#g" + j + gid} />
                </g>
                <g transform={`translate(0 ${2 * (L.tubeY + L.tubeH / 2)}) scale(1 -1)`}>
                  <g transform={tf(a)} clipPath={"url(#leftBot" + j + gid + ")"}>
                    <use href={"#g" + j + gid} />
                  </g>
                </g>
              </React.Fragment>
            )
          )}
        </>
      )}
    </svg>
  );
}

/* Rendu des phases d'un plan (partagé entre le document initial et les suivis) */
function PhaseList({ plan }) {
  return (plan || []).map((ph, i) => (
    <div key={i} className={`phase ph-${i}`}>
      <div className="phase-head">
        <span className="p-num">{["J30", "J60", "J90"][i] || ph.periode}</span>
        <span className="p-per">{ph.periode}</span>
        <span className="p-obj">{ph.objectif}</span>
      </div>
      {(ph.actions || []).map((a, j) => {
        // découpe la description en sous-étapes si elle contient "(1) … (2) …"
        let intro = a.description, steps = [];
        if (/\(\d+\)/.test(a.description || "")) {
          const m = String(a.description).split(/\((\d+)\)/);
          intro = m[0].trim().replace(/[:\-–—]\s*$/, "").trim();
          for (let k = 1; k < m.length; k += 2) {
            const txt = (m[k + 1] || "").trim().replace(/^[,:]\s*/, "");
            if (txt) steps.push(txt);
          }
        }
        return (
          <div key={j} className="action">
            <span className="a-n">{j + 1}</span>
            <div className="a-body">
              <b className="a-titre">{a.titre}</b>
              {steps.length > 0 ? (
                <>
                  {intro && <p className="a-desc">{intro} :</p>}
                  <ul className="a-steps">
                    {steps.map((st, s) => <li key={s}>{st}</li>)}
                  </ul>
                </>
              ) : (
                <p className="a-desc">{a.description}</p>
              )}
              {a.responsable && (
                <span className="a-pilote"><em>Pilote</em>{a.responsable}</span>
              )}
            </div>
            <div className="a-kpi"><small>Indicateur</small>{a.kpi}</div>
          </div>
        );
      })}
      {ph.livrables && ph.livrables.length > 0 && (
        <div className="livrables"><b>Livrables de phase</b> — {ph.livrables.join(" · ")}</div>
      )}
    </div>
  ));
}

/* ---- formulaire de bilan de période (observation des résultats) ---- */
function BilanForm({ numPeriode, cloture, onCancel, onSubmit, busy }) {
  const [b, setB] = useState(EMPTY_BILAN);
  const setK = (k) => (e) => setB({ ...b, [k]: e.target.value });
  const filled = Object.values(b).some((v) => v.trim().length > 0);
  return (
    <div className="fcard">
      <h3>{cloture ? `Bilan de clôture — période ${numPeriode}` : `Bilan de la période ${numPeriode}`}</h3>
      <div className="sub">
        Consignez ce qui a été observé sur la période écoulée. {cloture
          ? "C'est la dernière période : un bilan global de l'accompagnement sera produit, avec des recommandations pour la suite."
          : `À partir de ces observations, l'évaluation de la période et le plan d'action de la période ${numPeriode + 1} seront générés en continuité.`}
        {" "}Plus le bilan est précis (chiffres, faits), plus la suite sera pertinente — les champs sans objet peuvent rester vides.
      </div>
      {Object.entries(BILAN_LABELS).map(([k, [lab, hint]]) => (
        <Field key={k} label={lab} hint={hint}>
          <textarea value={b[k]} onChange={setK(k)} />
        </Field>
      ))}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
        <button className="btn btn-ghost" onClick={onCancel} disabled={busy}>Annuler</button>
        <button className="btn btn-primary" disabled={!filled || busy} onClick={() => onSubmit(b)}>
          {busy ? "Génération…" : cloture ? "Générer le bilan de clôture" : `Générer le bilan et le plan de la période ${numPeriode + 1}`}
        </button>
      </div>
    </div>
  );
}

/* ---------------- export du document (impression PDF) ---------------- */
function exportDocument(client, label) {
  const zone = document.querySelector(".print-zone");
  if (!zone) return false;
  const name = (client.form.entreprise || "client").replace(/[^\p{L}\p{N}]+/gu, "-");
  const suffix = label || `plan_${client.form.duree}j`;
  const html = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACCCOM — ${client.form.entreprise} — ${suffix.replace(/_/g, " ")}</title>
<style>
${CSS}
body{ margin:0; background:#EDEFEC; font-family:'Onest',sans-serif;}
.export-wrap{ max-width:900px; margin:0 auto; padding:30px 16px;}
.docsheet{ background:#fff;}
.printbar{ position:sticky; top:0; z-index:50; display:flex; justify-content:center; gap:10px;
  padding:14px; background:rgba(240,233,229,.92); backdrop-filter:blur(6px); border-bottom:1px solid #E8DAD5;}
.printbar button{ font-family:'Onest',sans-serif; font-weight:600; font-size:15px; color:#fff;
  background:#7D4E66; border:none; border-radius:12px; padding:12px 26px; cursor:pointer;}
.printbar button:hover{ background:#5A3348;}
.printbar span{ align-self:center; font-size:13px; color:#6B5A5E;}
@media print{
  body{ background:#fff;}
  .printbar{ display:none;}
  .export-wrap{ max-width:none; padding:0;}
  .docsheet{ border:none; box-shadow:none; border-radius:0; padding:10px 0; margin:0;}
}
</style>
</head>
<body class="acd">
<div class="printbar">
  <button onclick="window.print()">Imprimer / Enregistrer en PDF</button>
  <span>Choisissez « Enregistrer au format PDF » comme imprimante.</span>
</div>
<div class="export-wrap">${zone.innerHTML}</div>
</body>
</html>`;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ACCCOM_${name}_${suffix}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

/* ---------------- Client detail ---------------- */
const FORM_LABELS = {
  contact: "Contact", secteur: "Secteur", effectif: "Effectif", ca: "Chiffre d'affaires",
  anciennete: "Ancienneté", zone: "Zone géographique", offre: "Offre", cibles: "Clients cibles",
  canaux: "Canaux de vente", forcesPercues: "Forces perçues", faiblessesPercues: "Faiblesses perçues",
  equipeCommerciale: "Équipe commerciale", outils: "Outils", processusVente: "Processus de vente",
  positionnementPrix: "Positionnement prix", notoriete: "Notoriété / image", budgetMarketing: "Budget marketing",
  objectifsChiffres: "Objectifs chiffrés", priorites: "Priorités", attentes: "Attentes",
  contraintes: "Contraintes", problematique: "Problématique ciblée",
};

function ClientDetail({ client, onBack, onEditAudit, onRegenerate, onAddDoc, onDeleteDoc, onDelete, generating, genStage, genError, onBilanSubmit, suiviBusy, suiviStage, suiviError }) {
  const [tab, setTab] = useState(client.result ? "plan" : "audit");
  const [openDoc, setOpenDoc] = useState(null);
  const [exportMsg, setExportMsg] = useState("");
  const f = client.form;

  /* ---- arborescence du suivi (formule accompagnement) ---- */
  const isAccomp = f.formule === "accompagnement";
  const meta = suiviMeta(f);
  const periodes = client.periodes || [];
  const nPlan = nbPlanifiees(client);                 // périodes dont le plan existe
  const startAt = client.resultAt || client.createdAt;
  const [viewKey, setViewKey] = useState(null);        // "p1" … "pN" | "cloture"
  const [bilanOpen, setBilanOpen] = useState(false);
  const [showObs, setShowObs] = useState(false);
  // vue par défaut : le document le plus récent
  const curKey = client.cloture ? "cloture" : "p" + nPlan;
  const shownKey = viewKey || curKey;
  const shownPeriode = shownKey.startsWith("p") ? parseInt(shownKey.slice(1), 10) : null;
  const exportLabel = shownKey === "cloture" ? "bilan_cloture"
    : shownPeriode === 1 ? `periode1_plan_${f.duree}j`
    : `periode${shownPeriode}_bilan_et_plan`;

  const rows = [];
  if (isAccomp) {
    for (let n = 1; n <= meta.total; n++) {
      rows.push({
        n,
        debut: addDays(startAt, (n - 1) * meta.cad),
        fin: addDays(startAt, n * meta.cad),
        planned: n <= nPlan,
        current: n === nPlan && !client.cloture,
      });
    }
  }
  // replie les périodes lointaines pour garder l'arborescence lisible
  const visible = rows.filter((r) => r.planned || r.n <= nPlan + 2);
  const hidden = rows.length - visible.length;

  return (
    <div className="wrap">
      <div className="page-head" style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 16, flexWrap: "wrap" }}>
        <div>
          <h1>{f.entreprise}</h1>
          <p>{f.secteur || "Secteur non renseigné"} · audit réalisé le {fmtDate(client.createdAt)} · {
            isAccomp ? `accompagnement ${accompLabel(meta.months)}, suivi ${cadLabel(meta.cad)}`
            : f.formule === "cible" ? `problématique ciblée, plan ${f.duree} jours`
            : `formule ${f.duree} jours`}</p>
        </div>
        <button className="btn btn-ghost" onClick={onBack}>← Dossiers</button>
      </div>

      <div className="tabs">
        <button className={"tab" + (tab === "plan" ? " active" : "")} onClick={() => setTab("plan")}>{isAccomp ? "Suivi de l'accompagnement" : "Diagnostic & plan d'action"}</button>
        <button className={"tab" + (tab === "audit" ? " active" : "")} onClick={() => setTab("audit")}>Formulaire d'audit</button>
        <button className={"tab" + (tab === "docs" ? " active" : "")} onClick={() => setTab("docs")}>Documents ({(client.documents || []).length})</button>
      </div>

      {tab === "plan" && (
        <div style={{ paddingBottom: 60 }}>
          {generating && (
            <div className="gen-overlay">
              <div className="spin" />
              <h2>Analyse en cours…</h2>
              <p>{genStage || `ACCCOM croise les données de l'audit pour construire le diagnostic et le plan d'action ${f.duree} jours.`}</p>
              <p style={{ fontSize: 12.5, marginTop: 10, color: "var(--faint)" }}>{CFG.search() ? "Recherche web activée : comptez environ une minute." : "Mode rapide : la synthèse et les phases du plan sont générées en parallèle."}</p>
            </div>
          )}
          {!generating && genError && <div className="err">La génération a échoué : {genError} <button className="btn btn-soft" style={{ marginLeft: 10 }} onClick={onRegenerate}>Réessayer</button></div>}
          {!generating && client.result && (
            <>
              {/* ---- arborescence du suivi : une ligne par période ---- */}
              {isAccomp && (
                <>
                  <div className="suivi-head">
                    <div className="big">Accompagnement {accompLabel(meta.months)} · suivi {cadLabel(meta.cad)}</div>
                    <div className="sub2">
                      {client.cloture
                        ? `Accompagnement clôturé — ${meta.total} période${meta.total > 1 ? "s" : ""} réalisée${meta.total > 1 ? "s" : ""}.`
                        : <>Période <b>{nPlan}</b> sur {meta.total} en cours · bilan de période prévu vers le {fmtDate(addDays(startAt, nPlan * meta.cad))}</>}
                    </div>
                    <div className="progressbar"><i style={{ width: `${Math.round(((client.cloture ? meta.total : nPlan - 0.5) / meta.total) * 100)}%` }} /></div>
                  </div>

                  <div className="tl">
                    {visible.map((r) => (
                      <div key={r.n} className={"tl-row" + (r.current ? " cur" : r.planned ? " done" : "") + (shownKey === "p" + r.n ? " sel-row" : "")}>
                        <span className="tl-dot" />
                        <div className="tl-meta">
                          <b>Période {r.n}</b>
                          <span>{fmtDate(r.debut)} → {fmtDate(r.fin)}{r.n === 1 ? " · audit & plan initial" : r.planned ? ` · bilan P${r.n - 1} & plan P${r.n}` : ""}</span>
                        </div>
                        {r.planned ? (
                          <>
                            <span className={"pill " + (r.current ? "cur" : "ok")}>{r.current ? "En cours" : "Réalisée"}</span>
                            <button className="btn btn-soft" onClick={() => { setViewKey("p" + r.n); setBilanOpen(false); setExportMsg(""); }}>Consulter</button>
                            {r.current && !suiviBusy && (
                              <button className="btn btn-primary" onClick={() => { setViewKey("p" + r.n); setBilanOpen(true); setExportMsg(""); }}>
                                {r.n < meta.total ? `Remplir le bilan de la période ${r.n}` : "Bilan de clôture"}
                              </button>
                            )}
                          </>
                        ) : (
                          <span className="pill fut">À venir</span>
                        )}
                      </div>
                    ))}
                    {hidden > 0 && <div className="tl-more">… puis {hidden} période{hidden > 1 ? "s" : ""} à venir, au même rythme.</div>}
                    {(client.cloture || nPlan === meta.total) && (
                      <div className={"tl-row" + (client.cloture ? " done" : "") + (shownKey === "cloture" ? " sel-row" : "")}>
                        <span className="tl-dot" />
                        <div className="tl-meta">
                          <b>Clôture de l'accompagnement</b>
                          <span>{client.cloture ? `Bilan de clôture établi le ${fmtDate(client.cloture.at)}` : `À l'issue de la période ${meta.total}`}</span>
                        </div>
                        {client.cloture
                          ? <><span className="pill ok">Clôturé</span><button className="btn btn-soft" onClick={() => { setViewKey("cloture"); setBilanOpen(false); setExportMsg(""); }}>Consulter</button></>
                          : <span className="pill fut">À venir</span>}
                      </div>
                    )}
                  </div>

                  {suiviBusy && (
                    <div className="gen-overlay">
                      <div className="spin" />
                      <h2>Bilan en cours d'analyse…</h2>
                      <p>{suiviStage || "ACCCOM évalue les résultats de la période et prépare la suite."}</p>
                    </div>
                  )}
                  {!suiviBusy && suiviError && <div className="err">La génération du suivi a échoué : {suiviError} — vos observations saisies restent affichées ci-dessous, réessayez sans les ressaisir.</div>}
                </>
              )}

              {/* ---- formulaire de bilan ou document affiché ---- */}
              {isAccomp && bilanOpen ? (
                <BilanForm
                  numPeriode={nPlan}
                  cloture={nPlan >= meta.total}
                  busy={suiviBusy}
                  onCancel={() => setBilanOpen(false)}
                  onSubmit={async (b) => {
                    const ok = await onBilanSubmit(b);
                    if (ok) { setBilanOpen(false); setViewKey(null); }
                  }} />
              ) : (
                <>
                  <div className="doc-actions">
                    <button className="btn btn-primary" onClick={() => {
                      const ok = exportDocument(client, exportLabel);
                      if (ok) setExportMsg("Document téléchargé — ouvrez-le puis cliquez sur « Imprimer / Enregistrer en PDF ».");
                    }}>Télécharger le document (PDF)</button>
                    <button className="btn btn-ghost" onClick={() => { try { window.print(); } catch (e) { console.error(e); } }}>Imprimer depuis cette page</button>
                    {periodes.length === 0 && !client.cloture && (
                      <button className="btn btn-ghost" onClick={onRegenerate}>Régénérer le diagnostic</button>
                    )}
                  </div>
                  {exportMsg && <div className="export-note">{exportMsg}</div>}
                  <div className="print-zone">
                    {shownKey === "cloture" && client.cloture
                      ? <ClotureDocument client={client} cloture={client.cloture} />
                      : shownPeriode > 1 && periodes[shownPeriode - 2]
                        ? <SuiviDocument client={client} periode={periodes[shownPeriode - 2]} />
                        : <PlanDocument client={client} result={client.result} />}
                  </div>
                  {/* observations brutes du consultant (interne, hors document client) */}
                  {isAccomp && ((shownPeriode > 1 && periodes[shownPeriode - 2]) || (shownKey === "cloture" && client.cloture)) && (
                    <div className="obs-int">
                      <div className="d-head" onClick={() => setShowObs(!showObs)}>
                        <b>Observations saisies lors du bilan (interne)</b>
                        <span>{showObs ? "▴" : "▾"}</span>
                      </div>
                      {showObs && (
                        <dl className="kv">
                          {Object.entries(BILAN_LABELS).map(([k, [lab]]) => {
                            const src = shownKey === "cloture" ? client.cloture.bilan : periodes[shownPeriode - 2].bilan;
                            return src && src[k] ? (
                              <React.Fragment key={k}><dt>{lab}</dt><dd>{src[k]}</dd></React.Fragment>
                            ) : null;
                          })}
                        </dl>
                      )}
                    </div>
                  )}
                </>
              )}
            </>
          )}
          {!generating && !client.result && !genError && (
            <div className="empty">
              <div className="big">Aucun diagnostic généré</div>
              <p>Lancez l'analyse pour produire le SWOT et le plan d'action {f.duree} jours.</p>
              <div style={{ marginTop: 18 }}><button className="btn btn-primary" onClick={onRegenerate}>Générer le diagnostic</button></div>
            </div>
          )}
        </div>
      )}

      {tab === "audit" && (
        <div style={{ paddingBottom: 60 }}>
          <div className="doc-actions">
            <button className="btn btn-ghost" onClick={onEditAudit}>Modifier l'audit</button>
            <button className="btn btn-danger" onClick={onDelete}>Supprimer le dossier</button>
          </div>
          <div className="fcard">
            <h3>Audit du {fmtDate(client.createdAt)}</h3>
            <div className="sub">Données saisies le jour de l'audit.</div>
            <dl className="kv">
              {Object.entries(FORM_LABELS).map(([k, lab]) =>
                f[k] ? (<React.Fragment key={k}><dt>{lab}</dt><dd>{f[k]}</dd></React.Fragment>) : null
              )}
            </dl>
          </div>
        </div>
      )}

      {tab === "docs" && (
        <div style={{ paddingBottom: 60 }}>
          <div className="doc-actions">
            <button className="btn btn-primary" onClick={onAddDoc}>+ Ajouter un document</button>
          </div>
          {(client.documents || []).length === 0 && (
            <div className="empty">
              <div className="big">Aucun document</div>
              <p>Ajoutez ici vos comptes rendus, notes de suivi, avenants ou tout autre document lié à ce client.</p>
            </div>
          )}
          {(client.documents || []).map((d) => (
            <div key={d.id} className="doc-row">
              <div className="d-head" onClick={() => setOpenDoc(openDoc === d.id ? null : d.id)}>
                <b>{d.titre}</b>
                <span>{fmtDate(d.date)} {openDoc === d.id ? "▴" : "▾"}</span>
              </div>
              {openDoc === d.id && (
                <div className="d-body">
                  {d.contenu}
                  <div style={{ marginTop: 12 }}>
                    <button className="btn btn-danger" onClick={() => onDeleteDoc(d.id)}>Supprimer ce document</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SettingsModal({ onClose, onDataChanged, cloudUser, syncState, onCloudInit, onSync }) {

  const [model, setModel] = useState(CFG.model());
